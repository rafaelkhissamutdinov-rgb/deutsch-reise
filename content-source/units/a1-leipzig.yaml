id: a1-leipzig
level: A1
city: Leipzig
country: DE
title: Einkaufen, Essen & Stadt
title_ru: Покупки, еда и город
intro: |
  В Лейпциге вы ходите за покупками, заказываете еду в кафе, спрашиваете дорогу и записываетесь к врачу.
  Грамматика юнита: модальные глаголы, повелительное наклонение, прошедшее время Perfekt, Dativ после предлогов и личные местоимения в Akk. и Dat.
  Везде, где в Австрии говорят иначе (Semmel, Paradeiser, Sackerl, e-card), это отмечено.

grammar:
  # ------------------------------------------------------------------
  - id: le-g-modalverben
    title: "Modalverben: können, müssen, wollen, dürfen, sollen, möchten"
    title_ru: Модальные глаголы
    terms:
      - t: Modalverb
        ru: модальный глагол — выражает возможность, необходимость, желание, разрешение (können, müssen …)
      - t: Infinitiv
        ru: начальная форма глагола (kaufen, einkaufen)
      - t: Präsens
        ru: настоящее время
      - t: Position 2
        ru: второе место в предложении — здесь стоит спрягаемый глагол
      - t: Satzklammer
        ru: "«рамка»: спрягаемый глагол на 2-м месте, вторая часть сказуемого (здесь инфинитив) — в конце"
      - t: man
        ru: неопределённо-личное местоимение («люди, все»); глагол — как у er/sie/es (man darf, man kann)
    meaning: |
      Модальный глагол показывает отношение к действию: können — могу/умею, müssen — должен/надо, wollen — хочу (прямо), dürfen — можно/разрешено, sollen — следует (так говорит кто-то другой), möchten — хотел(а) бы (вежливо).
      Модальный глагол спрягается и стоит на 2-м месте. Основной глагол стоит в инфинитиве в самом конце. Это и есть Satzklammer.
      У ich и er/sie/es формы одинаковые и без окончания: ich kann — er kann, ich muss — sie muss. В ед. ч. у большинства модальных глаголов меняется гласная: können → ich kann, dürfen → ich darf, wollen → ich will.
    steps:
      - de: Ich kaufe Brot. → Ich muss Brot kaufen.
        ru: muss стоит на 2-м месте, kaufen уходит в конец в инфинитиве.
      - de: Du kannst hier mit Karte zahlen.
        ru: du → kannst (окончание -st), инфинитив zahlen — в конце.
      - de: Hier darf man nicht parken.
        ru: "dürfen + nicht = «нельзя». man → форма как у er: darf."
      - de: Musst du heute noch einkaufen?
        ru: В вопросе без вопросительного слова модальный глагол на 1-м месте. Отделяемый глагол в инфинитиве пишется слитно.
      - de: Ich soll viel Tee trinken. Das sagt die Ärztin.
        ru: sollen — совет или указание другого человека.
      - de: Ich möchte zwei Brötchen.
        ru: После möchten инфинитив можно не говорить, если смысл ясен (… haben).
    table:
      head: [Person, können, müssen, wollen, dürfen, sollen, möchten]
      rows:
        - [ich, kann, muss, will, darf, soll, möchte]
        - [du, kannst, musst, willst, darfst, sollst, möchtest]
        - [er/sie/es/man, kann, muss, will, darf, soll, möchte]
        - [wir, können, müssen, wollen, dürfen, sollen, möchten]
        - [ihr, könnt, müsst, wollt, dürft, sollt, möchtet]
        - [sie/Sie, können, müssen, wollen, dürfen, sollen, möchten]
    exam: |
      Модальные глаголы нужны во всех частях A1. В Sprechen Teil 3 вы просите: «Kann ich …?», «Können Sie bitte …?». В письме отказываетесь или договариваетесь: «Ich kann leider nicht kommen.» На табличках и в объявлениях: «Hier darf man nicht rauchen.» Проверяют форму глагола и инфинитив в конце.
    traps:
      - "ich и er без окончания: ich kann (не «ich kanne»), er muss (не «er musst»)."
      - "Инфинитив — в самом конце: Ich kann heute nicht kommen. (не «Ich kann kommen heute nicht.»)"
      - "Отделяемый глагол в инфинитиве пишется слитно: Ich muss noch einkaufen. Kann ich die Hose anprobieren?"
      - "nicht müssen = «не нужно, не обязательно»: Du musst nicht bezahlen. «Нельзя» — nicht dürfen: Hier darf man nicht parken."
      - "Ich will … звучит прямо и иногда грубо. В магазине и кафе вежливо: Ich möchte … / Ich hätte gern …"
    exercises:
      - type: choice
        q: Ich ___ heute leider nicht kommen.
        options: [kann, kannst, können]
        answer: kann
        why: ich → kann, без окончания.
      - type: choice
        q: Im Museum ___ man nicht fotografieren. (нельзя)
        options: [darf, muss, will]
        answer: darf
        why: «Нельзя» = nicht dürfen.
      - type: choice
        q: Was ___ du trinken? – Einen Tee, bitte.
        options: [möchtest, möchte, möchten]
        answer: möchtest
        why: du → möchtest.
      - type: choice
        q: Du musst nicht bezahlen. — Что это значит?
        options:
          - Тебе не нужно платить.
          - Тебе нельзя платить.
          - Ты не можешь платить.
        answer: Тебе не нужно платить.
        why: nicht müssen = не обязательно.
      - type: gap
        q: Du ___ viel Wasser trinken. Das sagt der Arzt. (sollen)
        answer: [sollst]
        why: du → sollst.
      - type: gap
        q: ___ ihr am Samstag mitkommen? (wollen)
        answer: [Wollt]
        why: ihr → wollt; в вопросе глагол на 1-м месте.
      - type: gap
        q: Wir ___ noch Milch kaufen. (müssen)
        answer: [müssen]
      - type: gap
        q: Mein Bruder ___ sehr gut kochen. (können)
        answer: [kann]
        why: er → kann, без окончания.
      - type: order
        answer: Ich möchte zwei Kilo Tomaten kaufen.
        tokens: [Ich, möchte, zwei Kilo Tomaten, kaufen]
        ru: Я хотел(а) бы купить два килограмма помидоров.
      - type: order
        answer: Kann ich die Jacke anprobieren?
        tokens: [Kann, ich, die Jacke, anprobieren]
        ru: Можно мне примерить куртку?
      - type: order
        answer: Wir müssen am Sonntag nicht arbeiten.
        tokens: [Wir, müssen, am Sonntag, nicht, arbeiten]
        ru: В воскресенье нам не нужно работать.
      - type: table
        title: dürfen — Präsens
        head: [Person, Form]
        rows:
          - [ich, "?darf"]
          - [du, "?darfst"]
          - [er/sie/es, "?darf"]
          - [wir, "?dürfen"]
          - [ihr, "?dürft"]

  # ------------------------------------------------------------------
  - id: le-g-imperativ
    title: Imperativ (du / ihr / Sie)
    title_ru: Повелительное наклонение
    terms:
      - t: Imperativ
        ru: повелительное наклонение — просьба, совет, указание (Komm! Gehen Sie links!)
      - t: du-Form
        ru: обращение к одному человеку на «ты»
      - t: ihr-Form
        ru: обращение к нескольким людям на «ты» (дети, друзья)
      - t: Sie-Form
        ru: вежливое обращение на «вы» к одному или нескольким людям
      - t: Präsens
        ru: настоящее время — от его форм строится Imperativ
      - t: Verbstamm
        ru: основа глагола — инфинитив без -en (kauf-, nehm-)
      - t: trennbares Verb
        ru: глагол с отделяемой приставкой (ab·biegen, aus·steigen); в Imperativ приставка стоит в конце
      - t: Umlaut
        ru: точки над гласной (a → ä); в du-форме Imperativ умлаут пропадает (fährst → fahr!)
    meaning: |
      Imperativ — форма просьбы, совета или указания. Глагол стоит на 1-м месте.
      du-форма: берём du-форму настоящего времени и убираем du и -st: du kaufst → Kauf! Смена e → i/ie остаётся (du nimmst → Nimm!), умлаут a → ä пропадает (du fährst → Fahr!).
      ihr-форма = форма настоящего времени без ihr: ihr kommt → Kommt!
      Sie-форма = инфинитив + Sie: Gehen Sie! Местоимение Sie обязательно.
      Отделяемая приставка уходит в конец: Steig hier aus! Чтобы было вежливее, добавляют bitte.
    steps:
      - de: du nimmst → Nimm die Tabletten!
        ru: "Убираем du и -st. Смена e → i сохраняется: nimm."
      - de: du fährst → Fahr bitte langsam!
        ru: "Умлаут пропадает: fahr (не «fähr»)."
      - de: ihr kommt → Kommt bitte pünktlich!
        ru: ihr-форма = настоящее время без ihr.
      - de: Sie gehen → Gehen Sie hier geradeaus!
        ru: Sie остаётся и стоит сразу после глагола.
      - de: du steigst aus → Steig am Markt aus!
        ru: Отделяемая приставка aus — в конце предложения.
      - de: "sein: Sei ruhig! – Seid leise! – Seien Sie bitte pünktlich!"
        ru: У sein особые формы, их нужно запомнить.
    table:
      head: [Infinitiv, du, ihr, Sie]
      rows:
        - [kaufen, kauf!, kauft!, kaufen Sie!]
        - [nehmen, nimm!, nehmt!, nehmen Sie!]
        - [fahren, fahr!, fahrt!, fahren Sie!]
        - [warten, warte!, wartet!, warten Sie!]
        - [ab·biegen, bieg … ab!, biegt … ab!, biegen Sie … ab!]
        - [sein, sei!, seid!, seien Sie!]
    exam: |
      Imperativ часто встречается в табличках и объявлениях (Lesen) и в аудиотекстах: в описании дороги («Gehen Sie links!»), у врача («Nehmen Sie die Tabletten!»). В Sprechen Teil 3 просьбу можно сказать и так: «Geben Sie mir bitte …!»
    traps:
      - "du-форма без -st и без du: Komm! (не «Kommst!» и не «Komm du!»)."
      - "e → i/ie остаётся: essen → iss!, lesen → lies!, geben → gib! Умлаут пропадает: fahren → fahr!, schlafen → schlaf!"
      - "Глаголы на -t/-d получают -e: warten → warte!, finden → finde! У других -e возможно (kaufe!), но в разговоре обычно без него."
      - "В Sie-форме местоимение обязательно: Warten Sie bitte! (не «Warten bitte!»)."
      - "Отделяемая приставка — в конце: Ruf mich an! Zieh die Jacke an!"
    exercises:
      - type: choice
        q: ___ bitte langsam! (du, sprechen)
        options: [Sprich, Sprech, Sprichst]
        answer: Sprich
        why: du sprichst → Sprich! (e → i остаётся, -st и du убираем).
      - type: choice
        q: Frau Lenz, ___ Sie bitte einen Moment!
        options: [warten, wartet, warte]
        answer: warten
        why: Sie-форма = инфинитив + Sie.
      - type: choice
        q: Какая форма правильная?
        options:
          - Fahr nicht so schnell!
          - Fähr nicht so schnell!
          - Fährst nicht so schnell!
        answer: Fahr nicht so schnell!
        why: В du-форме Imperativ умлаут пропадает.
      - type: choice
        q: Вы говорите с господином Вебером. Что правильно?
        options:
          - Sei bitte pünktlich!
          - Seid bitte pünktlich!
          - Seien Sie bitte pünktlich!
        answer: Seien Sie bitte pünktlich!
        why: Вежливая форма от sein — seien Sie.
      - type: gap
        q: ___ die Tabletten dreimal am Tag! (du, nehmen)
        answer: [Nimm]
        why: du nimmst → Nimm!
      - type: gap
        q: Kinder, ___ bitte leise! (sein)
        answer: [seid]
        why: ihr-форма от sein — seid.
      - type: gap
        q: ___ Sie an der Ampel links ab! (abbiegen)
        answer: [Biegen]
        why: Sie-форма; приставка ab стоит в конце.
      - type: gap
        q: Lena, ___ die Jacke an! Es ist kalt. (anziehen)
        answer: [zieh, ziehe]
        why: du-форма; приставка an — в конце.
      - type: gap
        q: ___ an der nächsten Haltestelle aus! (ihr, aussteigen)
        answer: [Steigt]
        why: ihr steigt aus → Steigt … aus!
      - type: order
        answer: Gehen Sie hier immer geradeaus!
        tokens: [Gehen, Sie, hier, immer, geradeaus]
        ru: Идите здесь всё время прямо!
      - type: order
        answer: Ruf mich bitte heute Abend an!
        tokens: [Ruf, mich, bitte, heute Abend, an]
        ru: Позвони мне, пожалуйста, сегодня вечером!
      - type: table
        title: Imperativ
        head: [Infinitiv, du, ihr, Sie]
        rows:
          - [nehmen, "?nimm", "?nehmt", "?nehmen Sie"]
          - [essen, "?iss", "?esst", "?essen Sie"]
          - [geben, "?gib", "?gebt", "?geben Sie"]
          - [sein, "?sei", "?seid", "?seien Sie"]

  # ------------------------------------------------------------------
  - id: le-g-perfekt
    title: Perfekt mit haben und sein; war und hatte
    title_ru: Прошедшее время Perfekt; war и hatte
    terms:
      - t: Perfekt
        ru: прошедшее время, которое используют в разговоре и в письмах (Ich habe gekauft.)
      - t: Präteritum
        ru: простое прошедшее время; на A1 нужно только у sein и haben (war, hatte)
      - t: Hilfsverb
        ru: "вспомогательный глагол: haben или sein, стоит на 2-м месте и спрягается"
      - t: Partizip II
        ru: причастие прошедшего времени (gekauft, getrunken), стоит в конце предложения
      - t: Satzklammer
        ru: "«рамка»: Hilfsverb на 2-м месте, Partizip II — в конце"
      - t: regelmäßig
        ru: "правильный (слабый) глагол: Partizip II = ge- + основа + -t (gekauft)"
      - t: unregelmäßig
        ru: "неправильный (сильный) глагол: ge- + … + -en, часто с другой гласной (getrunken); формы нужно учить"
      - t: trennbares Verb
        ru: глагол с отделяемой приставкой; ge- стоит после приставки (eingekauft)
    meaning: |
      Perfekt — обычное прошедшее время в разговоре. Схема: haben или sein (Hilfsverb) на 2-м месте + Partizip II в конце.
      Большинство глаголов — с haben. С sein — глаголы движения из одного места в другое (gehen, fahren, kommen, fliegen, aussteigen), некоторые глаголы изменения состояния (aufstehen, einschlafen) и глаголы sein и bleiben.
      Partizip II правильных глаголов: ge- … -t (kaufen → gekauft). Неправильных: ge- … -en (trinken → getrunken, nehmen → genommen).
      Отделяемые глаголы: приставка + ge + основа (einkaufen → eingekauft). Без ge-: глаголы на -ieren (fotografiert) и с неотделяемыми приставками be-, ver-, er-, emp- (bezahlt, bestellt, empfohlen).
      От sein и haben в прошедшем обычно используют Präteritum: Ich war krank. Ich hatte Fieber.
    steps:
      - de: Ich kaufe Brot. → Ich habe Brot gekauft.
        ru: habe на 2-м месте, gekauft — в конце.
      - de: Wir trinken Kaffee. → Wir haben Kaffee getrunken.
        ru: "Неправильный глагол: ge- + -en, гласная i → u."
      - de: Sie fährt in die Stadt. → Sie ist in die Stadt gefahren.
        ru: Движение из точки А в точку Б → sein.
      - de: Ich kaufe ein. → Ich habe eingekauft.
        ru: "Отделяемый глагол: ein + ge + kauft."
      - de: Er bezahlt die Rechnung. → Er hat die Rechnung bezahlt.
        ru: Приставка be- не отделяется → без ge-.
      - de: Gestern war ich krank und hatte Fieber.
        ru: "Для sein и haben — Präteritum: war, hatte."
    table:
      head: [Infinitiv, Hilfsverb, Partizip II]
      rows:
        - [kaufen, hat, gekauft]
        - [machen, hat, gemacht]
        - [essen, hat, gegessen]
        - [trinken, hat, getrunken]
        - [nehmen, hat, genommen]
        - [ein·kaufen, hat, eingekauft]
        - [an·rufen, hat, angerufen]
        - [bezahlen, hat, bezahlt]
        - [fotografieren, hat, fotografiert]
        - [gehen, ist, gegangen]
        - [fahren, ist, gefahren]
        - [kommen, ist, gekommen]
        - [aus·steigen, ist, ausgestiegen]
        - [bleiben, ist, geblieben]
    exam: |
      Perfekt часто звучит в аудиотекстах и сообщениях на автоответчике («Ich habe den Termin vergessen.»). В письме и в разговоре он нужен, чтобы рассказать, что уже случилось. Типичные ошибки: haben вместо sein у глаголов движения и Partizip II не в конце.
    traps:
      - "Partizip II — в конце: Ich habe gestern Brot gekauft. (не «Ich habe gekauft gestern Brot.»)"
      - "Движение → sein: Ich bin nach Hause gegangen. (не «Ich habe gegangen.»)"
      - "Без ge-: bezahlt, bestellt, verkauft, empfohlen, fotografiert, probiert."
      - "Отделяемые: ge внутри — eingekauft, angerufen, ausgestiegen. Но anprobieren → anprobiert (на -ieren, без ge-)."
      - "sein и haben в прошедшем: обычно Ich war beim Arzt. Ich hatte keine Zeit. Форма ist gewesen тоже правильная, но звучит реже."
      - "Präteritum sein: ich war, du warst, er war, wir waren, ihr wart, sie waren. haben: ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten."
    exercises:
      - type: choice
        q: Wir ___ gestern ins Kino gegangen.
        options: [sind, haben, waren]
        answer: sind
        why: gehen — движение → sein.
      - type: choice
        q: Ich habe die Rechnung schon ___.
        options: [bezahlt, gebezahlt, bezahlen]
        answer: bezahlt
        why: Приставка be- → без ge-.
      - type: choice
        q: Hast du schon ___?
        options: [eingekauft, geeinkauft, eingekaufen]
        answer: eingekauft
        why: ein + ge + kauft.
      - type: gap
        q: Ich ___ heute um sieben Uhr aufgestanden. (haben/sein)
        answer: [bin]
        why: aufstehen — с sein.
      - type: gap
        q: Was hast du im Restaurant ___? (essen)
        answer: [gegessen]
      - type: gap
        q: Er ___ den Bus genommen. (haben/sein)
        answer: [hat]
        why: nehmen — с haben.
      - type: gap
        q: Gestern ___ ich keine Zeit. (haben, Präteritum)
        answer: [hatte]
      - type: gap
        q: Wo ___ ihr am Wochenende? (sein, Präteritum)
        answer: [wart]
        why: ihr → wart.
      - type: order
        answer: Ich habe zwei Kilo Äpfel gekauft.
        tokens: [Ich, habe, zwei Kilo Äpfel, gekauft]
        ru: Я купил(а) два килограмма яблок.
      - type: order
        answer: Wir sind am Hauptbahnhof umgestiegen.
        tokens: [Wir, sind, am Hauptbahnhof, umgestiegen]
        ru: Мы сделали пересадку на главном вокзале.
      - type: table
        title: Partizip II
        head: [Infinitiv, Partizip II]
        rows:
          - [trinken, "?getrunken"]
          - [fahren, "?gefahren"]
          - [bestellen, "?bestellt"]
          - [an·rufen, "?angerufen"]
          - [fotografieren, "?fotografiert"]
      - type: table
        title: sein und haben — Präteritum
        head: [Person, sein, haben]
        rows:
          - [ich, "?war", "?hatte"]
          - [du, "?warst", "?hattest"]
          - [wir, "?waren", "?hatten"]

  # ------------------------------------------------------------------
  - id: le-g-dativ
    title: "Dativ: mit, bei, zu, aus, von, nach, seit; wo? → in/an/auf + Dativ"
    title_ru: Дательный падеж после предлогов
    terms:
      - t: Dativ (Dat.)
        ru: дательный падеж; отвечает на вопросы wem? (кому?) и wo? (где?) после in/an/auf
      - t: Akkusativ (Akk.)
        ru: винительный падеж; после in/an/auf — на вопрос wohin? (куда?)
      - t: Nominativ (Nom.)
        ru: именительный падеж — словарная форма (der Markt)
      - t: Präposition
        ru: предлог (mit, zu, in …)
      - t: Wechselpräposition
        ru: "предлог с двумя падежами: in, an, auf, neben, vor, hinter, über, unter, zwischen. wo? → Dat., wohin? → Akk."
      - t: m / f / n
        ru: мужской / женский / средний род (der / die / das)
      - t: Pl.
        ru: множественное число
      - t: im, am, zum, zur, beim, vom
        ru: "слияние предлога и артикля: in dem, an dem, zu dem, zu der, bei dem, von dem"
    meaning: |
      После предлогов mit, bei, zu, aus, von, nach, seit — всегда Dativ.
      Артикль меняется так: der → dem, das → dem, die → der, die (Pl.) → den, и существительное во мн. ч. получает -n (die Kinder → den Kindern). Неопределённый артикль: einem (m, n), einer (f).
      На вопрос wo? (где?) предлоги in, an, auf тоже требуют Dativ: im Supermarkt, am Bahnhof, auf dem Markt.
      Предлог и артикль часто сливаются: in dem → im, an dem → am, zu dem → zum, zu der → zur, bei dem → beim, von dem → vom.
    steps:
      - de: der Bus → Ich fahre mit dem Bus.
        ru: "mit + Dat.: der → dem."
      - de: die Apotheke → Ich gehe zur Apotheke.
        ru: zu + der = zur.
      - de: das Café → Wir sitzen im Café.
        ru: Вопрос wo? → in + dem = im.
      - de: die Kinder → Ich gehe mit den Kindern in den Park.
        ru: "Pl. в Dat.: den + -n. Но «in den Park» — это wohin? → Akk."
      - de: der Arzt → Ich war beim Arzt.
        ru: bei + dem = beim (у врача).
      - de: Seit einer Woche habe ich Husten.
        ru: "seit + Dat.: eine Woche → einer Woche."
    table:
      head: [Kasus, m, f, n, Pl.]
      rows:
        - [Nom., der Markt, die Post, das Café, die Geschäfte]
        - [Dat., dem Markt, der Post, dem Café, den Geschäften]
        - [Nom., ein Markt, eine Post, ein Café, keine Geschäfte]
        - [Dat., einem Markt, einer Post, einem Café, keinen Geschäften]
    exam: |
      Dativ нужен при описании дороги и мест: в аудиотекстах («Die Apotheke ist neben der Post.»), в объявлениях («Bitte zahlen Sie an der Kasse.») и в разговоре («Ich fahre mit der Straßenbahn.»). На A1 одна ошибка в артикле не страшна, но mit/zu/bei + Dativ — это основа.
    traps:
      - "zu Hause = дома, nach Hause = домой: Ich bin zu Hause. Ich gehe nach Hause."
      - "nach — с городами и странами без артикля (nach Leipzig); к людям и местам — zu: zum Arzt, zur Post."
      - "Pl. в Dativ + -n: mit den Kindern, in den Geschäften. Без -n — если слово уже на -n или -s: mit den Autos."
      - "wo? → Dat., wohin? → Akk.: Ich bin im Park. — Ich gehe in den Park."
      - "aus — откуда (изнутри, из страны): Ich komme aus der Ukraine. von — от человека или места: Ich komme vom Arzt."
    exercises:
      - type: choice
        q: Ich fahre mit ___ Straßenbahn.
        options: [der, die, dem]
        answer: der
        why: die Straßenbahn (f) → mit der.
      - type: choice
        q: Wir treffen uns ___ Café „Kranich“.
        options: [im, in, ins]
        answer: im
        why: wo? → in + dem = im.
      - type: choice
        q: Ich gehe heute ___ Arzt.
        options: [zum, zur, beim]
        answer: zum
        why: der Arzt → zu + dem = zum.
      - type: choice
        q: Die Tomaten gibt es ___ Markt.
        options: [auf dem, auf den, auf der]
        answer: auf dem
        why: wo? → Dat.; der Markt → auf dem Markt.
      - type: gap
        q: Ich wohne seit ___ Jahr in Leipzig. (ein)
        answer: [einem]
        why: das Jahr (n) → seit einem Jahr.
      - type: gap
        q: Die Torte ist von ___ Oma. (meine)
        answer: [meiner]
        why: die Oma (f) → von meiner Oma.
      - type: gap
        q: Ich spiele mit den ___ im Park. (Kinder)
        answer: [Kindern]
        why: Pl. в Dativ + -n.
      - type: gap
        q: Wartest du ___ Bahnhof? (an + dem)
        answer: [am]
      - type: gap
        q: Entschuldigung, wie komme ich ___ Post? (zu + der)
        answer: [zur]
      - type: order
        answer: Nach der Arbeit gehe ich zum Supermarkt.
        tokens: [Nach der Arbeit, gehe, ich, zum Supermarkt]
        ru: После работы я иду в супермаркет.
      - type: order
        answer: Die Apotheke ist neben der Bank.
        tokens: [Die Apotheke, ist, neben, der Bank]
        ru: Аптека рядом с банком.
      - type: table
        title: Nominativ → Dativ
        head: [Nom., Dat.]
        rows:
          - [der Bus, "?dem Bus"]
          - [die U-Bahn, "?der U-Bahn"]
          - [das Auto, "?dem Auto"]
          - [die Kinder, "?den Kindern"]

  # ------------------------------------------------------------------
  - id: le-g-pronomen-akk-dat
    title: Personalpronomen im Akkusativ und Dativ
    title_ru: Личные местоимения в Akk. и Dat.
    terms:
      - t: Personalpronomen
        ru: личное местоимение (ich, du, er …)
      - t: Nominativ (Nom.)
        ru: именительный падеж — кто? что? (ich, du, er)
      - t: Akkusativ (Akk.)
        ru: винительный падеж — кого? что? (mich, dich, ihn)
      - t: Dativ (Dat.)
        ru: дательный падеж — кому? (mir, dir, ihm)
      - t: Verb mit Dativ
        ru: "глагол, после которого стоит Dat.: gefallen, passen, schmecken, helfen, gehören, danken"
      - t: Sie / Ihnen
        ru: вежливое «вы» / «вам»; всегда с большой буквы
      - t: Pl.
        ru: множественное число
    meaning: |
      Личные местоимения меняют форму по падежу.
      Akk. стоит после большинства глаголов (nehmen, kaufen, sehen, anrufen) и после für, ohne: Ich nehme ihn. Das ist für dich.
      Dat. стоит после глаголов gefallen, passen, schmecken, helfen, gehören, danken и после предлогов mit, bei, zu, von: Das passt mir. Kommst du mit mir?
      Местоимение 3-го лица выбирают по немецкому роду: der Mantel → ihn, die Jacke → sie, das Kleid → es, Pl. → sie.
    steps:
      - de: Der Mantel ist schön. Ich nehme ihn.
        ru: der Mantel → Akk. ihn.
      - de: Die Jacke? Ich kaufe sie.
        ru: die → sie (в Akk. форма та же).
      - de: Gefällt dir das Kleid? – Ja, es gefällt mir.
        ru: "gefallen + Dat.: dir, mir. Подлежащее — вещь (das Kleid → es)."
      - de: Die Schuhe passen ihm nicht.
        ru: er → Dat. ihm.
      - de: Können Sie mir helfen?
        ru: "helfen + Dat.: mir."
      - de: Der Kaffee ist für dich.
        ru: "für + Akk.: dich."
    table:
      head: [Nom., Akk., Dat.]
      rows:
        - [ich, mich, mir]
        - [du, dich, dir]
        - [er, ihn, ihm]
        - [sie, sie, ihr]
        - [es, es, ihm]
        - [wir, uns, uns]
        - [ihr, euch, euch]
        - [sie / Sie, sie / Sie, ihnen / Ihnen]
    exam: |
      В Sprechen Teil 3 и в диалогах в магазине и кафе эти формы звучат постоянно: «Können Sie mir helfen?», «Das gefällt mir.», «Ich nehme ihn.» В аудиотекстах продавец спрашивает: «Wie gefällt Ihnen …?», «Passt Ihnen die Größe?»
    traps:
      - "Wie gefällt dir …? — Dat., как и по-русски «тебе». Но Ich sehe dich. Ich rufe dich an. — Akk."
      - "ihn ≠ ihm: ihn — Akk. (Ich sehe ihn.), ihm — Dat. (Ich helfe ihm.)."
      - "Род немецкий, а не русский: der Löffel → ihn, die Tomate → sie, das Brot → es."
      - "Вежливое Sie — с большой буквы во всех формах: Kann ich Ihnen helfen?"
      - "При gefallen подлежащее — вещь: Die Schuhe gefallen mir. (Pl. → gefallen)."
    exercises:
      - type: choice
        q: Wie gefällt ___ die Jacke? (тебе)
        options: [dir, dich, du]
        answer: dir
        why: gefallen + Dat.
      - type: choice
        q: Der Mantel kostet 89 Euro. Ich nehme ___.
        options: [ihn, ihm, er]
        answer: ihn
        why: der Mantel → Akk. ihn.
      - type: choice
        q: Guten Tag! Kann ich ___ helfen? (вам, вежливо)
        options: [Ihnen, Sie, ihnen]
        answer: Ihnen
        why: helfen + Dat.; вежливо — с большой буквы.
      - type: choice
        q: Die Schuhe passen ___ nicht. (ему)
        options: [ihm, ihn, er]
        answer: ihm
        why: passen + Dat.
      - type: choice
        q: Tomaten? Ich brauche ___ für den Salat.
        options: [sie, ihn, ihnen]
        answer: sie
        why: die Tomaten (Pl.) → Akk. sie.
      - type: gap
        q: Das Kleid ist schön. Ich kaufe ___.
        answer: [es]
      - type: gap
        q: Hallo Anna, ich rufe ___ morgen an. (тебя)
        answer: [dich]
        why: anrufen + Akk.
      - type: gap
        q: Schmeckt ___ der Kuchen, Kinder? (вам)
        answer: [euch]
        why: ihr → Dat. euch.
      - type: gap
        q: Wir haben eine Frage. Können Sie ___ helfen? (нам)
        answer: [uns]
      - type: order
        answer: Die Hose gefällt mir nicht.
        tokens: [Die Hose, gefällt, mir, nicht]
        ru: Мне не нравятся эти брюки.
      - type: order
        answer: Ich zeige Ihnen den Weg.
        tokens: [Ich, zeige, Ihnen, den Weg]
        ru: Я покажу вам дорогу.
      - type: table
        title: Personalpronomen
        head: [Nom., Akk., Dat.]
        rows:
          - [ich, "?mich", "?mir"]
          - [er, "?ihn", "?ihm"]
          - [sie (она), "?sie", "?ihr"]
          - [wir, "?uns", "?uns"]

