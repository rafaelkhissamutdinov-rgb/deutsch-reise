  - id: le-t-wegbeschreibung
    kind: E-Mail
    title: Der Weg zu meiner Party
    text: |
      Hallo Dilnoza,

      super, dass du am Samstag zu meiner Party kommst! Hier ist der Weg: Nimm am Hauptbahnhof die Straßenbahn, Linie 9. Fahr fünf Stationen und steig an der Haltestelle „Gerberplatz“ aus. Dort siehst du eine Apotheke. Geh an der Apotheke links und dann immer geradeaus bis zur Ampel. Dort ist eine Kreuzung, da gehst du rechts. Mein Haus ist das dritte Haus auf der linken Seite, Nummer 14. Es ist gegenüber von einem kleinen Park. Ich wohne im dritten Stock, an der Tür steht „Brandt“. Hast du Probleme? Dann ruf mich an!

      Bis Samstag!
      Jonas
    glossary:
