  - type: choice
    q: Zwei ___ Wasser, bitte.
    options: [Flaschen, Flasche, Flaschens]
    answer: Flaschen
    why: Мн. ч. от die Flasche — Flaschen.
  - type: choice
    q: In Österreich sagt man „das Sackerl“. In Deutschland sagt man …
    options: [die Tüte, die Tasche, die Packung]
    answer: die Tüte
  - type: choice
    q: Wo kauft man Tabletten?
    options: [in der Apotheke, in der Bäckerei, am Kiosk]
    answer: in der Apotheke
  - type: tf
    q: „Der Topfen“ ist in Österreich das Wort für Quark.
    ru: «Topfen» — австрийское слово для творога (Quark).
    answer: true
  - type: gap
    q: Kann ich mit Karte ___? (платить)
    answer: [bezahlen, zahlen]
  - type: gap
    q: Ich fahre mit ___ Bus zur Arbeit.
    answer: [dem]
    why: der Bus → mit dem Bus.
  - type: gap
    q: ___ Sie an der Kreuzung links! (gehen)
    answer: [Gehen]
    why: Sie-форма Imperativ = инфинитив + Sie.
  - type: gap
    q: Gestern ___ ich beim Arzt. (sein, Präteritum)
    answer: [war]
  - type: order
    answer: Ich muss morgen zum Arzt gehen.
    tokens: [Ich, muss, morgen, zum Arzt, gehen]
    ru: Завтра мне нужно пойти к врачу.
  - type: order
    answer: Wie gefällt Ihnen das Kleid?
    tokens: [Wie, gefällt, Ihnen, das Kleid]
    ru: Как вам нравится платье?
  - type: table
    title: Partizip II
    head: [Infinitiv, Partizip II]
    rows:
      - [einkaufen, "?eingekauft"]
      - [essen, "?gegessen"]
      - [bezahlen, "?bezahlt"]
  - type: choice
    q: Wir sind gestern in die Stadt ___.
    options: [gefahren, gefahrt, fahren]
    answer: gefahren
    why: fahren — неправильный глагол, Perfekt с sein.
