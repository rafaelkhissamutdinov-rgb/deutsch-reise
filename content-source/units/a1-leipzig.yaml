writing:
  - id: le-s-absage
    exam: Goethe A1 · Schreiben Teil 2
    kind: Nachricht
    task: |
      Sie sind am Freitag um 16 Uhr mit Ihrer Freundin Marie im Café „Kranich“ verabredet. Sie können aber nicht kommen.
      Schreiben Sie Marie eine Nachricht:
      – Warum können Sie nicht kommen?
      – Schlagen Sie einen neuen Termin vor.
      – Was bringen Sie mit?
      Schreiben Sie zu jedem Punkt ein bis zwei Sätze (30–40 Wörter).
    task_ru: |
      Вы договорились встретиться с подругой Мари в пятницу в 16 часов в кафе «Кранич», но не можете прийти.
      Напишите Мари сообщение: почему вы не можете прийти; предложите другое время; что вы принесёте с собой.
      По 1–2 предложения на каждый пункт, всего 30–40 слов.
    points:
      - Warum können Sie nicht kommen?
      - Neuer Termin – wann?
      - Was bringen Sie mit?
    words: [30, 40]
    structure:
      - Обращение (Liebe Marie, / Hallo Marie,) — после запятой продолжаем со строчной буквы
      - Извинение и причина (es tut mir leid, aber …)
      - Новое время (Hast du am … um … Zeit?)
      - Что принесёте (Ich bringe … mit.)
      - Прощание (Liebe Grüße / Viele Grüße + имя)
    redemittel:
      - de: Es tut mir leid, aber ich kann am … nicht kommen.
        ru: Мне жаль, но я не могу прийти в …
      - de: Leider habe ich am … keine Zeit.
        ru: К сожалению, у меня в … нет времени.
      - de: Ich muss arbeiten. / Ich bin krank. / Ich habe einen Termin beim Arzt.
        ru: Мне нужно работать. / Я болею. / У меня приём у врача.
      - de: Hast du am … um … Uhr Zeit?
        ru: У тебя есть время в … в … часов?
      - de: Können wir uns am … treffen?
        ru: Можем встретиться в …?
      - de: Geht es auch am …?
        ru: А в … можно?
      - de: Ich bringe … mit.
        ru: Я принесу …
      - de: Schreib mir bitte kurz!
        ru: Напиши мне, пожалуйста, коротко!
      - de: Liebe Grüße / Viele Grüße
        ru: С приветом (в конце письма)
      - de: Bis bald!
        ru: До скорого!
    model: |
      Liebe Marie,

      es tut mir leid, aber ich kann am Freitag nicht ins Café kommen. Ich muss bis 18 Uhr arbeiten. Hast du am Samstag um 15 Uhr Zeit? Ich bringe die Fotos aus Prag mit.

      Liebe Grüße
      Natalia
    checklist:
      - Все три пункта раскрыты (причина, новое время, что принесу)?
      - Есть обращение и прощание с именем?
      - После «Liebe Marie,» текст продолжается со строчной буквы?
      - Глагол стоит на 2-м месте, а в вопросе да/нет — на 1-м?
      - Отделяемая приставка в конце (Ich bringe … mit.)?
      - Подруге — на «du» (Hast du …?), а не на «Sie»?
      - 30–40 слов?

