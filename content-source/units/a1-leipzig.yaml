speaking:
  - id: le-sp-1
    exam: Goethe A1 · Sprechen Teil 2
    task: "Thema: Essen und Trinken / Einkaufen"
    task_ru: Вы берёте карточку со словом, задаёте партнёру вопрос с этим словом и отвечаете на его вопрос.
    prompts: [Frühstück, Obst, Lieblingsessen, Supermarkt, Markt, Getränke]
    model: |
      Frühstück — Was isst du zum Frühstück? – Ich esse meistens ein Brötchen mit Käse und trinke Kaffee.
      Obst — Welches Obst isst du gern? – Ich esse gern Äpfel und Bananen.
      Lieblingsessen — Was ist dein Lieblingsessen? – Mein Lieblingsessen ist Hähnchen mit Reis.
      Supermarkt — Wann gehst du in den Supermarkt? – Ich gehe meistens am Freitag nach der Arbeit.
      Markt — Kaufst du auf dem Markt ein? – Ja, am Samstag kaufe ich dort Obst und Gemüse.
      Getränke — Was trinkst du gern? – Ich trinke gern Tee, aber keinen Kaffee.

  - id: le-sp-2
    exam: Goethe A1 · Sprechen Teil 3
    task: Bitten formulieren und reagieren (im Geschäft und im Restaurant)
    task_ru: Вы берёте карточку с картинкой и вежливо просите о чём-то партнёра. Партнёр реагирует. Потом наоборот.
    prompts: [Speisekarte, Rechnung, Wasser, Tüte, Größe, Bankkarte]
    model: |
      Speisekarte — Können Sie mir bitte die Speisekarte bringen? – Ja, gern. Hier, bitte.
      Rechnung — Die Rechnung, bitte! – Gern. Zusammen oder getrennt?
      Wasser — Ich hätte gern ein Glas Wasser, bitte. – Natürlich, sofort.
      Tüte — Kann ich bitte eine Tüte haben? – Ja, die Tüte kostet 20 Cent.
      Größe — Haben Sie die Hose auch in Größe 38? – Moment, ich schaue mal. Ja, hier.
      Bankkarte — Kann ich mit Karte bezahlen? – Ja, natürlich.

  - id: le-sp-3
    exam: Unterricht
    task: Beim Arzt – Beschwerden nennen
    task_ru: Ролевая игра на уроке. Вы у врача — расскажите, что у вас болит, с какого времени и что вы уже делали. Партнёр — врач.
    prompts:
      - Was fehlt Ihnen?
      - Seit wann?
      - Fieber?
      - Schmerzen – wo?
      - Medikamente genommen?
      - Was soll ich machen?
    model: |
      Ärztin: Guten Tag, Herr Aliyev. Was fehlt Ihnen?
      Patient: Guten Tag. Ich habe Bauchschmerzen und mir ist schlecht.
      Ärztin: Seit wann haben Sie die Schmerzen?
      Patient: Seit gestern Abend.
      Ärztin: Haben Sie auch Fieber?
      Patient: Ja, heute Morgen hatte ich 38 Grad.
      Ärztin: Haben Sie schon Tabletten genommen?
      Patient: Nein, noch nicht. Was soll ich machen?
      Ärztin: Trinken Sie viel Tee und essen Sie heute nur Zwieback. Hier ist ein Rezept.

