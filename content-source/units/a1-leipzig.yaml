dialogues:
  - id: le-d-baeckerei
    title: In der Bäckerei
    title_ru: В пекарне
    situation_ru: Утро, вы в пекарне в Лейпциге. Купите булочки и кусок пирога и заплатите.
    partner: Verkäuferin
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Guten Morgen! Was darf es sein?
        ru: Доброе утро! Что желаете?
        options:
          - t: Guten Morgen! Ich hätte gern vier Brötchen, bitte.
            ru: Доброе утро! Мне, пожалуйста, четыре булочки. (В Австрии сказали бы «vier Semmeln».)
            next: n2
          - t: Vier Brötchen.
            ru: Четыре булочки.
            next: n2
            ok: false
            fb: Без приветствия и «bitte» звучит резко. Лучше «Guten Morgen! Ich hätte gern vier Brötchen, bitte.»
      n2:
        say: Gern. Normale Brötchen oder Körnerbrötchen?
        ru: С удовольствием. Обычные булочки или с зёрнами?
        options:
          - t: Zwei normale und zwei Körnerbrötchen, bitte.
            ru: Две обычные и две с зёрнами, пожалуйста.
            next: n3
          - t: Was ist ein Körnerbrötchen?
            ru: А что такое булочка с зёрнами?
            next: n2b
          - t: Ich möchte Brötchen normal.
            ru: Я хочу булочки обычные.
            next: n3
            ok: false
            fb: Прилагательное стоит перед существительным — «normale Brötchen».
      n2b:
        say: Das ist ein Brötchen mit Sonnenblumenkernen. Sehr lecker!
        ru: Это булочка с семечками подсолнечника. Очень вкусная!
        options:
          - t: Dann nehme ich zwei normale und zwei Körnerbrötchen.
            ru: Тогда я возьму две обычные и две с зёрнами.
            next: n3
          - t: Ach so. Dann vier normale, bitte.
            ru: Понятно. Тогда четыре обычные, пожалуйста.
            next: n3
      n3:
        say: Sonst noch etwas?
        ru: Что-нибудь ещё?
        options:
          - t: Ja, ein Stück Käsekuchen, bitte.
            ru: Да, кусок творожного пирога, пожалуйста.
            next: n4
          - t: Ja, ich will Kuchen.
            ru: Да, я хочу пирог.
            next: n4
            ok: false
            fb: «Ich will» звучит слишком прямо. Вежливо — «Ich hätte gern …» или «Ich möchte …», и лучше уточнить «ein Stück».
      n4:
        say: Gern. Zum Mitnehmen?
        ru: Хорошо. С собой?
        options:
          - t: Ja, zum Mitnehmen, bitte.
            ru: Да, с собой, пожалуйста.
            next: n5
          - t: Nein, ich esse den Kuchen hier.
            ru: Нет, я съем пирог здесь.
            next: n5
      n5:
        say: Das macht dann 4,60 Euro.
        ru: С вас 4,60 евро.
        options:
          - t: Kann ich mit Karte bezahlen?
            ru: Можно оплатить картой?
            next: n6
          - t: Hier sind fünf Euro.
            ru: Вот пять евро.
            next: n6b
          - t: Wie viel kostet?
            ru: Сколько стоит?
            next: n6
            ok: false
            fb: Сумму уже назвали (4,60 Euro). Да и в вопросе не хватает «das» — «Was kostet das?». Сейчас лучше спросить про оплату — «Kann ich mit Karte bezahlen?»
      n6:
        say: Ja, natürlich. Halten Sie die Karte bitte hier an das Gerät.
        ru: Да, конечно. Приложите, пожалуйста, карту вот сюда, к терминалу.
        options:
          - t: So, bitte.
            ru: Вот, пожалуйста.
            next: n7
          - t: Muss ich die PIN eingeben?
            ru: Мне нужно вводить ПИН-код?
            next: n7
      n6b:
        say: Danke. Und 40 Cent zurück. Möchten Sie den Kassenbon?
        ru: Спасибо. И 40 центов сдачи. Вам нужен чек?
        options:
          - t: Nein, danke.
            ru: Нет, спасибо.
            next: end
          - t: Ja, bitte.
            ru: Да, пожалуйста.
            next: end
      n7:
        say: Danke, das hat geklappt. Eine PIN brauchen Sie hier nicht. Möchten Sie den Kassenbon?
        ru: Спасибо, всё прошло. ПИН-код здесь не нужен. Вам нужен чек?
        options:
          - t: Nein, danke.
            ru: Нет, спасибо.
            next: end
          - t: Ja, gern.
            ru: Да, пожалуйста.
            next: end
          - t: Nein, ich nicht möchte.
            ru: Нет, я не хочу.
            next: end
            ok: false
            fb: Неверный порядок слов. Достаточно «Nein, danke.» Полным предложением — «Nein, ich möchte ihn nicht.»
      end:
        say: Bitte schön. Einen schönen Tag noch!
        ru: Пожалуйста. Хорошего дня!
        end: true

  - id: le-d-arzt
    title: Einen Termin beim Arzt machen
    title_ru: Запись к врачу по телефону
    situation_ru: |
      У вас болит горло, и вы звоните в кабинет врача (Praxis), чтобы записаться на приём. В Германии на приём берут карту медицинской страховки (Versicherungskarte), в Австрии — e-card, а кабинет врача там часто называют «Ordination».
    partner: Praxis Dr. Hoffmann, Anmeldung
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Praxis Dr. Hoffmann, Sie sprechen mit Frau Krause. Was kann ich für Sie tun?
        ru: Кабинет доктора Хоффмана, с вами говорит госпожа Краузе. Чем могу помочь?
        options:
          - t: Guten Tag, hier ist Olga Petrenko. Ich möchte einen Termin vereinbaren.
            ru: Добрый день, это Ольга Петренко. Я хотела бы записаться на приём.
            next: n2
          - t: Hallo, ich brauche Arzt.
            ru: Привет, мне нужен врач.
            next: n2
            ok: false
            fb: Представьтесь и не забудьте артикль. Лучше «Guten Tag, hier ist … Ich brauche einen Termin.»
      n2:
        say: Sind Sie schon Patientin bei uns?
        ru: Вы уже наша пациентка?
        options:
          - t: Nein, ich komme zum ersten Mal.
            ru: Нет, я приду впервые.
            next: n3
          - t: Ja, ich war im März bei Ihnen.
            ru: Да, я была у вас в марте.
            next: n3
      n3:
        say: Gut. Was für Beschwerden haben Sie denn?
        ru: Хорошо. А на что вы жалуетесь?
        options:
          - t: Ich habe seit drei Tagen Halsschmerzen.
            ru: У меня уже три дня болит горло.
            next: n4
          - t: Mein Hals tut weh, und ich huste viel.
            ru: У меня болит горло, и я сильно кашляю.
            next: n4
          - t: Ich habe Schmerzen in die Hals.
            ru: У меня боли в горле.
            next: n4
            ok: false
            fb: Где? → in + Dativ, der Hals → «im Hals». Ещё проще — «Ich habe Halsschmerzen.»
      n4:
        say: Haben Sie auch Fieber?
        ru: У вас есть температура?
        options:
          - t: Ja, gestern hatte ich 38,5 Grad.
            ru: Да, вчера было 38,5.
            next: n5
          - t: Nein, kein Fieber. Aber ich bin sehr müde.
            ru: Нет, температуры нет. Но я очень устала.
            next: n5
      n5:
        say: Heute Vormittag ist leider alles voll. Können Sie um 15:30 Uhr kommen?
        ru: Сегодня до обеда, к сожалению, всё занято. Вы можете прийти в 15:30?
        options:
          - t: Ja, das passt mir gut.
            ru: Да, мне это подходит.
            next: n6
          - t: Nein, da muss ich arbeiten. Geht es auch später?
            ru: Нет, в это время я работаю. А можно попозже?
            next: n5b
          - t: Ja, das gefällt mir.
            ru: Да, это мне нравится.
            next: n6
            ok: false
            fb: О времени говорят «Das passt mir.», а не «Das gefällt mir.»
      n5b:
        say: Dann um 17:15 Uhr. Passt Ihnen das?
        ru: Тогда в 17:15. Вам удобно?
        options:
          - t: Ja, das passt. Vielen Dank!
            ru: Да, подходит. Большое спасибо!
            next: n6
          - t: Ja, 17:15 Uhr ist gut.
            ru: Да, 17:15 — хорошо.
            next: n6
      n6:
        say: Bringen Sie bitte Ihre Versicherungskarte mit. Wie ist Ihr Geburtsdatum?
        ru: Возьмите, пожалуйста, с собой страховую карту. Какая у вас дата рождения? (В Австрии попросили бы e-card.)
        options:
          - t: Der 14. Mai 1991.
            ru: 14 мая 1991 года.
            next: n7
          - t: Ich bin am 3. Februar 1988 geboren.
            ru: Я родилась 3 февраля 1988 года.
            next: n7
      n7:
        say: Danke. Haben Sie noch eine Frage?
        ru: Спасибо. У вас есть ещё вопросы?
        options:
          - t: Ja, wo ist die Praxis genau?
            ru: Да, где именно находится кабинет?
            next: n8
          - t: Nein, danke. Auf Wiederhören!
            ru: Нет, спасибо. До свидания!
            next: end
      n8:
        say: Im Lerchenweg 14, im zweiten Stock. Die Straßenbahn hält direkt vor dem Haus.
        ru: Лерхенвег, 14, на третьем этаже. Трамвай останавливается прямо перед домом.
        options:
          - t: Super, vielen Dank! Auf Wiederhören!
            ru: Отлично, большое спасибо! До свидания!
            next: end
          - t: Gut, danke. Bis später!
            ru: Хорошо, спасибо. До встречи!
            next: end
      end:
        say: Auf Wiederhören und gute Besserung!
        ru: До свидания и выздоравливайте!
        end: true

