texts:
  - id: le-t-speisekarte
    kind: Menü
    title: Café Kranich – Speisekarte
    text: |
      Café Kranich
      Frühstück (8–11 Uhr)
      Brötchen mit Butter und Marmelade – 3,50 €
      Rührei mit Brot – 5,20 €
      Eierkuchen mit Apfelmus – 4,90 €

      Mittagstisch (Montag bis Freitag, 11:30–14 Uhr)
      Montag: Kartoffelsuppe mit Würstchen – 6,90 €
      Dienstag: Gemüselasagne (vegetarisch) – 8,50 €
      Mittwoch: Hähnchen mit Reis und Salat – 9,20 €
      Donnerstag: Nudeln mit Tomatensoße (vegetarisch) – 7,80 €
      Freitag: Fisch mit Kartoffeln – 9,50 €
      Jeden Tag: kleiner Salat – 4,50 €

      Kuchen und Getränke
      Käsekuchen – 3,20 €
      Quarkkeulchen mit Zimt und Zucker – 4,10 €
      Kaffee – 2,60 € | Tee – 2,40 € | Apfelsaft – 2,80 €

      Zu jedem Mittagstisch gibt es ein Glas Wasser gratis.
      Kartenzahlung erst ab 10 €.
    glossary:
      Rührei: яичница-болтунья
      Apfelmus: яблочное пюре
      Würstchen: сосиски
      Quarkkeulchen: творожные оладьи (саксонское блюдо)
      Zimt: корица
      gratis: бесплатно
      Kartenzahlung: оплата картой
      erst ab: только от (суммы)
    questions:
      - type: tf
        q: Frühstück gibt es bis 12 Uhr.
        ru: Завтрак подают до 12 часов.
        answer: false
        why: Frühstück — 8–11 Uhr.
      - type: choice
        q: Was kostet die Kartoffelsuppe?
        ru: Сколько стоит картофельный суп?
        options:
          - "6,90 €"
          - "4,90 €"
          - "8,50 €"
        answer: "6,90 €"
      - type: choice
        q: Welches Gericht ist vegetarisch?
        ru: Какое блюдо вегетарианское?
        options:
          - die Kartoffelsuppe mit Würstchen
          - die Gemüselasagne
          - das Hähnchen mit Reis
        answer: die Gemüselasagne
      - type: tf
        q: Den Mittagstisch gibt es auch am Samstag.
        ru: Обед дня есть и в субботу.
        answer: false
