      B: Gute Idee. Dort ist es ruhig. Wie lange sollen wir lernen?
      A: Drei Stunden, von 14 bis 17 Uhr, mit einer Pause. Wir sollten zuerst die Grammatik wiederholen.
      B: Einverstanden. Ich bringe Karteikarten mit. Danach können wir in der Mensa essen.
      A: Super. Ich bringe die Übungen mit. Bis Mittwoch!

test:
  - type: choice
    q: Sie hat Angst ___ dem Zahnarzt.
    options: [vor, auf, um]
    answer: vor
    why: Angst haben + vor + Dat.
  - type: choice
    q: Sie interessiert sich ___ Biologie.
    options: [für, über, an]
    answer: für
    why: sich interessieren + für + Akk.
  - type: choice
    q: Ärgerst du dich über den Test? – Ja, ich ärgere mich ___.
    options: [darüber, davor, dafür]
    answer: darüber
    why: sich ärgern über → darüber.
  - type: gap
    q: Ich habe vergessen, meine Ärztin ___. (anrufen)
    answer: [anzurufen]
    why: an·rufen → an-zu-rufen.
  - type: choice
    q: Er geht früh ins Bett, ___ morgen fit zu sein.
    options: [um, damit, für]
    answer: um
    why: Цель + одно подлежащее → um … zu.
  - type: gap
    q: Du hast Halsschmerzen? Du ___ heute zu Hause bleiben. (sollen)
    answer: [solltest]
    why: du → solltest.
  - type: choice
    q: Ihr seid zu laut! ___ bitte leiser!
    options: [Seid, Sei, Seien]
    answer: Seid
    why: Imperativ ihr от sein — seid.
  - type: choice
    q: ___ ich ein Kind war, hatte ich oft Fieber.
    options: [Als, Wenn, Wann]
    answer: Als
    why: Один период в прошлом → als.
  - type: gap
    q: Immer ___ ich Stress habe, höre ich Musik.
    answer: [wenn]
    why: immer — повторяется → wenn.
  - type: choice
    q: Am Samstag ___ ich lange im Bett geblieben.
    options: [bin, habe, war]
    answer: bin
    why: bleiben — с sein.
  - type: tf
    q: Ein Medikament, das „rezeptfrei“ ist, bekommt man ohne Rezept.
    ru: Лекарство «rezeptfrei» можно купить без рецепта.
    answer: true
  - type: choice
    q: Wie heißt auf Deutsch „справка о болезни (больничный)“?
    options: [die Krankmeldung, die Überweisung, die Packungsbeilage]
    answer: die Krankmeldung
    why: Krankmeldung — справка о нетрудоспособности. Überweisung — направление к специалисту.
  - type: order
    answer: Sie nimmt an einem Yogakurs teil, um sich zu entspannen.
    tokens: [Sie, nimmt, an, einem Yogakurs, "teil,", um, sich, zu, entspannen]
    ru: Она ходит на занятия йогой, чтобы расслабиться.
  - type: table
    title: Perfekt
    head: [Infinitiv, Perfekt]
    rows:
      - [aufstehen, "?ist aufgestanden"]
      - [verschreiben, "?hat verschrieben"]
      - [sich erholen, "?hat sich erholt"]
      - [bekommen, "?hat bekommen"]
