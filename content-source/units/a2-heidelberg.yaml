    task_ru: Вы вытягиваете карточку со словом по теме «Lernen und Gesundheit». Задайте партнёру вопрос с этим словом. Потом ответьте на его вопрос. На экзамене на карточках слова или картинки.
    prompts: [Lieblingsfach, Sprachkurs, Prüfung, Arzt, Sport, Schlaf]
