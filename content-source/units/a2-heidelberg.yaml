  # ------------------------------------------------------------------
  - id: hd-g-als-wenn
    title: Temporale Nebensätze mit als und wenn
    title_ru: "«Когда»: als и wenn"
    terms:
      - t: Nebensatz
        ru: придаточное предложение; спрягаемый глагол стоит в самом конце
      - t: Hauptsatz
        ru: главное предложение; спрягаемый глагол на позиции 2
      - t: Konjunktion
        ru: союз (als, wenn, weil, dass …)
      - t: temporal
        ru: относящийся ко времени; temporaler Nebensatz отвечает на вопрос «когда?»
      - t: einmalig
        ru: один раз; событие произошло в определённый момент или период
      - t: wiederholt
        ru: "много раз; привычка или повторяющееся событие (immer, jedes Mal, oft)"
      - t: Präsens / Präteritum / Perfekt
        ru: настоящее / простое прошедшее / сложное прошедшее время
      - t: Position 1 / Position 2
        ru: места в предложении; если Nebensatz стоит первым, он занимает позицию 1, а глагол главного предложения идёт сразу после запятой
    meaning: |
      Оба союза значат «когда», но используются по-разному.
      als — одно событие или один период в прошлом: Als ich letzte Woche krank war, bin ich zu Hause geblieben. Als ich ein Kind war, hatte ich oft Fieber. (Детство — один период.) После als время всегда прошедшее.
      wenn — событие повторяется (каждый раз, всегда, часто): Wenn ich Kopfschmerzen habe, trinke ich viel Wasser. wenn используется и для прошлого, если событие повторялось: Wenn ich als Kind krank war, hat meine Oma immer Tee gekocht.
      wenn также для будущего и для одного события в настоящем: Ruf mich an, wenn du in der Apotheke bist.
      В Nebensatz глагол стоит в конце: …, als ich krank war. Если Nebensatz стоит в начале, то после запятой идёт глагол главного предложения: Als ich krank war, habe ich viel geschlafen.
      Подсказки: immer, jedes Mal, oft, manchmal, jeden Tag → wenn. Gestern, letzte Woche, damals, 2019 → als.
    steps:
      - de: Als ich letzte Woche krank war, bin ich zu Hause geblieben.
        ru: Один раз в прошлом → als. Глагол war — в конце придаточного.
      - de: Als ich ein Kind war, hatte ich oft Fieber.
        ru: Один период в прошлом → als.
      - de: Wenn ich Kopfschmerzen habe, trinke ich viel Wasser.
        ru: Повторяется в настоящем → wenn.
      - de: Wenn ich als Kind krank war, hat meine Oma immer Tee gekocht.
        ru: Повторялось в прошлом (immer) → wenn, не als.
      - de: Ich rufe dich an, wenn ich zu Hause bin.
        ru: Будущее → wenn. Придаточное в конце.
      - de: Ich weiß nicht, wann die Praxis öffnet.
        ru: "Косвенный вопрос — wann («в какое время»), не wenn."
    table:
      head: [Ситуация, Союз, Пример]
      rows:
        - [один раз в прошлом, als, Als ich 15 war, hatte ich Masern.]
        - [повторялось в прошлом, wenn, Wenn ich krank war, hat Oma Tee gebracht.]
        - [повторяется сейчас, wenn, Wenn ich Stress habe, gehe ich spazieren.]
        - [будущее, wenn, "Wenn du Zeit hast, komm doch mit."]
    exam: |
      В Goethe A2 Schreiben и Sprechen вы рассказываете о прошлом и привычках: Als ich nach Deutschland gekommen bin, … Wenn ich Zeit habe, …
      В Lesen и Hören обращайте внимание на слова immer, jedes Mal (повторяется) и gestern, damals, im letzten Jahr (один раз).
    traps:
      - "als — только прошлое: Als ich krank war … Не «Als ich Kopfschmerzen habe»."
      - "Если событие повторялось, в прошлом тоже wenn: Wenn ich krank war, … immer …"
      - "Глагол в придаточном в конце: …, als ich krank war (не «als ich war krank»)."
      - "Придаточное впереди → сразу глагол главного: Als ich krank war, habe ich … (не «…, ich habe»)."
      - "wann ≠ wenn: Wann beginnt der Kurs? Ich weiß nicht, wann er beginnt. Не «wenn» в вопросе «когда?»."
      - "wenn ещё значит «если»: Wenn du Fieber hast, bleib im Bett."
    exercises:
      - type: choice
        q: ___ ich gestern beim Arzt war, musste ich lange warten.
        options: [Als, Wenn, Wann]
        answer: Als
        why: Один раз в прошлом → als.
      - type: choice
        q: ___ ich Husten habe, trinke ich warmen Tee.
        options: [Wenn, Als, Wann]
        answer: Wenn
        why: Повторяется в настоящем → wenn.
      - type: choice
        q: ___ ich als Kind krank war, hat mir meine Oma immer Tee gebracht.
        options: [Wenn, Als, Wann]
        answer: Wenn
        why: immer — повторялось, поэтому wenn, хотя это прошлое.
      - type: choice
        q: Ruf mich an, ___ du in der Apotheke bist.
        options: [wenn, als, wann]
        answer: wenn
        why: Будущее → wenn.
      - type: choice
        q: ___ ich 2019 nach Heidelberg gezogen bin, habe ich kaum Deutsch gesprochen.
        options: [Als, Wenn, Wann]
        answer: Als
        why: Один раз в прошлом (2019) → als.
      - type: choice
        q: Ich weiß nicht, ___ die Praxis öffnet.
        options: [wann, wenn, als]
        answer: wann
        why: Косвенный вопрос «когда?» → wann.
      - type: gap
        q: ___ ich letzten Montag Fieber hatte, bin ich im Bett geblieben.
        answer: [Als]
        why: Один раз в прошлом → als.
      - type: gap
        q: ___ du Zahnschmerzen hast, geh sofort zum Zahnarzt!
        answer: [Wenn]
        why: Настоящее, при каждом случае → wenn.
      - type: gap
        q: Jedes Mal, ___ ich nervös bin, bekomme ich Bauchschmerzen.
        answer: [wenn]
        why: jedes Mal — повторяется → wenn.
      - type: gap
        q: Gestern, ___ ich aus der Uni kam, hat es geregnet.
        answer: [als]
        why: gestern — один раз в прошлом → als.
      - type: order
        answer: Als ich krank war, habe ich viel geschlafen.
        tokens: ["Als ich krank war,", habe, ich, viel geschlafen]
        ru: Когда я болел, я много спал.
      - type: order
        answer: Wenn ich Stress habe, mache ich einen Spaziergang.
        tokens: ["Wenn ich Stress habe,", mache, ich, einen Spaziergang]
        ru: Когда у меня стресс, я иду гулять.
      - type: order
        answer: Ich rufe dich an, wenn ich zu Hause bin.
        tokens: [Ich, rufe, dich, "an,", wenn, ich, zu Hause, bin]
        ru: Я позвоню тебе, когда буду дома.
      - type: table
        title: als oder wenn?
        head: [Satzanfang, Konjunktion]
        rows:
          - ["… ich krank war (gestern)", "?Als"]
          - ["… ich Stress habe (immer)", "?Wenn"]
          - ["… du morgen Zeit hast", "?Wenn"]
          - ["… wir damals in Moskau wohnten", "?Als"]
          - ["… ich nervös war (jedes Mal)", "?Wenn"]

  # ------------------------------------------------------------------
  - id: hd-g-perfekt-praet
    title: Perfekt und Präteritum beim Erzählen
    title_ru: Perfekt и Präteritum в рассказе о прошлом; неправильные Partizip II
    terms:
      - t: Perfekt
        ru: "сложное прошедшее: haben/sein + Partizip II (Ich habe geschlafen)"
      - t: Präteritum
        ru: "простое прошедшее (Ich war, ich hatte, ich ging)"
      - t: Partizip II
        ru: "причастие II: форма, которая стоит в конце Perfekt (gemacht, geschlafen, gegangen)"
      - t: Hilfsverb
        ru: вспомогательный глагол (haben или sein), он спрягается и стоит на позиции 2
      - t: regelmäßig (schwach)
        ru: "правильный глагол: Partizip II = ge- + основа + -t (gemacht, gelernt)"
      - t: unregelmäßig (stark)
        ru: "неправильный глагол: ge- + основа (часто с другой гласной) + -en (gegangen, genommen)"
      - t: gemischte Verben
        ru: "глаголы со сменой гласной, но с окончанием -t (bringen → gebracht, denken → gedacht)"
      - t: trennbares Verb
        ru: "глагол с отделяемой приставкой; ge- стоит между приставкой и корнем (aufgestanden)"
      - t: Präteritum von sein/haben/Modalverben
        ru: "war, hatte, konnte, musste, wollte — в устной речи используются вместо Perfekt"
    meaning: |
      Perfekt: Ich habe gestern lange geschlafen. Спрягаемый haben/sein — на позиции 2, Partizip II — в самом конце. Так обычно рассказывают о прошлом в разговоре и в личных письмах.
      Präteritum: Ich war krank. Ich hatte Fieber. Так чаще пишут рассказы и новости. В разговоре Präteritum обычно используют только для sein, haben и модальных глаголов: war, hatte, konnte, musste, wollte.
      haben или sein: большинство глаголов идёт с haben. С sein — глаголы движения и перемены состояния: gehen, fahren, kommen, aufstehen, einschlafen, bleiben, werden, sein.
      Partizip II: правильные — ge- + основа + -t (gemacht, gelernt). Неправильные — ge- + основа + -en, часто с другой гласной (gegessen, genommen, geschlafen, gesehen, getrunken, gebrochen, geschrieben, gegangen). Неправильные формы надо учить вместе с глаголом.
      Приставка: у глаголов с отделяемой приставкой ge- стоит между приставкой и корнем (aufstehen → aufgestanden). Нет ge- у глаголов с be-, ver-, er-, ent-, zer- и у слов на -ieren: bestanden, vergessen, erklärt, studiert.
      Для рассказа удобно смешивать: основные события — Perfekt, фон (war, hatte, musste) — Präteritum.
    steps:
      - de: Gestern habe ich lange geschlafen.
        ru: "Perfekt: habe (позиция 2) + geschlafen (конец)."
      - de: Ich bin um acht aufgestanden.
        ru: "aufstehen — глагол движения/смены состояния → sein; auf-ge-standen."
      - de: Letzte Woche war ich krank.
        ru: sein в Präteritum — стандарт и в разговоре.
      - de: Der Arzt hat mir Tabletten verschrieben.
        ru: "ver- → Partizip II без ge-."
      - de: Ich hatte Fieber und konnte nicht zur Arbeit gehen.
        ru: hatte, konnte — Präteritum модального и haben.
      - de: Am Montag bin ich zum Arzt gegangen. Ich musste lange warten. Dann hat die Ärztin mich untersucht.
        ru: "Мини-рассказ: события — Perfekt (bin gegangen, hat untersucht), фон — Präteritum (musste)."
    table:
      head: [Infinitiv, Präteritum, Perfekt]
      rows:
        - [gehen, ging, ist gegangen]
        - [kommen, kam, ist gekommen]
        - [bleiben, blieb, ist geblieben]
        - [nehmen, nahm, hat genommen]
        - [sehen, sah, hat gesehen]
        - [schlafen, schlief, hat geschlafen]
        - [trinken, trank, hat getrunken]
        - [brechen, brach, hat gebrochen]
        - [bekommen, bekam, hat bekommen]
        - [bringen, brachte, hat gebracht]
        - [denken, dachte, hat gedacht]
        - [wissen, wusste, hat gewusst]
    exam: |
      В Goethe A2 Schreiben и Sprechen нужно рассказать о том, что было: Gestern war ich beim Arzt. Ich habe Medikamente bekommen. В письме другу обычно Perfekt, для war/hatte — Präteritum.
      В Lesen и Hören помогают формы Partizip II на конце предложения и слова gestern, letzte Woche, damals.
    traps:
      - "gehen, kommen, fahren, bleiben, aufstehen, einschlafen — с sein: Ich bin gegangen (не «Ich habe gegangen»)."
      - "Partizip II стоит в конце: Ich habe gestern ein Medikament genommen."
      - "Нет ge- у глаголов с be-, ver-, er-, ent- и -ieren: bestanden, vergessen, erklärt, studiert."
      - "Правильные Partizip II неправильных глаголов с -t: gebracht, gedacht, gewusst."
      - "sein, haben и модальные глаголы в разговоре — Präteritum: Ich war krank. Ich war krank звучит естественнее, чем «Ich bin krank gewesen» (оно тоже возможно, но реже)."
      - "nehmen → genommen, trinken → getrunken: не «genehmt», не «getrinkt»."
      - "В одном рассказе не стоит без причины перескакивать между временами."
    exercises:
      - type: choice
        q: Letzte Woche ___ ich krank.
        options: [war, habe, bin]
        answer: war
        why: sein в Präteritum — war.
      - type: choice
        q: Ich ___ gestern lange geschlafen.
        options: [habe, bin, war]
        answer: habe
        why: schlafen — с haben.
      - type: choice
        q: Er ___ um sieben Uhr aufgestanden.
        options: [ist, hat, war]
        answer: ist
        why: aufstehen — смена состояния → sein.
      - type: choice
        q: Die Ärztin hat mir ein Medikament ___.
        options: [verschrieben, geverschrieben, verschreibt]
        answer: verschrieben
        why: ver- → без ge-.
      - type: choice
        q: Wir sind nach dem Kurs in die Apotheke ___.
        options: [gegangen, gegehen, gegangt]
        answer: gegangen
        why: "gehen — неправильный: gegangen."
      - type: choice
        q: Hast du das Wort im Wörterbuch ___?
        options: [nachgeschlagen, genachschlagen, nachschlagt]
        answer: nachgeschlagen
        why: "nach·schlagen: ge- между приставкой и корнем."
      - type: gap
        q: Ich habe gestern zu wenig ___. (schlafen)
        answer: [geschlafen]
        why: schlafen → geschlafen.
      - type: gap
        q: Am Montag ___ wir zum Zahnarzt gefahren.
        answer: [sind]
        why: fahren — глагол движения → sein.
      - type: gap
        q: Beim Skifahren hat sie sich das Bein ___. (brechen)
        answer: [gebrochen]
        why: brechen → gebrochen.
      - type: gap
        q: Gestern ___ ich Kopfschmerzen und konnte nicht lernen. (haben, Präteritum)
        answer: [hatte]
        why: haben в Präteritum — hatte.
      - type: gap
        q: Ich habe die Prüfung ___. (bestehen)
        answer: [bestanden]
        why: be- → без ge-.
      - type: order
        answer: Ich habe gestern zu viel Kaffee getrunken.
        tokens: [Ich, habe, gestern, zu viel, Kaffee, getrunken]
        also: [Gestern habe ich zu viel Kaffee getrunken.]
        ru: Вчера я выпил слишком много кофе.
      - type: order
        answer: Am Abend bin ich früh eingeschlafen.
        tokens: [Am Abend, bin, ich, früh, eingeschlafen]
        ru: Вечером я рано заснул.
      - type: table
        title: Unregelmäßige Verben
        head: [Infinitiv, Präteritum, Perfekt]
        rows:
          - [gehen, "?ging", "?ist gegangen"]
          - [nehmen, "?nahm", "?hat genommen"]
          - [bleiben, "?blieb", "?ist geblieben"]
          - [bringen, "?brachte", "?hat gebracht"]
          - [trinken, "?trank", "?hat getrunken"]

dialogues:
  # ------------------------------------------------------------------
  - id: hd-d-arzt
    title: In der Arztpraxis
    title_ru: На приёме у врача
    situation_ru: Вы Тарас Мельник и пришли к врачу в Гейдельберге. Три дня болит горло, течёт из носа, вечером была температура. Вам нужны рецепт и справка для работодателя. (В Австрии больничный называют Krankenstand, а справку — Krankenstandsbestätigung.)
    partner: Ärztin
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Guten Morgen, Herr Melnyk. Nehmen Sie bitte Platz. Was fehlt Ihnen denn?
        ru: Доброе утро, господин Мельник. Присаживайтесь, пожалуйста. Что у вас болит?
        options:
          - t: Guten Morgen! Ich habe Halsschmerzen und Schnupfen.
            ru: Доброе утро! У меня болит горло и насморк.
            next: n2
          - t: Ich bin erkältet und fühle mich sehr schlecht.
            ru: Я простужен и чувствую себя очень плохо.
            next: n2
          - t: Ich bin krank. Machen Sie mich gesund.
            ru: Я болен. Сделайте меня здоровым.
            next: n2
            ok: false
            fb: "Звучит как приказ и ничего не объясняет. Назовите симптомы: «Ich habe Halsschmerzen und Schnupfen.»"
      n2:
        say: Seit wann haben Sie die Beschwerden?
        ru: С какого времени у вас эти жалобы?
        options:
          - t: Seit drei Tagen.
            ru: Уже три дня.
            next: n3
          - t: Seit Sonntag. Gestern Abend habe ich auch Fieber bekommen.
            ru: С воскресенья. Вчера вечером у меня поднялась температура.
            next: n3
          - t: Vor drei Tage.
            ru: Три дня назад (неверная форма).
            next: n3
            ok: false
            fb: "«Seit drei Tagen» — «уже три дня». «Vor drei Tagen» — «три дня назад». После обоих предлогов Dat.: Tagen, а не «Tage»."
      n3:
        say: Haben Sie Fieber gemessen?
        ru: Вы мерили температуру?
        options:
          - t: Ja, gestern Abend hatte ich 38,5.
            ru: Да, вчера вечером было 38,5.
            next: n4
          - t: Nein, ich habe kein Thermometer.
            ru: Нет, у меня нет термометра.
            next: n4
          - t: Ja, gestern ich habe gemessen 38,5.
            ru: Да, вчера я измерил 38,5.
            next: n4
            ok: false
            fb: "В Perfekt спрягаемая часть стоит на позиции 2, Partizip II — в конце. Лучше «Ja, gestern habe ich 38,5 gemessen.»"
      n4:
        say: Bitte machen Sie den Mund auf und sagen Sie „Ah“. – Ja, der Hals ist rot. Die Lunge ist in Ordnung. Sind Sie gegen Medikamente allergisch?
        ru: Откройте, пожалуйста, рот и скажите «а-а». – Да, горло красное. Лёгкие в порядке. У вас есть аллергия на лекарства?
        options:
          - t: Nein, ich habe keine Allergien.
            ru: Нет, у меня нет аллергии.
            next: n5
          - t: Ja, ich bin allergisch gegen Penicillin.
            ru: Да, у меня аллергия на пенициллин.
            next: n5
          - t: Entschuldigung, was bedeutet „allergisch“?
            ru: Извините, что значит «allergisch»?
            next: n4b
      n4b:
        say: Vertragen Sie manche Medikamente nicht? Bekommen Sie zum Beispiel einen Ausschlag auf der Haut?
        ru: Вы плохо переносите некоторые лекарства? Например, появляется ли сыпь на коже?
        options:
          - t: Nein, so etwas hatte ich noch nie.
            ru: Нет, такого у меня ещё никогда не было.
            next: n5
          - t: Ja, bei Penicillin habe ich einmal einen Ausschlag bekommen.
            ru: Да, от пенициллина у меня однажды была сыпь.
            next: n5
      n5:
        say: Gut. Es ist eine starke Erkältung, aber nichts Schlimmes. Ich schreibe Ihnen ein Rezept für Halstabletten und Nasentropfen. Nehmen Sie die Tabletten dreimal täglich nach dem Essen.
        ru: Хорошо. Это сильная простуда, но ничего серьёзного. Я выпишу вам рецепт на таблетки для горла и капли в нос. Принимайте таблетки три раза в день после еды.
        options:
          - t: Vielen Dank. Muss ich noch etwas beachten?
            ru: Большое спасибо. Нужно ли ещё что-то учесть?
            next: n6
          - t: Danke, Frau Doktor. Wie lange soll ich die Tropfen nehmen?
            ru: Спасибо, доктор. Как долго мне принимать капли?
            next: n6
          - t: Ich nehme alle Tabletten sofort.
            ru: Я приму все таблетки сразу.
            next: n6
            ok: false
            fb: Опасная идея. Лекарства принимают так, как сказал врач, — здесь три раза в день, а не все сразу.
      n6:
        say: Trinken Sie viel Tee, ruhen Sie sich aus und bleiben Sie ein paar Tage zu Hause. Brauchen Sie eine Krankmeldung für Ihren Arbeitgeber?
        ru: Пейте много чая, отдыхайте и несколько дней оставайтесь дома. Вам нужна справка для работодателя?
        options:
          - t: Ja, bitte. Ich brauche eine Krankmeldung bis Freitag.
            ru: "Да, пожалуйста. Мне нужна справка до пятницы. (В Австрии: Krankenstandsbestätigung, «im Krankenstand sein».)"
            next: n7
          - t: Ja, ich muss mich in der Firma krankmelden.
            ru: Да, мне нужно сообщить в фирму, что я заболел.
            next: n7
          - t: Ich brauche Papier für Chef, ich nicht kommen.
            ru: Мне нужна бумага для шефа, я не прийти.
            next: n7
            ok: false
            fb: "Так не говорят, нужны полные предложения с глаголом: «Ich brauche eine Krankmeldung für meinen Chef.»"
      n7:
        say: Gut, ich schreibe Sie bis Freitag krank. Die Praxis schickt die Bescheinigung an die Krankenkasse. Kommen Sie nächste Woche wieder, wenn es nicht besser ist.
        ru: Хорошо, я оформляю вам больничный до пятницы. Практика отправит справку в страховую. Приходите на следующей неделе, если лучше не станет.
        options:
          - t: Vielen Dank. Auf Wiedersehen!
            ru: Большое спасибо. До свидания!
            next: end
          - t: Danke! Ich komme wieder, wenn die Halsschmerzen nicht weggehen.
            ru: Спасибо! Я приду снова, если боль в горле не пройдёт.
            next: end
          - t: Tschüss, Doktor!
            ru: Пока, доктор!
            next: end
            ok: false
            fb: "«Tschüss» слишком неформально для врача. Лучше «Auf Wiedersehen!» (в Австрии — «Auf Wiederschauen!»)."
      end:
        say: Gute Besserung, Herr Melnyk! Auf Wiedersehen.
        ru: Выздоравливайте, господин Мельник! До свидания.
        end: true

  # ------------------------------------------------------------------
  - id: hd-d-apotheke
    title: In der Apotheke
    title_ru: В аптеке
    situation_ru: Вы Айлин Демир. Второй день вас мучает кашель, горло слегка болит. Вы хотите купить в аптеке в Гейдельберге средство без рецепта и спросить, как его принимать.
    partner: Apothekerin
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Guten Tag! Wie kann ich Ihnen helfen?
        ru: Добрый день! Чем могу помочь?
        options:
          - t: Guten Tag! Ich habe Husten und Halsschmerzen. Was können Sie mir empfehlen?
            ru: Добрый день! У меня кашель и болит горло. Что вы можете мне посоветовать?
            next: n2
          - t: Ich suche etwas gegen Husten.
            ru: Я ищу что-нибудь от кашля.
            next: n2
          - t: Ich brauche Medizin. Sofort!
            ru: Мне нужно лекарство. Немедленно!
            next: n2
            ok: false
            fb: "Слишком резко, и не сказано, что болит. Лучше «Ich suche etwas gegen Husten.» или «Was können Sie mir gegen Husten empfehlen?»"
      n2:
        say: Haben Sie auch Fieber?
        ru: Температура у вас тоже есть?
        options:
          - t: Nein, ich habe kein Fieber. Nur seit zwei Tagen Husten.
            ru: Нет, температуры нет. Только два дня кашель.
            next: n3
          - t: Ja, ein bisschen, 37,8.
            ru: Да, небольшая, 37,8.
            next: n2b
          - t: Ich habe nicht Fieber.
            ru: У меня нет температуры (неверно).
            next: n3
            ok: false
            fb: "Перед существительным без артикля отрицание — kein: «Ich habe kein Fieber.»"
      n2b:
        say: Das ist nur leicht erhöht. Wenn das Fieber höher wird oder länger als drei Tage dauert, sollten Sie zum Arzt gehen.
        ru: Это лишь слегка повышенная температура. Если температура поднимется или продлится больше трёх дней, вам нужно к врачу.
        options:
          - t: Gut, das mache ich. Danke für den Rat.
            ru: Хорошо, так и сделаю. Спасибо за совет.
            next: n3
          - t: Ja, ich gehe zum Arzt, wenn es schlimmer wird.
            ru: Да, пойду к врачу, если станет хуже.
            next: n3
      n3:
        say: Sind Sie gegen Medikamente allergisch? Nehmen Sie schon etwas anderes ein?
        ru: У вас есть аллергия на лекарства? Вы уже принимаете что-нибудь другое?
        options:
          - t: Nein, ich bin nicht allergisch und nehme nichts ein.
            ru: Нет, аллергии у меня нет, и я ничего не принимаю.
            next: n4
          - t: Ich bin allergisch gegen Penicillin, sonst nichts.
            ru: У меня аллергия на пенициллин, больше ни на что.
            next: n4
          - t: Ich weiß nicht.
            ru: Не знаю.
            next: n4
            ok: false
            fb: "В аптеке это вопрос безопасности, поэтому ответ «не знаю» не годится. Скажите «Ich weiß es nicht genau. Ich frage meinen Arzt.»"
      n4:
        say: Dann empfehle ich Ihnen diesen Hustensaft. Er ist rezeptfrei. Nehmen Sie dreimal täglich einen Esslöffel.
        ru: Тогда я рекомендую вам этот сироп от кашля. Он продаётся без рецепта. Принимайте по столовой ложке три раза в день.
        options:
          - t: Wie lange soll ich ihn nehmen?
            ru: Как долго мне его принимать?
            next: n5
          - t: Kann ich den Saft auch nach dem Essen nehmen?
            ru: Можно принимать сироп и после еды?
            next: n5
      n5:
        say: Höchstens eine Woche. Lesen Sie bitte vor der Einnahme die Packungsbeilage. Und trinken Sie viel Tee.
        ru: Не больше недели. Пожалуйста, перед приёмом прочитайте инструкцию. И пейте побольше чая.
        options:
          - t: Das mache ich. Hat der Saft Nebenwirkungen?
            ru: Хорошо. У сиропа есть побочные действия?
            next: n6
          - t: Danke. Muss ich noch etwas beachten?
            ru: Спасибо. Нужно ли что-то ещё учесть?
            next: n6
          - t: Ich lese keine Packungsbeilage. Sie ist zu lang.
            ru: Я не читаю инструкцию. Она слишком длинная.
            next: n6
            ok: false
            fb: "Инструкцию к лекарству стоит читать всегда. Лучше сказать «Das mache ich.» и спросить про побочные действия."
      n6:
        say: Selten. Manche Menschen werden davon müde. Dann sollten Sie nicht Auto fahren. Brauchen Sie noch etwas, zum Beispiel Halstabletten?
        ru: Редко. От него некоторые люди становятся сонными. Тогда не стоит садиться за руль. Вам нужно что-то ещё, например таблетки для горла?
        options:
          - t: Ja, bitte. Was kosten die Halstabletten?
            ru: Да, пожалуйста. Сколько стоят таблетки для горла?
            next: n7
          - t: Nein, danke. Was macht das zusammen?
            ru: Нет, спасибо. Сколько с меня?
            next: n7
      n7:
        say: Das macht zusammen 11,90 Euro. Bezahlen Sie bar oder mit Karte?
        ru: Всего 11,90 евро. Вы платите наличными или картой?
        options:
          - t: Mit Karte, bitte.
            ru: Картой, пожалуйста.
            next: end
          - t: Bar, bitte. Hier sind 20 Euro.
            ru: Наличными, пожалуйста. Вот 20 евро.
            next: end
      end:
        say: Danke schön! Gute Besserung und einen schönen Tag!
        ru: Спасибо! Выздоравливайте и хорошего дня!
        end: true

texts:
  # ------------------------------------------------------------------
  - id: hd-t-ratgeber
    kind: Artikel
    title: Gesund lernen in der Prüfungszeit
    text: |
      Vor großen Prüfungen lernen viele Studierende zu lange und schlafen zu wenig. Das ist ein Fehler, denn ein müder Kopf merkt sich nur wenig. Das gilt auch für Schüler vor dem Abitur (AT: Matura). Hier sind fünf Tipps.

      Erstens: Machen Sie einen Lernplan. Wer weiß, was er heute lernen soll, hat weniger Stress. Planen Sie auch einen freien Tag in der Woche ein.

      Zweitens: Machen Sie Pausen. Nach 45 Minuten sollten Sie für fünf bis zehn Minuten aufstehen, ein Glas Wasser trinken oder ans Fenster gehen. Wenn man lange sitzt, bekommt man leicht Rücken- und Kopfschmerzen.

      Drittens: Schlafen Sie genug. Sieben bis acht Stunden sind ideal. In der Nacht vor der Prüfung sollten Sie nicht mehr den ganzen Stoff wiederholen, sondern früh ins Bett gehen.

      Viertens: Essen Sie gesund. Obst, Nüsse und viel Wasser helfen besser als Cola und Energydrinks.

      Fünftens: Bewegen Sie sich. Ein Spaziergang von 20 Minuten macht den Kopf frei. Wenn Sie Angst vor der Prüfung haben, sprechen Sie mit Freunden. Wenn die Angst sehr stark ist, hilft auch die Beratungsstelle der Uni.
    glossary:
      der Stoff: материал, тема для изучения
      Studierende: студенты
      einplanen: запланировать
      ideal: идеальный, оптимальный
      der Energydrink: энергетический напиток
      die Beratungsstelle: консультационный пункт
      das Abitur: "выпускной школьный экзамен (AT: die Matura)"
    questions:
      - type: tf
        q: Der Text rät, vor der Prüfung die ganze Nacht zu lernen.
        ru: Текст советует перед экзаменом заниматься всю ночь.
        answer: false
      - type: choice
        q: Wann sollte man eine Pause machen?
        ru: Когда нужно делать перерыв?
        options: [nach etwa 45 Minuten, nach zwei Stunden, nach zehn Minuten]
        answer: nach etwa 45 Minuten
      - type: tf
        q: Ein Lernplan kann den Stress verringern.
        ru: План занятий может уменьшить стресс.
        answer: true
      - type: choice
        q: Wie viel Schlaf ist ideal?
        ru: Сколько сна идеально?
        options: [fünf bis sechs Stunden, sieben bis acht Stunden, neun bis zehn Stunden]
        answer: sieben bis acht Stunden
      - type: choice
        q: Was hilft laut Text besser als Cola und Energydrinks?
        ru: Что, согласно тексту, помогает лучше, чем кола и энергетики?
        options: ["Obst, Nüsse und Wasser", "Kaffee und Tee", "Schokolade und Kuchen"]
        answer: Obst, Nüsse und Wasser
      - type: choice
        q: Was kann man tun, wenn die Prüfungsangst sehr stark ist?
        ru: Что можно сделать, если страх перед экзаменом очень сильный?
        options: [die Beratungsstelle der Uni besuchen, mehr Kaffee trinken, noch länger lernen]
        answer: die Beratungsstelle der Uni besuchen

  # ------------------------------------------------------------------
  - id: hd-t-kurs
    kind: Anzeige
    title: Volkshochschule Neckartal – Kursprogramm Herbst
    text: |
      Die Volkshochschule Neckartal bietet im Herbst viele neue Kurse an. Anmeldung bis 20. September im Büro (Montag bis Freitag, 9 bis 12 Uhr) oder online.

      Deutsch B1 – Abendkurs
      Montag und Mittwoch, 18.30 bis 20.00 Uhr, 12 Termine. Beginn: Montag, 28. September. Gebühr: 168 Euro.

      Gesund kochen für Anfänger
      Donnerstag, 17.00 bis 19.30 Uhr, 6 Termine. Gebühr: 54 Euro, dazu 18 Euro für Lebensmittel.

      Rückenfit am Vormittag
      Dienstag, 9.00 bis 10.00 Uhr, 10 Termine. Gebühr: 60 Euro. Bitte bringen Sie eine Matte und ein Handtuch mit.

      Erste Hilfe für den Alltag
      Samstag, 17. Oktober, 9.00 bis 16.00 Uhr, 1 Termin. Gebühr: 45 Euro. Sie üben unter anderem, ein Pflaster oder einen Verband richtig anzulegen.

      Entspannt durch die Prüfungszeit – Yoga
      Freitag, 17.30 bis 18.45 Uhr, 8 Termine. Gebühr: 72 Euro. Vorkenntnisse sind nicht nötig.

      Ermäßigung: Studierende sowie Rentnerinnen und Rentner zahlen 20 Prozent weniger. Bitte bringen Sie einen Ausweis mit. Wenn sich weniger als sechs Personen anmelden, findet der Kurs nicht statt.
    glossary:
      die Gebühr: плата за курс
      die Ermäßigung: скидка
      der Termin: занятие (здесь), дата
      die Matte: коврик
      der Verband: повязка
      anlegen: накладывать
      der Rentner: пенсионер
      die Lebensmittel: продукты питания
      die Vorkenntnisse: предварительные знания
    questions:
      - type: choice
        q: Wann findet der Deutschkurs statt?
        ru: Когда проходит курс немецкого?
        options: [montags und mittwochs am Abend, dienstags am Vormittag, am Samstag]
        answer: montags und mittwochs am Abend
      - type: choice
        q: Wie viel zahlt man für den Kochkurs insgesamt, wenn man keine Ermäßigung hat?
        ru: Сколько платят за кулинарный курс в сумме, если скидки нет?
        options: [54 Euro, 72 Euro, 90 Euro]
        answer: 72 Euro
      - type: tf
        q: Der Kurs „Rückenfit“ findet am Abend statt.
        ru: Курс «Rückenfit» проходит вечером.
        answer: false
      - type: choice
        q: Was müssen die Teilnehmer zu „Rückenfit“ mitbringen?
        ru: Что участники должны взять с собой на «Rückenfit»?
        options: [eine Matte und ein Handtuch, ein Lehrbuch, Sportschuhe und Wasser]
        answer: eine Matte und ein Handtuch
      - type: tf
        q: Studierende zahlen weniger.
        ru: Студенты платят меньше.
        answer: true
      - type: choice
        q: Wie lange dauert der Erste-Hilfe-Kurs?
        ru: Сколько длится курс первой помощи?
        options: [zwei Stunden am Abend, einen Samstag von 9 bis 16 Uhr, sechs Donnerstage]
        answer: einen Samstag von 9 bis 16 Uhr

listening:
  # ------------------------------------------------------------------
  - id: hd-h-praxis
    kind: Nachricht
    title: Der Anrufbeantworter der Praxis
    voice: de-DE
    lines:
      - s: A
        t: "Guten Tag, Sie sind verbunden mit der Gemeinschaftspraxis Dr. Berger und Dr. Hofmann in Heidelberg. Im Moment ist leider niemand erreichbar."
      - s: A
        t: "Unsere Sprechzeiten sind: Montag, Dienstag und Donnerstag von 8 bis 12 Uhr und von 15 bis 18 Uhr. Mittwoch und Freitag sind wir nur am Vormittag von 8 bis 12 Uhr für Sie da."
      - s: A
        t: "Einen Termin können Sie telefonisch zwischen 8 und 10 Uhr vereinbaren. Rezepte bestellen Sie bitte über unsere Internetseite."
      - s: A
        t: "Wenn es dringend ist und die Praxis geschlossen hat, rufen Sie den ärztlichen Notdienst unter der Nummer 116 117 an. In einem Notfall wählen Sie bitte sofort die 112."
      - s: A
        t: "Bitte hinterlassen Sie nach dem Signalton Ihren Namen, Ihre Telefonnummer und Ihr Anliegen. Wir rufen Sie so schnell wie möglich zurück."
    questions:
      - type: choice
        q: Wann ist die Praxis am Montag geöffnet?
        ru: Когда практика открыта в понедельник?
        options: [von 8 bis 12 Uhr und von 15 bis 18 Uhr, nur von 8 bis 12 Uhr, nur von 15 bis 18 Uhr]
        answer: von 8 bis 12 Uhr und von 15 bis 18 Uhr
      - type: tf
        q: Am Freitagnachmittag ist die Praxis geöffnet.
        ru: В пятницу после обеда практика открыта.
        answer: false
      - type: choice
        q: Wann kann man telefonisch einen Termin vereinbaren?
        ru: Когда можно записаться на приём по телефону?
        options: [zwischen 8 und 10 Uhr, zwischen 10 und 12 Uhr, zwischen 15 und 18 Uhr]
        answer: zwischen 8 und 10 Uhr
      - type: tf
        q: Rezepte kann man über die Internetseite bestellen.
        ru: Рецепты можно заказать через сайт.
        answer: true
      - type: choice
        q: Was soll man tun, wenn es dringend ist und die Praxis geschlossen hat?
        ru: Что делать, если срочно, а практика закрыта?
        options: [den Notdienst unter 116 117 anrufen, bis Montag warten, direkt zur Praxis gehen]
        answer: den Notdienst unter 116 117 anrufen
    dictation:
      - Die Praxis ist am Mittwochnachmittag geschlossen.
      - Einen Termin können Sie zwischen 8 und 10 Uhr vereinbaren.
      - Rezepte bestellen Sie bitte über die Internetseite.
      - Im Notfall wählen Sie die 112.
      - Bitte hinterlassen Sie Ihren Namen und Ihre Telefonnummer.

  # ------------------------------------------------------------------
  - id: hd-h-dialog
    kind: Dialog
    title: Zwei Studenten vor der Prüfung
    voice: de-DE
    lines:
      - s: A
        t: "Hallo Pavel! Du siehst müde aus. Hast du wieder die ganze Nacht gelernt?"
      - s: B
        t: "Leider ja, Dilara, bis halb drei. Am Freitag habe ich die Chemieprüfung, und ich muss noch so viel wiederholen."
      - s: A
        t: "Bis halb drei? Das solltest du nicht machen. Als ich letztes Semester so lange gelernt habe, habe ich in der Prüfung viel vergessen."
      - s: B
        t: "Wirklich? Ich habe Angst, dass ich nicht fertig werde."
      - s: A
        t: "Mach doch einen Plan. Ich lerne jeden Tag nur vier Stunden, mit Pausen. Und abends gehe ich eine halbe Stunde spazieren."
      - s: B
        t: "Spazieren? Dafür habe ich keine Zeit."
      - s: A
        t: "Doch, das hilft! Wenn ich draußen war, kann ich viel besser denken."
      - s: B
        t: "Vielleicht hast du recht. Lernst du allein?"
      - s: A
        t: "Nein, am Mittwoch und Donnerstag sitze ich in der Bibliothek, mit zwei Freundinnen, von 14 bis 17 Uhr. Komm doch mit!"
      - s: B
        t: "Gern! Ich bringe Karteikarten mit. Danach können wir in der Mensa essen."
      - s: A
        t: "Perfekt. Aber trink heute bitte weniger Kaffee, sonst schläfst du wieder nicht."
      - s: B
        t: "Okay, ich versuche es. Bis Mittwoch!"
    questions:
      - type: choice
        q: Wann hat Pavel seine Prüfung?
        ru: Когда у Павла экзамен?
        options: [am Mittwoch, am Donnerstag, am Freitag]
        answer: am Freitag
      - type: choice
        q: Bis wann hat Pavel gestern gelernt?
        ru: До какого времени Павел занимался вчера?
        options: [bis 2.30 Uhr, bis 3.30 Uhr, bis 12.30 Uhr]
        answer: bis 2.30 Uhr
      - type: tf
        q: Dilara geht abends spazieren.
        ru: Дилара по вечерам ходит гулять.
        answer: true
      - type: choice
        q: Wann und wo lernt Dilara mit ihren Freundinnen?
        ru: Когда и где Дилара занимается с подругами?
        options: [am Mittwoch und Donnerstag in der Bibliothek, am Freitag in der Mensa, jeden Abend zu Hause]
        answer: am Mittwoch und Donnerstag in der Bibliothek
      - type: tf
        q: Dilara rät Pavel, mehr Kaffee zu trinken.
        ru: Дилара советует Павлу пить больше кофе.
        answer: false
    dictation:
      - Hast du wieder die ganze Nacht gelernt?
      - Ich lerne jeden Tag nur vier Stunden, mit Pausen.
      - Wenn ich draußen war, kann ich besser denken.
      - Am Mittwoch lernen wir zusammen in der Bibliothek.
      - Trink bitte weniger Kaffee.

writing:
  # ------------------------------------------------------------------
  - id: hd-s-krank
    exam: Goethe A2 · Schreiben Teil 1
    kind: Nachricht
    task: |
      Sie sind krank und können morgen nicht zum Deutschkurs kommen. Schreiben Sie Ihrer Kursleiterin, Frau Neumann, eine kurze Nachricht.
      – Informieren Sie Frau Neumann, dass Sie morgen nicht kommen.
      – Schreiben Sie, was Sie haben (Grund).
      – Bitten Sie um die Hausaufgaben.
      Schreiben Sie 20 bis 30 Wörter. Vergessen Sie Anrede und Gruß nicht.
    task_ru: |
      Вы заболели и завтра не сможете прийти на курс немецкого. Напишите преподавательнице, госпоже Нойман, короткое сообщение: сообщите, что завтра вас не будет; объясните причину (что у вас болит или какой диагноз); попросите прислать домашнее задание.
      Объём 20–30 слов. Не забудьте обращение и подпись.
    points:
      - Sie kommen morgen nicht zum Kurs.
      - Warum? Was haben Sie?
      - Bitte um die Hausaufgaben.
    words: [20, 30]
    structure:
      - "Обращение: Liebe Frau Neumann, (знакомый преподаватель) или Sehr geehrte Frau Neumann, (формально)"
      - "Пункт 1 и 2: я болен(на), поэтому не приду (причина — Fieber, Grippe, Halsschmerzen)"
      - "Пункт 3: вежливая просьба о Hausaufgaben (Können Sie mir bitte … schicken?)"
      - "Короткая благодарность (Danke!)"
      - "Прощание и имя (Viele Grüße / Mit freundlichen Grüßen)"
    redemittel:
      - de: Liebe Frau Neumann,
        ru: Уважаемая госпожа Нойман, (нейтрально-дружелюбно)
      - de: Sehr geehrte Frau Neumann,
        ru: Уважаемая госпожа Нойман, (более формально)
      - de: Ich bin leider krank.
        ru: К сожалению, я заболел(а).
      - de: Ich habe seit gestern Fieber.
        ru: Со вчерашнего дня у меня температура.
      - de: Ich habe Halsschmerzen und Husten.
        ru: У меня болит горло и кашель.
      - de: Deshalb kann ich morgen nicht zum Kurs kommen.
        ru: Поэтому завтра я не смогу прийти на курс.
      - de: Ich komme morgen leider nicht.
        ru: К сожалению, завтра я не приду.
      - de: Ich bleibe zu Hause.
        ru: Я остаюсь дома.
      - de: Können Sie mir bitte die Hausaufgaben schicken?
        ru: Не могли бы вы прислать мне, пожалуйста, домашнее задание?
      - de: Was haben wir als Hausaufgabe auf?
        ru: Что нам задано на дом?
      - de: Vielen Dank für Ihr Verständnis.
        ru: Спасибо за понимание.
      - de: Viele Grüße / Mit freundlichen Grüßen
        ru: С приветом (дружелюбно) / С уважением (формально)
    model: |
      Liebe Frau Neumann,

      ich habe seit gestern Fieber und Halsschmerzen. Deshalb kann ich morgen nicht zum Kurs kommen. Können Sie mir bitte die Hausaufgaben schicken? Danke!

      Viele Grüße
      Oleksandra Kravets
    checklist:
      - Все три пункта задания раскрыты (не приду, причина, просьба о Hausaufgaben)?
      - Есть обращение, прощание и имя?
      - Обращение и прощание одного стиля (Liebe Frau … → Viele Grüße; Sehr geehrte … → Mit freundlichen Grüßen)?
      - Модальный глагол с инфинитивом в конце (kann … kommen, Können Sie … schicken)?
      - Существительные с большой буквы (Fieber, Halsschmerzen, Hausaufgaben)?
      - Объём 20–30 слов?
      - Вежливая просьба с bitte?

speaking:
  # ------------------------------------------------------------------
  - id: hd-sp-1
