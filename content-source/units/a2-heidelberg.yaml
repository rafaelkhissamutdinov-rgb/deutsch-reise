id: a2-heidelberg
level: A2
city: Heidelberg
country: DE
title: Lernen & Gesundheit
title_ru: Учёба и здоровье
intro: |
  Вы в Гейдельберге: учитесь на курсах или в университете, готовитесь к экзамену и иногда болеете.
  В юните учимся говорить о школе, учёбе и экзаменах, объяснять врачу и в аптеке, что болит, и давать советы.
  Грамматика: глаголы с предлогами, Infinitiv mit zu и um … zu, советы с sollte и Imperativ, als и wenn, Perfekt и Präteritum.

grammar:
  # ------------------------------------------------------------------
  - id: hd-g-praep-verben
    title: Verben mit Präpositionen (warten auf, Angst haben vor …)
    title_ru: Глаголы с предлогами; вопросы wo(r)- и ответы da(r)-
    terms:
      - t: Präposition
        ru: предлог (auf, an, um, vor, für, über …)
      - t: Verb mit Präposition (Präpositionalverb)
        ru: глагол, который всегда стоит с одним определённым предлогом (warten auf, sich kümmern um)
      - t: Rektion
        ru: "управление: какой предлог и какой падеж требует слово"
      - t: Akkusativ (Akk.)
        ru: винительный падеж (на wen? was? — auf den Bus, um die Mutter)
      - t: Dativ (Dat.)
        ru: дательный падеж (vor der Prüfung, an dem Kurs)
      - t: Fragewort wo(r)-
        ru: вопросительное слово к вещи или событию (worauf, wofür, woran, womit, worüber, wovor)
      - t: Pronominaladverb da(r)-
        ru: "слово-замена для вещи или события (darauf, dafür, daran, damit, darüber, davor); для людей не употребляется"
      - t: Person / Sache
        ru: человек (кто?) / вещь или событие (что?)
      - t: Personalpronomen
        ru: личное местоимение (ich, du, er, sie …), здесь в Akk. (ihn, sie, uns)
      - t: reflexives Verb (sich …)
        ru: возвратный глагол (sich kümmern, sich ärgern); sich меняется по лицу (ich ärgere mich)
    meaning: |
      Многие глаголы в немецком всегда идут с одним и тем же предлогом: warten auf, sich kümmern um, denken an. Предлог нужно учить вместе с глаголом, а русский предлог для выбора не подходит: «ждать кого-то» — warten auf (+ Akk.), «бояться чего-то» — Angst haben vor (+ Dat.).
      После предлога падеж зависит от глагола. Большинство глаголов из этой темы — с Akk. (warten auf, sich kümmern um, denken an, sich interessieren für, sich ärgern über, sich vorbereiten auf). С Dat. идут Angst haben vor, teilnehmen an, leiden unter, sich erholen von.
      Если спрашиваем о человеке, вопрос такой: предлог + wen/wem (Auf wen wartest du? — Auf meine Ärztin. — Auf sie.). Если о вещи или событии: wo(r) + предлог (Worauf wartest du? — Auf das Ergebnis.). Ответ без повторения: da(r) + предлог (Ich warte darauf.). Перед гласной вставляется -r-: wo-r-auf, da-r-an, da-r-über.
      Для людей da(r)- не используют: Ich denke an meine Oma. → Ich denke an sie. (не «daran»).
    steps:
      - de: Ich warte auf den Bus.
        ru: "warten + auf + Akk.: auf den Bus."
      - de: Auf wen wartest du? – Auf meine Ärztin. – Ich warte auf sie.
        ru: Человек → «auf wen?», в ответе auf sie.
      - de: Worauf wartest du? – Auf das Ergebnis. – Ich warte darauf.
        ru: Вещь → «worauf?», в ответе darauf.
      - de: Sie kümmert sich um ihre kranke Mutter.
        ru: "sich kümmern + um + Akk."
      - de: Hast du Angst vor der Prüfung? – Ja, ich habe Angst davor.
        ru: "Angst haben + vor + Dat.: vor der Prüfung. Замена: davor."
      - de: Denkst du an deine Tabletten? – Ja, ich denke daran.
        ru: "denken + an + Akk. → woran? daran."
      - de: Ich ärgere mich über den Lärm. Worüber ärgerst du dich?
        ru: -r- перед гласной über → worüber, darüber.
      - de: Wir bereiten uns auf die Prüfung vor.
        ru: Приставка vor уходит в конец; sich vorbereiten + auf + Akk.
    table:
      head: [Verb, Präposition + Kasus, Beispiel]
      rows:
        - [warten, auf + Akk., Ich warte auf die Ärztin.]
        - [sich kümmern, um + Akk., "Wer kümmert sich um die Katze?"]
        - [denken, an + Akk., Denk an die Tabletten!]
        - [Angst haben, vor + Dat., Ich habe Angst vor Spritzen.]
        - [sich interessieren, für + Akk., Er interessiert sich für Medizin.]
        - [sich vorbereiten, auf + Akk., Wir bereiten uns auf den Test vor.]
        - [teilnehmen, an + Dat., Sie nimmt an einem Kurs teil.]
        - [sich ärgern, über + Akk., Ich ärgere mich über meinen Fehler.]
    exam: |
      В Goethe A2 Sprechen и Schreiben такие глаголы нужны, когда вы рассказываете о себе и своих планах: Ich interessiere mich für …, Ich warte auf …, Ich habe Angst vor …
      В Lesen и Hören вопрос часто начинается с wo(r)-: Worauf freut sich Anna? Wofür interessiert sich Max? Ответ в тексте стоит с предлогом, поэтому по предлогу легко найти нужное место.
    traps:
      - "Предлог русского глагола не переносится: warten auf (не «warten für»), Angst haben vor (не «Angst von»), denken an («думать о», «помнить о»; denken über — «размышлять о», другое значение)."
      - "Для людей нет davor/daran: Ich warte auf ihn. (не «Ich warte darauf», если ждёте человека)."
      - "Перед гласной нужен -r-: worauf, darüber, woran. Перед согласной — без r: wofür, damit, wovon."
      - "vor — Dat.: vor der Prüfung, vor dem Test, vor Spritzen. Но auf/an/um/über/für в этой теме — Akk."
      - "Приставка отделяется: Wir bereiten uns auf die Prüfung vor. Она не остаётся рядом с глаголом."
      - "Возвратное sich меняется по лицу: ich kümmere mich, du kümmerst dich, wir kümmern uns."
    exercises:
      - type: choice
        q: Ich warte ___ meinen Bruder.
        options: [auf, für, an]
        answer: auf
        why: warten + auf + Akk.
      - type: choice
        q: Wir kümmern uns ___ die Hausaufgaben.
        options: [um, über, für]
        answer: um
        why: sich kümmern + um + Akk.
      - type: choice
        q: Hast du Angst ___ der Prüfung?
        options: [vor, auf, von]
        answer: vor
        why: Angst haben + vor + Dat. → vor der Prüfung.
      - type: choice
        q: "___ interessierst du dich? – Für Medizin."
        options: [Wofür, Worauf, Wovor]
        answer: Wofür
        why: sich interessieren für → wofür (перед согласной без r).
      - type: choice
        q: Denkst du an die Tabletten? – Ja, ich denke ___.
        options: [daran, dafür, darauf]
        answer: daran
        why: denken an → daran.
      - type: choice
        q: Wartest du auf Frau Brandt? – Ja, ich warte auf ___.
        options: [sie, es, ihr]
        answer: sie
        why: Это человек, поэтому предлог + местоимение (auf sie), без da(r)-. Frau → sie.
      - type: gap
        q: Die Studenten bereiten sich ___ die Prüfung vor.
        answer: [auf]
        why: sich vorbereiten + auf + Akk.
      - type: gap
        q: "___ ärgerst du dich? – Über den Lärm in der Bibliothek."
        answer: [Worüber]
        why: sich ärgern über → worüber (-r- перед гласной).
      - type: gap
        q: Ich habe Angst vor Spritzen. Meine Schwester hat auch Angst ___.
        answer: [davor]
        why: Angst haben vor → davor.
      - type: gap
        q: Wir nehmen ___ einem Sprachkurs teil.
        answer: [an]
        why: teilnehmen + an + Dat.
      - type: order
        answer: Ich kümmere mich um meine kranke Oma.
        tokens: [Ich, kümmere, mich, um meine kranke Oma]
        ru: Я забочусь о своей больной бабушке.
      - type: order
        answer: Auf wen wartet ihr denn?
        tokens: [Auf wen, wartet, ihr, denn]
        ru: Ну а кого вы ждёте?
      - type: table
        title: Verb und Präposition
        head: [Verb, Präposition]
        rows:
          - [warten, "?auf"]
          - [sich kümmern, "?um"]
          - [denken, "?an"]
          - [Angst haben, "?vor"]
          - [sich interessieren, "?für"]
          - [teilnehmen, "?an"]
      - type: table
        title: Frage und Antwort bei Sachen
        head: [Satz, Frage, Antwort]
        rows:
          - [warten auf das Ergebnis, "?Worauf", "?darauf"]
          - [sich ärgern über den Fehler, "?Worüber", "?darüber"]
          - [Angst haben vor der Prüfung, "?Wovor", "?davor"]
          - [denken an die Hausaufgaben, "?Woran", "?daran"]

  # ------------------------------------------------------------------
  - id: hd-g-zu-infinitiv
    title: Infinitiv mit zu und um … zu
    title_ru: Инфинитив с zu и оборот um … zu («чтобы»)
    terms:
      - t: Infinitiv
        ru: начальная форма глагола (lernen, aufstehen)
      - t: Infinitiv mit zu
        ru: инфинитив с частицей zu перед ним (zu lernen); стоит в конце
      - t: Infinitivgruppe
        ru: инфинитив со всеми зависимыми словами (den Arzt anzurufen, mehr zu schlafen)
      - t: Modalverb
        ru: модальный глагол (können, müssen, wollen, dürfen, sollen, möchten); после него инфинитив без zu
      - t: trennbares Verb
        ru: глагол с отделяемой приставкой (aufstehen, anrufen, einnehmen)
      - t: um … zu
        ru: оборот цели — «чтобы» (Ich lerne, um die Prüfung zu bestehen.)
      - t: Hauptsatz / Nebensatz
        ru: главное предложение / придаточное (глагол в конце)
      - t: Subjekt
        ru: подлежащее — кто делает действие
    meaning: |
      Инфинитив с zu добавляет к главной мысли второе действие: Ich habe vergessen, den Arzt anzurufen. Инфинитив стоит в самом конце, перед ним zu.
      Где нужен zu: после глаголов вроде anfangen, aufhören, beginnen, versuchen, vergessen, vorhaben, hoffen; после выражений Lust/Zeit/Angst haben; после «Es ist + прилагательное» (wichtig, gesund, schwer): Es ist wichtig, genug zu schlafen.
      Модальные глаголы идут с инфинитивом без zu: Ich will mehr schlafen. Без zu также после werden и gehen: Ich gehe schlafen.
      У глагола с отделяемой приставкой zu встаёт между приставкой и корнем и пишется слитно: aufstehen → aufzustehen, einnehmen → einzunehmen.
      um … zu отвечает на вопрос «зачем?» и значит «чтобы»: Ich gehe in die Apotheke, um Tabletten zu kaufen. Подлежащее у обоих действий одно и то же.
      Запятая: перед um … zu она обязательна; перед остальными Infinitivgruppen её можно ставить всегда — так проще и надёжнее.
    steps:
      - de: Ich muss heute lernen.
        ru: Модальный глагол → инфинитив без zu.
      - de: Ich habe keine Lust, heute zu lernen.
        ru: "Lust haben + zu + Infinitiv, запятая перед группой."
      - de: Es ist wichtig, genug zu schlafen.
        ru: "Es ist + прилагательное + zu + Infinitiv."
      - de: Sie hat vergessen, den Arzt anzurufen.
        ru: "anrufen → an|zu|rufen: zu между приставкой и корнем, слитно."
      - de: Er versucht, früher aufzustehen.
        ru: "aufstehen → aufzustehen."
      - de: Ich habe vor, mich mehr zu bewegen.
        ru: "Возвратный глагол: sich стоит перед zu (mich ... zu bewegen)."
      - de: Ich gehe in die Apotheke, um Tabletten zu kaufen.
        ru: "um … zu: цель действия — «чтобы купить»."
      - de: Wir treffen uns, um gemeinsam zu lernen.
        ru: Одно подлежащее (wir) у обоих действий.
    table:
      head: [Тип, Пример, Что с zu]
      rows:
        - [Modalverb, Ich will mehr schlafen., без zu]
        - [Verb + zu, "Ich versuche, früher zu lernen.", zu перед инфинитивом]
        - [trennbares Verb, "Vergiss nicht, die Tabletten einzunehmen.", ein-zu-nehmen]
        - [Es ist + Adjektiv, "Es ist gesund, viel zu trinken.", zu перед инфинитивом]
        - [um … zu, "Ich trinke Tee, um mich zu entspannen.", um … zu — «чтобы»]
    exam: |
      В Goethe A2 Schreiben и Sprechen нужно объяснять цели и планы: Ich lerne Deutsch, um in Heidelberg zu studieren. Ich habe keine Zeit, ins Kino zu gehen. Ich habe vor, mehr Sport zu machen.
      В Lesen и Hören um … zu подсказывает, зачем человек что-то делает; вопрос в задании часто начинается с Wozu? или Warum?
    traps:
      - "После модального глагола zu не ставят: Ich kann schlafen (не «Ich kann zu schlafen»)."
      - "Отделяемая приставка: aufzustehen, einzunehmen (не «zu aufstehen», не «aufstehen zu»)."
      - "Инфинитив с zu — в самом конце группы: Ich habe keine Zeit, ins Kino zu gehen."
      - "um … zu — только если подлежащее одно. Если подлежащие разные, нужен damit-Nebensatz: Ich erkläre es, damit du es verstehst."
      - "«Для» с существительным — für: Ich lerne für die Prüfung. «Чтобы» с глаголом — um … zu: Ich lerne, um die Prüfung zu bestehen."
      - "Перед um … zu запятая обязательна."
    exercises:
      - type: choice
        q: Ich versuche, mehr ___.
        options: [zu schlafen, schlafen, zu schlafe]
        answer: zu schlafen
        why: versuchen + Infinitiv mit zu.
      - type: choice
        q: Ich möchte morgen früh ___.
        options: [aufstehen, zu aufstehen, aufzustehen]
        answer: aufstehen
        why: möchte — Modalverb, поэтому без zu.
      - type: choice
        q: Vergiss nicht, die Tabletten ___!
        options: [einzunehmen, zu einnehmen, einnehmen zu]
        answer: einzunehmen
        why: ein·nehmen → ein-zu-nehmen, пишется слитно.
      - type: choice
        q: Ich gehe in die Apotheke, ___ Hustensaft zu kaufen.
        options: [um, damit, für]
        answer: um
        why: Цель + одно подлежащее → um … zu.
      - type: choice
        q: Sie lernt jeden Tag, ___ die Prüfung zu bestehen.
        options: [um, für, zu]
        answer: um
        why: Цель («чтобы») → um … zu.
      - type: choice
        q: Welcher Satz ist richtig?
        options: ["Es ist gesund, viel Wasser zu trinken.", "Es ist gesund, viel Wasser trinken zu.", "Es ist gesund, zu trinken viel Wasser."]
        answer: "Es ist gesund, viel Wasser zu trinken."
        why: zu стоит прямо перед инфинитивом, инфинитив — в конце.
      - type: gap
        q: Hast du morgen Zeit, mich ___? (anrufen)
        answer: [anzurufen]
        why: an·rufen → an-zu-rufen.
      - type: gap
        q: Er hat vergessen, den Termin ___. (absagen)
        answer: [abzusagen]
        why: ab·sagen → ab-zu-sagen.
      - type: gap
        q: Ich lerne Deutsch, ___ in Wien zu studieren.
        answer: [um]
        why: Цель → um … zu.
      - type: gap
        q: Wir haben angefangen, früher ___ lernen.
        answer: [zu]
        why: anfangen + Infinitiv mit zu.
      - type: order
        answer: Ich habe keine Zeit, zum Arzt zu gehen.
        tokens: [Ich, habe, "keine Zeit,", zum Arzt, zu, gehen]
        ru: У меня нет времени идти к врачу.
      - type: order
        answer: Sie ruft an, um einen Termin zu vereinbaren.
        tokens: [Sie, ruft, "an,", um, einen Termin, zu, vereinbaren]
        ru: Она звонит, чтобы договориться о приёме.
      - type: table
        title: Infinitiv mit zu
        head: [Infinitiv, mit zu]
        rows:
          - [lernen, "?zu lernen"]
          - [aufstehen, "?aufzustehen"]
          - [einnehmen, "?einzunehmen"]
          - [anrufen, "?anzurufen"]
          - [sich entspannen, "?sich zu entspannen"]

  # ------------------------------------------------------------------
  - id: hd-g-sollte
    title: Ratschläge geben – sollte(n) und Imperativ
    title_ru: "Советы: sollte(n) и повелительное наклонение"
    terms:
      - t: Ratschlag
        ru: совет
      - t: sollen → sollte
        ru: "sollte — мягкая форма (Konjunktiv II): «стоило бы, тебе лучше»"
      - t: Konjunktiv II
        ru: "форма, которая делает речь мягче и вежливее; здесь только sollte(n)"
      - t: Imperativ
        ru: "повелительное наклонение: просьба, совет, указание (Trink! Trinkt! Trinken Sie!)"
      - t: Modalverb
        ru: модальный глагол; здесь sollen
      - t: Infinitiv
        ru: начальная форма глагола; после sollte стоит в конце без zu
      - t: Stamm
        ru: основа глагола (trink-en → trink-)
      - t: Vokalwechsel
        ru: "смена гласной в основе (essen → du isst → Iss!)"
      - t: trennbares Verb
        ru: глагол с отделяемой приставкой (anrufen → Ruf an!)
      - t: Höflichkeitsform (Sie)
        ru: вежливое обращение на «Вы»; в Imperativ — Nehmen Sie …!
    meaning: |
      Совет можно дать двумя основными способами.
      1) sollte(n) + Infinitiv в конце: Du solltest mehr Wasser trinken. — Тебе стоило бы пить больше воды. Это мягкий совет, не приказ. Формы: ich sollte, du solltest, er/sie/es sollte, wir sollten, ihr solltet, sie/Sie sollten.
      2) Imperativ — прямой совет или просьба. Форма du: основа без окончания (Trink!), ihr: основа + -t (Trinkt!), Sie: глагол + Sie (Trinken Sie!). Чтобы смягчить, добавьте bitte или doch mal: Trink doch mal einen Tee.
      У глаголов с Vokalwechsel e → i в форме du: Iss! Nimm! Sprich! Умлаут не добавляется: Fahr! Schlaf! Если основа на -t или -d, добавляется -e: Warte! Arbeite nicht so viel!
      Отделяемая приставка уходит в конец: Ruf die Praxis an! Steh früher auf! Возвратное sich меняется: Ruh dich aus! Ruht euch aus! Ruhen Sie sich aus!
      Отличайте sollte (совет) от du sollst/er soll: это указание от другого человека, например врача. Der Arzt sagt: Du sollst im Bett bleiben. — Врач велел тебе лежать.
    steps:
      - de: Ich habe Kopfschmerzen. – Du solltest mehr Wasser trinken.
        ru: du → solltest, trinken — Infinitiv в конце.
      - de: Ihr solltet früher ins Bett gehen.
        ru: ihr → solltet.
      - de: Herr Aydin, Sie sollten zu Hause bleiben.
        ru: Sie → sollten.
      - de: Trink viel Tee!
        ru: "Imperativ du: основа trink- без окончания, подлежащее не нужно."
      - de: Bleibt heute im Bett!
        ru: "Imperativ ihr: основа + t."
      - de: Nehmen Sie die Tabletten nach dem Essen.
        ru: "Imperativ Sie: глагол + Sie."
      - de: Iss weniger Zucker!
        ru: essen → du isst → Iss! (Vokalwechsel e → i).
      - de: Ruf die Praxis an!
        ru: Приставка an — в конец.
      - de: Ruh dich ein bisschen aus!
        ru: "sich ausruhen → Ruh dich aus!"
    table:
      head: [Person, sollen (Ratschlag), Imperativ (trinken)]
      rows:
        - [ich, sollte, "–"]
        - [du, solltest, Trink!]
        - [er / sie / es, sollte, "–"]
        - [wir, sollten, "–"]
        - [ihr, solltet, Trinkt!]
        - [sie / Sie, sollten, Trinken Sie!]
    exam: |
      В Goethe A2 Schreiben и Sprechen часто нужно дать совет: другу, который болен или нервничает перед экзаменом. Подойдёт Du solltest … или Imperativ с bitte, doch mal.
      В Lesen и Hören ищите рекомендации врача или аптекаря: Sie sollten …, Nehmen Sie …, Bleiben Sie …
    traps:
      - "sollte — мягкий совет; du sollst — указание от кого-то. Для своего совета берите sollte."
      - "После sollte инфинитив стоит в конце без zu: Du solltest mehr schlafen (не «zu schlafen»)."
      - "du solltest, ihr solltet — не забывайте -st и -t."
      - "В Imperativ du подлежащее не называют и окончание -st не нужно: Trink! (не «Du trink!», не «Trinkst!»)."
      - "Vokalwechsel e → i есть и в Imperativ: Iss! Nimm! Sprich! Но fahren и schlafen без умлаута: Fahr! Schlaf!"
      - "Отделяемая приставка в конце: Ruf mich an! Steh früh auf!"
      - "Imperativ Sie: глагол стоит первым, Sie — сразу после него: Bleiben Sie zu Hause!"
      - "sein: Sei ruhig! Seid ruhig! Seien Sie ruhig!"
    exercises:
      - type: choice
        q: Du hast Rückenschmerzen. Du ___ mehr Bewegung machen.
        options: [solltest, sollte, solltet]
        answer: solltest
        why: du → solltest.
      - type: choice
        q: Ihr ___ nicht so lange am Computer sitzen.
        options: [solltet, solltest, sollten]
        answer: solltet
        why: ihr → solltet.
      - type: choice
        q: Herr Aydin, Sie ___ heute zu Hause bleiben.
