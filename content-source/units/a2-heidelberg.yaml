    task: Was machen Sie für Ihre Gesundheit?
    task_ru: "Расскажите о себе по ключевым словам: что вы делаете для своего здоровья. Говорите 1–2 минуты, потом ответьте на вопрос партнёра."
    prompts: [Sport und Bewegung, Essen und Trinken, Schlaf, Pausen und Entspannung, Arzt]
    model: |
      Ich versuche, mich regelmäßig zu bewegen. Zweimal pro Woche gehe ich joggen, und am Wochenende mache ich oft einen langen Spaziergang am Neckar. Ich esse viel Obst und Gemüse und trinke jeden Tag mindestens zwei Liter Wasser. Süßigkeiten esse ich nur selten.
      In der Woche schlafe ich meistens sieben Stunden. Wenn ich viel Stress habe, höre ich abends Musik, um mich zu entspannen. Zum Arzt gehe ich einmal im Jahr, zur Kontrolle. Zum Zahnarzt gehe ich zweimal im Jahr.
      Partnerfrage: Und was machst du für deine Gesundheit?
