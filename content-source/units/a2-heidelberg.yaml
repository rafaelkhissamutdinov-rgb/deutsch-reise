      Lieblingsfach: Was war dein Lieblingsfach in der Schule? – Mathematik. Ich habe gern gerechnet.
      Sprachkurs: Wie oft hast du Sprachkurs? – Dreimal pro Woche, am Abend.
      Prüfung: Hast du Angst vor Prüfungen? – Ein bisschen. Vor jeder Prüfung bin ich nervös.
      Arzt: Wann warst du das letzte Mal beim Arzt? – Vor drei Monaten, ich hatte eine Erkältung.
      Sport: Machst du regelmäßig Sport? – Ja, ich jogge zweimal pro Woche.
      Schlaf: Wie viel Schlaf brauchst du? – Ich brauche mindestens sieben Stunden.
  - id: hd-sp-2
