writing:
  - id: hh-s-mail
    exam: Goethe A1 · Schreiben Teil 2
    kind: E-Mail
    task: |
      Sie fahren am Freitag nach Hamburg und bleiben bis Sonntag. Sie haben ein Bett im Hostel „Möwe“ gebucht. Schreiben Sie eine E-Mail an das Hostel.
      – Wann kommen Sie an?
      – Sie möchten Frühstück.
      – Ihr Zug fährt am Sonntag erst am Abend. Wo können Sie Ihr Gepäck lassen?
      Schreiben Sie zu jedem Punkt ein bis zwei Sätze (circa 30 Wörter). Vergessen Sie Anrede und Gruß nicht.
    task_ru: |
      В пятницу вы едете в Гамбург, у вас забронировано место в хостеле «Möwe». Напишите письмо в хостел:
      когда вы приезжаете; что вы хотите завтракать в хостеле; где можно оставить багаж в воскресенье (ваш поезд только вечером).
      По каждому пункту 1–2 предложения (около 30 слов). Не забудьте обращение и подпись.
    points:
      - Wann kommen Sie an?
      - Sie möchten Frühstück.
      - Ihr Zug fährt am Sonntag erst am Abend. Wo können Sie Ihr Gepäck lassen?
    words: [30, 40]
    structure:
      - Обращение (Sehr geehrte Damen und Herren, … — в хостел или отель; Liebe … / Lieber … — другу)
      - "Пункт 1: когда вы приезжаете (день, время)"
      - "Пункт 2: завтрак — хотите ли, когда он бывает"
      - "Пункт 3: вопрос про багаж"
      - Короткая благодарность (Vielen Dank!)
      - Прощание и имя (Mit freundlichen Grüßen / Viele Grüße)
    redemittel:
      - de: Sehr geehrte Damen und Herren,
        ru: Уважаемые дамы и господа, (официальное обращение)
      - de: Liebe Olga, / Lieber Kemal,
        ru: Дорогая Ольга, / Дорогой Кемаль,
      - de: Ich komme am … um … Uhr an.
        ru: Я приезжаю … в … часов.
      - de: Mein Zug kommt um … in Hamburg an.
        ru: Мой поезд прибывает в Гамбург в …
      - de: Ich möchte gern …
        ru: Я бы хотел(а) …
      - de: Wann gibt es Frühstück?
        ru: Когда бывает завтрак?
      - de: Wo kann ich …?
        ru: Где я могу …?
      - de: Ist die Rezeption um … Uhr noch offen?
        ru: Ресепшен ещё открыт в … часов?
      - de: Vielen Dank für Ihre Antwort.
        ru: Заранее спасибо за ответ.
      - de: Mit freundlichen Grüßen
        ru: С уважением (официально)
      - de: Viele Grüße
        ru: С приветом (нейтрально, другу)
    model: |
      Sehr geehrte Damen und Herren,

      ich komme am Freitag um 21 Uhr in Hamburg an. Ich möchte gern Frühstück. Wann gibt es Frühstück? Am Sonntag fährt mein Zug erst um 18 Uhr. Wo kann ich mein Gepäck lassen? Vielen Dank!

      Mit freundlichen Grüßen
      Oleksandr Bondar
    checklist:
      - Все три пункта задания раскрыты?
      - Есть обращение, прощание и имя?
      - Обращение и прощание одного стиля (Sehr geehrte … → Mit freundlichen Grüßen)?
      - В утвердительных предложениях глагол на позиции 2, в вопросах — на 1 или после вопросительного слова?
      - Окончания глаголов правильные (ich komme, ich möchte)?
      - Существительные с большой буквы, вежливое Sie / Ihr — тоже?
      - Объём примерно 30–40 слов?

speaking:
  - id: hh-sp-1
    exam: Goethe A1 · Sprechen Teil 1
    task: Sich vorstellen
    task_ru: Расскажите о себе по ключевым словам. Потом будьте готовы продиктовать по буквам своё имя или назвать номер телефона.
    prompts: ["Name?", "Alter?", "Land?", "Wohnort?", "Sprachen?", "Beruf?", "Hobby?"]
    model: |
      Guten Tag! Ich heiße Yusuf Demir. Ich bin 27 Jahre alt. Ich komme aus der Türkei, aus Ankara. Jetzt wohne ich in Hamburg, in Wilhelmsburg. Ich spreche Türkisch, Englisch und ein bisschen Deutsch. Ich bin Koch von Beruf. Mein Hobby ist Fußball.
      – Buchstabieren Sie bitte Ihren Familiennamen. – D – E – M – I – R.
  - id: hh-sp-2
    exam: Goethe A1 · Sprechen Teil 2
    task: "Fragen stellen und antworten. Thema: Reisen"
    task_ru: Вы вытягиваете карточку со словом по теме «Reisen». Задайте партнёру вопрос с этим словом. Потом ответьте на вопрос партнёра.
    prompts: [Fahrkarte, Koffer, Hotel, Zug, Gleis, Frühstück]
    model: |
      Fahrkarte: Wo kaufst du deine Fahrkarte? – Am Automaten am Bahnhof.
      Koffer: Hast du einen Koffer? – Nein, ich habe nur einen Rucksack.
      Hotel: Wie heißt dein Hotel? – Hotel Am Fleet.
      Zug: Wann fährt dein Zug? – Um 8.30 Uhr.
      Gleis: Von welchem Gleis fährt der Zug nach Kiel? – Von Gleis 14.
      Frühstück: Wann gibt es im Hotel Frühstück? – Von 7 bis 10 Uhr.
  - id: hh-sp-3
    exam: Goethe A1 · Sprechen Teil 3
    task: Bitten formulieren und reagieren
    task_ru: По карточке сформулируйте просьбу к партнёру. Партнёр реагирует (выполняет просьбу или вежливо отказывает). На экзамене на карточках картинки, здесь — слова.
    prompts: [Stadtplan, Schlüssel, Taxi, langsam sprechen, Name buchstabieren, Fenster]
    model: |
      Stadtplan: Haben Sie bitte einen Stadtplan für mich? – Ja, natürlich. Hier, bitte.
      Schlüssel: Gib mir bitte den Schlüssel. – Hier, bitte schön.
      Taxi: Können Sie mir bitte ein Taxi rufen? – Ja, gern. Einen Moment.
      langsam sprechen: Können Sie bitte langsam sprechen? – Ja, natürlich.
      Name buchstabieren: Buchstabieren Sie bitte Ihren Namen. – K – A – Y – A.
      Fenster: Mach bitte das Fenster auf! – Tut mir leid, mir ist kalt.

test:
  - type: choice
    q: Ich ___ 22 Jahre alt.
    options: [bin, habe, ist]
    answer: bin
    why: Возраст — с sein.
  - type: gap
    q: Wo ___ du? – In Altona. (wohnen)
    answer: [wohnst]
    why: du → -st.
  - type: choice
    q: ___ kommen Sie? – Aus Polen.
    options: [Woher, Wohin, Wo]
    answer: Woher
  - type: table
    title: arbeiten — Präsens
    head: [Person, arbeiten]
    rows:
      - [ich, "?arbeite"]
      - [du, "?arbeitest"]
      - [er / sie / es, "?arbeitet"]
      - [ihr, "?arbeitet"]
  - type: choice
    q: ___ Fahrkarte kostet 30 Euro.
    options: [Die, Der, Das]
    answer: Die
    why: die Fahrkarte — женский род.
  - type: choice
    q: Ich habe ___ Bruder, nur eine Schwester.
    options: [keinen, kein, nicht]
    answer: keinen
    why: der Bruder, после haben (Akk.) → keinen.
  - type: order
    answer: Kommt der Zug pünktlich an?
    tokens: [Kommt, der Zug, pünktlich, an]
    ru: Поезд прибывает вовремя?
  - type: gap
    q: Hier ist Ihr ___ für Zimmer 12.
    ru: Вот ваш ключ от номера 12.
    answer: [Schlüssel]
  - type: choice
    q: Das Gegenteil von „Ankunft“ ist ___.
    options: [die Abfahrt, der Ausgang, die Verspätung]
    answer: die Abfahrt
  - type: choice
    q: In Deutschland sagt man „Guten Tag!“. Was sagt man in Österreich oft?
    ru: В Германии говорят «Guten Tag!». Что часто говорят в Австрии?
    options: ["Grüß Gott!", "Moin!", "Tschüss!"]
    answer: Grüß Gott!
  - type: gap
    q: In Österreich sagt man „Jänner“, in Deutschland „___“.
    ru: В Австрии говорят «Jänner», в Германии — «…».
    answer: [Januar]
  - type: order
    answer: Das Zimmer ist nicht groß.
    tokens: [Das Zimmer, ist, nicht, groß]
    ru: Номер небольшой.
