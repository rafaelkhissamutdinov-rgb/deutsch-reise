      - type: choice
        q: Sie kommen um Mitternacht im Hostel an. Was machen Sie?
        ru: Вы приезжаете в хостел в полночь. Что вы делаете?
        options: [Ich rufe vorher an., Ich warte bis 7 Uhr., Ich nehme den Aufzug.]
