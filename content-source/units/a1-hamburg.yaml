      A1-Kurs am Abend: Montag und Mittwoch, 18 bis 20 Uhr. Kleine Gruppen (maximal 10 Personen). Start: 3. November. Anmeldung in der Sprachschule Nordlicht, Lindenstraße 8.

      Hostel Möwe – direkt am Hafen
      Betten ab 22 Euro pro Nacht, Frühstück 6 Euro extra. Rezeption: 7 bis 23 Uhr. Sie kommen später an? Bitte rufen Sie vorher an: 040 55 66 77.

      Liebe Gäste,
      der Aufzug ist bis Freitag kaputt. Bitte nehmen Sie die Treppe. Danke!
    glossary:
      das Schwarze Brett: доска объявлений
      maximal: максимум
      die Anmeldung: запись, регистрация
      extra: дополнительно, за отдельную плату
      vorher: заранее
      an·rufen: звонить по телефону
      die Gäste: гости
      kaputt: сломан
    questions:
