writing:
  - id: ff-s-termin
    exam: Goethe A2 · Schreiben Teil 2
    kind: E-Mail
    task: |
      Sie haben am Mittwoch um 15 Uhr einen Termin bei Ihrer Bankberaterin, Frau Lange. Sie können leider nicht kommen, weil Sie arbeiten müssen. Schreiben Sie eine E-Mail an Frau Lange.
      – Entschuldigen Sie sich und nennen Sie den Grund.
      – Schlagen Sie einen neuen Termin vor.
      – Bitten Sie um eine Bestätigung.
      Schreiben Sie ungefähr 40 Wörter. Vergessen Sie Anrede und Gruß nicht.
    task_ru: |
      В среду в 15 часов у вас встреча с вашей консультанткой в банке, госпожой Ланге. К сожалению, вы не можете прийти, потому что должны работать. Напишите госпоже Ланге письмо: извинитесь и назовите причину; предложите новое время; попросите подтвердить встречу.
      Около 40 слов. Не забудьте обращение и подпись.
    points:
      - Entschuldigung und Grund
      - Neuer Terminvorschlag
      - Bitte um Bestätigung
    words: [40, 50]
    structure:
      - Обращение (Sehr geehrte Frau Lange, — полуофициальный стиль, на «Sie»)
      - "Пункт 1: извинение и причина (Es tut mir leid … weil ich arbeiten muss)"
      - "Пункт 2: предложение нового времени (Könnten wir uns … treffen?)"
      - "Пункт 3: просьба подтвердить (Bitte bestätigen Sie …)"
      - Благодарность и прощание (Vielen Dank … / Mit freundlichen Grüßen)
      - Подпись (имя и фамилия)
    redemittel:
      - de: Sehr geehrte Frau Lange,
        ru: Уважаемая госпожа Ланге, (обращение)
      - de: Leider kann ich am … nicht kommen.
        ru: К сожалению, я не могу прийти в …
      - de: Es tut mir leid, aber ich muss arbeiten.
        ru: Мне жаль, но я должен(на) работать.
      - de: Ich muss den Termin leider absagen.
        ru: К сожалению, мне придётся отменить встречу.
      - de: Könnten wir den Termin verschieben?
        ru: Не могли бы мы перенести встречу?
      - de: Wie wäre es mit Freitag um 10 Uhr?
        ru: Как насчёт пятницы в 10 часов?
      - de: Am … hätte ich Zeit.
        ru: В … у меня было бы время.
      - de: Passt Ihnen das?
        ru: Вам это подходит?
      - de: Bitte bestätigen Sie mir den neuen Termin.
        ru: Пожалуйста, подтвердите мне новое время.
      - de: Vielen Dank für Ihr Verständnis.
        ru: Спасибо за понимание.
      - de: Mit freundlichen Grüßen
        ru: С уважением (в конце письма)
    model: |
      Sehr geehrte Frau Lange,

      leider kann ich am Mittwoch um 15 Uhr nicht kommen, weil ich arbeiten muss. Es tut mir leid. Könnten wir uns am Freitag um 10 Uhr treffen? Bitte bestätigen Sie mir den neuen Termin kurz per E-Mail. Vielen Dank für Ihr Verständnis.

      Mit freundlichen Grüßen
      Olga Marek
    checklist:
      - Все три пункта задания раскрыты (извинение и причина, новое время, просьба подтвердить)?
      - Есть обращение, прощание и подпись в одном стиле (Sehr geehrte … → Mit freundlichen Grüßen)?
      - "Вежливые формы: Könnten wir …? Bitte bestätigen Sie …?"
      - Придаточное с weil — глагол в конце (…, weil ich arbeiten muss)?
      - Вежливое Sie и Ihr пишутся с большой буквы?
      - Объём около 40–50 слов?

speaking:
  - id: ff-sp-1
    exam: Goethe A2 · Sprechen Teil 1
    task: "Fragen stellen und beantworten. Thema: Arbeit"
    task_ru: Вы вытягиваете карточку с ключевым словом по теме «Arbeit». Задайте партнёру вопрос с этим словом. Потом ответьте на вопрос партнёра. На экзамене слова на карточках, здесь — список.
    prompts: [Arbeitszeit, Kollegen, Mittagspause, Weg zur Arbeit, Gehalt, Urlaub]
    model: |
      Arbeitszeit: Wann beginnt deine Arbeit? – Um acht Uhr, aber freitags schon um sieben.
      Kollegen: Wie sind deine Kollegen? – Sehr nett. Wir essen oft zusammen in der Kantine.
      Mittagspause: Wie lange dauert deine Mittagspause? – Eine halbe Stunde.
      Weg zur Arbeit: Wie kommst du zur Arbeit? – Mit der S-Bahn, das dauert 25 Minuten.
      Gehalt: Bist du mit deinem Gehalt zufrieden? – Es geht. Ich würde gern etwas mehr verdienen.
      Urlaub: Wie viele Urlaubstage hast du? – Dreißig, aber ich habe noch zehn übrig.
  - id: ff-sp-2
    exam: Goethe A2 · Sprechen Teil 2
    task: Über sich sprechen. Thema Arbeit und Ausbildung
    task_ru: Расскажите о своей работе, учёбе или о работе, которую вы хотели бы найти. Опирайтесь на ключевые слова. Потом ответьте на вопрос партнёра.
    prompts: ["Beruf oder Ausbildung?", "Wo?", "Arbeitszeit?", "Aufgaben?", "Kollegen?", "Was gefällt Ihnen?", "Wunsch für die Zukunft?"]
    model: |
      Ich bin Bürokauffrau von Beruf. In Kiew habe ich in einer Versicherung gearbeitet. Jetzt suche ich eine Stelle in Frankfurt. Ich würde gern in Teilzeit arbeiten, von acht bis dreizehn Uhr, weil mein Sohn nachmittags nicht in der Schule ist. Zu meinen Aufgaben gehörten E-Mails, Telefonate und Termine. Die Arbeit mit Kunden hat mir immer gefallen. Ich konnte schon damals ein bisschen Deutsch, aber ich musste oft Englisch sprechen. Im Moment lerne ich jeden Tag Deutsch. Mein Wunsch ist eine feste Stelle in einem Büro mit netten Kollegen.
      Frage des Partners: Welche Arbeitszeit hätten Sie gern? – Ich hätte gern Teilzeit.
  - id: ff-sp-3
    exam: Goethe A2 · Sprechen Teil 3
    task: Gemeinsam einen Termin finden
    task_ru: Вместе с партнёром найдите время для встречи. Вы хотите вместе сходить в банк и открыть счёт. Обсудите, когда, где встретиться и что взять с собой. У каждого из вас разные дела на этой неделе. Предлагайте, реагируйте, соглашайтесь или вежливо отказывайтесь.
    prompts: ["Wann?", "Wo treffen?", "Wie lange?", "Welche Unterlagen?", "Danach etwas essen?"]
    model: |
      A: Wann hättest du Zeit, damit wir zusammen zur Bank gehen? Wie wäre es mit Dienstag?
      B: Am Dienstag muss ich bis 16 Uhr arbeiten. Am Mittwochvormittag hätte ich Zeit. Passt dir das?
      A: Mittwoch ist gut. Wir könnten uns um zehn Uhr vor der Filiale treffen.
      B: Einverstanden. Was müssen wir mitbringen?
      A: Den Reisepass, die Meldebescheinigung und den Arbeitsvertrag.
      B: Gut. Wenn wir früh fertig sind, könnten wir danach einen Kaffee trinken.
      A: Gern! Dann bis Mittwoch um zehn.

test:
  - type: choice
    q: Ich weiß nicht, ___ die Bank heute offen ist.
    ru: Я не знаю, открыт ли сегодня банк.
    options: [ob, dass, wenn]
    answer: ob
    why: Вопрос без вопросительного слова → ob.
  - type: gap
    q: Wenn ich Zeit ___, rufe ich dich an. (haben)
    ru: Если у меня будет время, я тебе позвоню.
    answer: [habe]
    why: В конце придаточного, ich → habe.
  - type: order
    answer: Wenn du willst, können wir uns um zehn treffen.
    tokens: [Wenn, du, "willst,", können, wir, uns, um zehn, treffen]
    ru: Если хочешь, мы можем встретиться в десять.
  - type: choice
    q: Der Laptop gehört ___ Chefin.
    ru: Ноутбук принадлежит начальнице.
    options: [der, die, dem]
    answer: der
    why: gehören + Dat.; die Chefin → der Chefin.
  - type: order
    answer: Ich schicke sie dir morgen.
    tokens: [Ich, schicke, sie, dir, morgen]
    ru: Я пришлю её тебе завтра.
  - type: choice
    q: Gestern ___ ich lange arbeiten.
    ru: Вчера мне пришлось долго работать.
    options: [musste, müsste, muss]
    answer: musste
    why: Präteritum от müssen — musste, без умлаута.
  - type: gap
    q: Wir ___ gern früher anfangen, aber der Chef war nicht da. (wollen)
    ru: Мы хотели начать раньше, но начальника не было.
    answer: [wollten]
    why: wir → wollten.
  - type: choice
    q: Welche Frage ist am Telefon höflicher?
    ru: Какой вопрос по телефону вежливее?
    options:
      - "Können Sie das wiederholen?"
      - "Könnten Sie das bitte wiederholen?"
      - "Wiederholen Sie das!"
    answer: "Könnten Sie das bitte wiederholen?"
    why: Konjunktiv II + bitte.
  - type: gap
    q: "Ich ___ gern einen Termin für Dienstag. (haben, höflich)"
    ru: Мне бы хотелось получить встречу на вторник.
    answer: [hätte]
    why: Ich hätte gern … — вежливое желание.
  - type: gap
    q: In Österreich sagt man „Meldezettel“, in Deutschland „___“.
    ru: В Австрии говорят «Meldezettel», в Германии — «…» (справка о регистрации).
    answer: [Meldebescheinigung]
  - type: choice
    q: Wie heißt in Österreich der Geldautomat?
    ru: Как в Австрии называют банкомат?
    options: [der Bankomat, der Bankberater, der Bankschalter]
    answer: der Bankomat
  - type: table
    title: Präteritum — können
    head: [Person, können]
    rows:
      - [ich, "?konnte"]
      - [du, "?konntest"]
      - [er / sie / es, "?konnte"]
      - [wir, "?konnten"]
