  # ------------------------------------------------------------------
  - id: ff-g-modal-praet
    title: Modalverben im Präteritum und wurde
    title_ru: Модальные глаголы в Präteritum и форма wurde
    terms:
      - t: Präteritum
        ru: простое прошедшее время (konnte, musste, war, hatte)
      - t: Präsens
        ru: настоящее время (kann, muss)
      - t: Modalverb
        ru: модальный глагол (können, müssen, wollen, dürfen, sollen); выражает возможность, необходимость, желание, разрешение
      - t: Infinitiv
        ru: начальная форма глагола; после модального стоит в конце предложения
      - t: Umlaut
        ru: ä, ö, ü; в Präteritum модальных глаголов умлаута нет
      - t: Perfekt
        ru: составное прошедшее; в разговоре им говорят о прошлом, но для модальных чаще Präteritum
      - t: werden
        ru: глагол «становиться»; Präteritum — wurde
      - t: Nebensatz
        ru: придаточное предложение; спрягаемый глагол в конце
    meaning: |
      О прошлом в разговоре чаще всего говорят в Perfekt: Ich habe gestern gearbeitet. Но модальные глаголы, а также sein и haben, обычно ставят в Präteritum: Ich konnte nicht kommen. Ich musste arbeiten. Ich war krank.
      Основа Präteritum: können → konnte, müssen → musste, wollen → wollte, dürfen → durfte, sollen → sollte. Умлаут пропадает (können → konnte, dürfen → durfte, müssen → musste).
      Окончания: ich -, du -st, er/sie/es - (без окончания!), wir -en, ihr -t, sie/Sie -en. Формы ich и er/sie/es совпадают: ich konnte, er konnte.
      Основной глагол стоит в инфинитиве в конце: Gestern musste ich lange arbeiten. В придаточном модальный глагол идёт в самый конец: Ich war nicht da, weil ich arbeiten musste.
      werden в Präteritum — wurde: Er wurde krank. Sie wurde Ärztin. Ich wurde nervös. Формы такие же, как у модальных: ich wurde, du wurdest, wir wurden.
    steps:
      - de: Gestern konnte ich nicht kommen.
        ru: können → konnte. Инфинитив kommen — в конце.
      - de: Ich musste bis acht Uhr arbeiten.
        ru: müssen → musste (ä пропал).
      - de: Wir wollten früh anfangen, aber der Chef war nicht da.
        ru: wollen → wollte, wir → wollten.
      - de: Als Kind durfte ich nicht lange fernsehen.
        ru: dürfen → durfte (ü пропал).
      - de: Du solltest den Vertrag eigentlich schon gestern unterschreiben.
        ru: sollen → solltest, du → -st.
      - de: Er hat nicht angerufen, weil er arbeiten musste.
        ru: В придаточном musste — в самом конце.
      - de: Nach dem Praktikum wurde Daniel Angestellter.
        ru: werden → wurde. «Стал сотрудником».
    table:
      head: [Person, können, müssen, wollen, dürfen, sollen, werden]
      rows:
        - [ich, konnte, musste, wollte, durfte, sollte, wurde]
        - [du, konntest, musstest, wolltest, durftest, solltest, wurdest]
        - [er / sie / es, konnte, musste, wollte, durfte, sollte, wurde]
        - [wir, konnten, mussten, wollten, durften, sollten, wurden]
        - [ihr, konntet, musstet, wolltet, durftet, solltet, wurdet]
        - [sie / Sie, konnten, mussten, wollten, durften, sollten, wurden]
    exam: |
      В письме и в устной части A2 нужно уметь объяснить, почему вы что-то не сделали или не пришли: Leider konnte ich nicht kommen, ich musste arbeiten. Entschuldigung, ich wollte Sie anrufen, aber …
      Эти формы нужны, чтобы вежливо извиниться в письме и рассказать о прошлом в разговоре. В Lesen и Hören они встречаются в сообщениях и рассказах: Er wollte … / Sie musste …
    traps:
      - "ich konnte, er konnte — без окончания в 1-м и 3-м лице: не «er konntet», не «er konnten»."
      - "Нет умлаута: ich konnte, ich musste, ich durfte (не «könnte», «müsste» — это уже другая форма, Konjunktiv II)."
      - "Основной глагол — в инфинитиве: Ich musste gestern arbeiten (не «gearbeitet»)."
      - "wollte (хотел) и wurde (стал) — разные глаголы: Er wollte Arzt werden, aber er wurde Lehrer."
      - "durfte = мне разрешали / можно было; musste nicht ≠ durfte nicht: Ich musste nicht kommen — «мне не нужно было приходить»; Ich durfte nicht kommen — «мне нельзя было приходить»."
      - "В придаточном модальный глагол стоит последним: …, weil ich arbeiten musste."
    exercises:
      - type: choice
        q: Gestern ___ ich nicht kommen, ich war krank.
        ru: Вчера я не мог прийти, я болел(а).
        options: [konnte, könnte, kann]
        answer: konnte
        why: "Прошедшее время: ich konnte — без умлаута."
      - type: choice
        q: Wir ___ lange auf den Bus warten.
        ru: Нам пришлось долго ждать автобус.
        options: [mussten, müssten, musste]
        answer: mussten
        why: wir → mussten.
      - type: choice
        q: Als Kind ___ ich keine Cola trinken.
        ru: В детстве мне нельзя было пить колу.
        options: [durfte, durftest, durften]
        answer: durfte
        why: ich → durfte.
      - type: choice
        q: Er ___ Mechaniker werden, aber er wurde Programmierer.
        ru: Он хотел стать механиком, но стал программистом.
        options: [wollte, wollten, wollt]
        answer: wollte
        why: er → wollte, без окончания.
      - type: choice
        q: Nach der Ausbildung ___ sie Krankenpflegerin.
        ru: После обучения она стала медсестрой.
        options: [wurde, wurden, wird]
        answer: wurde
        why: sie (она) → wurde.
      - type: gap
        q: Du ___ den Antrag schon gestern abgeben. (sollen)
        ru: Тебе следовало сдать заявление ещё вчера.
        answer: [solltest]
        why: du → -st.
      - type: gap
        q: Warum ___ ihr nicht kommen? (können)
        ru: Почему вы не смогли прийти?
        answer: [konntet]
        why: ihr → -t.
      - type: gap
        q: Ich rief nicht an, weil ich arbeiten ___. (müssen)
        ru: Я не позвонил(а), потому что мне нужно было работать.
        answer: [musste]
        why: Модальный глагол в конце придаточного, ich → musste.
      - type: gap
        q: Am Montag ___ wir nicht ins Büro gehen, es war ein Feiertag. (müssen)
        ru: В понедельник нам не нужно было идти в офис, был праздник.
        answer: [mussten]
        why: wir → mussten; musste nicht = «не нужно было».
      - type: gap
        q: Tut mir leid, ich ___ Sie gestern anrufen, aber ich hatte keine Zeit. (wollen)
        ru: Извините, я хотел(а) вчера вам позвонить, но не было времени.
        answer: [wollte]
        why: ich → wollte.
      - type: order
        answer: Ich konnte gestern nicht kommen.
        tokens: [Ich, konnte, gestern, nicht, kommen]
        ru: Вчера я не смог прийти.
      - type: order
        answer: Gestern musste ich lange arbeiten.
        tokens: [Gestern, musste, ich, lange, arbeiten]
        ru: Вчера мне пришлось долго работать.
        also: [Ich musste gestern lange arbeiten.]
      - type: order
        answer: Er war nicht da, weil er arbeiten musste.
        tokens: [Er, war, nicht, "da,", weil, er, arbeiten, musste]
        ru: Его не было, потому что ему нужно было работать.
      - type: table
        title: müssen — Präteritum
        head: [Person, müssen]
        rows:
          - [ich, "?musste"]
          - [du, "?musstest"]
          - [er / sie / es, "?musste"]
          - [wir, "?mussten"]
          - [ihr, "?musstet"]
          - [sie / Sie, "?mussten"]
      - type: table
        title: wollen und dürfen — Präteritum
        head: [Person, wollen, dürfen]
        rows:
          - [ich, "?wollte", "?durfte"]
          - [du, "?wolltest", "?durftest"]
          - [wir, "?wollten", "?durften"]

