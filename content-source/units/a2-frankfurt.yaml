id: a2-frankfurt
level: A2
city: Frankfurt
country: DE
title: Arbeit, Bank & Termine
title_ru: Работа, банк и встречи
intro: |
  Вы приезжаете во Франкфурт — город банков и офисов. Здесь нужно найти работу или стажировку, открыть счёт, получить письмо с почты и договориться о встрече по телефону.
  В юните: профессии и рабочий день, объявления о вакансиях, банк и почта, телефонные разговоры, письма и электронные сообщения.
  Грамматика: придаточные с dass, ob и wenn, глаголы с дательным падежом, Präteritum модальных глаголов и вежливые формы с würde, könnte, hätte, wäre.

grammar:
  # ------------------------------------------------------------------
  - id: ff-g-dass-ob
    title: Nebensätze mit dass und ob, indirekte Fragen
    title_ru: Придаточные с dass и ob, косвенные вопросы
    terms:
      - t: Hauptsatz
        ru: главное предложение; в нём спрягаемый глагол на 2-м месте
      - t: Nebensatz
        ru: придаточное предложение; оно начинается с союза, спрягаемый глагол стоит в конце
      - t: Konjunktion
        ru: союз (dass, ob, weil, wenn)
      - t: dass
        ru: союз «что»; вводит придаточное после ich weiß, ich glaube, ich hoffe, ich finde
      - t: ob
        ru: союз «ли»; вводит косвенный вопрос без вопросительного слова
      - t: W-Frage
        ru: вопрос с вопросительным словом (wann, wo, was, wie, warum, wer)
      - t: Ja/Nein-Frage
        ru: вопрос без вопросительного слова, на него отвечают «да» или «нет»
      - t: indirekte Frage
        ru: косвенный вопрос внутри другого предложения (Ich weiß nicht, wann …)
      - t: Satzende
        ru: конец предложения; в придаточном здесь стоит спрягаемая часть глагола
      - t: Partizip II
        ru: причастие прошедшего времени (gespeichert, angerufen)
      - t: Perfekt
        ru: составное прошедшее время (ich habe gespeichert)
      - t: Modalverb
        ru: модальный глагол (können, müssen, wollen, dürfen, sollen)
      - t: Infinitiv
        ru: начальная форма глагола
      - t: trennbares Verb
        ru: глагол с отделяемой приставкой (an·rufen, ab·sagen)
    meaning: |
      Придаточное предложение даёт дополнительную информацию к главному. Перед ним всегда стоит запятая, а спрягаемый глагол уходит в самый конец: Ich glaube, dass der Chef heute im Büro ist.
      dass — «что»: после глаголов мысли и речи (wissen, glauben, denken, sagen, hoffen, meinen) и в конструкциях вроде Es ist wichtig, dass … / Ich freue mich, dass …
      Косвенный вопрос — это вопрос, вставленный в предложение. Если в вопросе было вопросительное слово, оно остаётся союзом: Wann beginnt die Besprechung? → Ich weiß nicht, wann die Besprechung beginnt.
      Если вопроса с вопросительным словом не было (Ja/Nein-Frage), ставим ob: Ist die Bank offen? → Ich weiß nicht, ob die Bank offen ist.
      Отделяемая приставка в придаточном не отделяется: Er ruft an → …, dass er anruft. Составные формы стоят в конце: …, dass ich den Termin bestätigt habe; …, dass sie morgen nicht kommen kann (спрягаемый глагол — самый последний).
    steps:
      - de: Ich glaube, dass die Filiale heute geschlossen ist.
        ru: "Главное: Ich glaube. Запятая, затем dass, глагол ist — в конце."
      - de: Meine Kollegin sagt, dass der Drucker nicht funktioniert.
        ru: dass → глагол funktioniert уходит в конец.
      - de: Wann beginnt die Besprechung? → Ich weiß nicht, wann die Besprechung beginnt.
        ru: Вопросительное слово wann становится союзом, глагол — в конец.
      - de: Ist der Vertrag schon fertig? → Können Sie mir sagen, ob der Vertrag schon fertig ist?
        ru: Вопроса с вопросительным словом нет — ставим ob.
      - de: Er hofft, dass sie ihn morgen anruft.
        ru: Приставка an присоединяется к глаголу — anruft.
      - de: Ich weiß nicht, ob ich die Datei gespeichert habe.
        ru: "Perfekt в придаточном: Partizip II + habe, спрягаемый глагол habe — самый последний."
      - de: Ich möchte wissen, ob ich morgen kommen kann.
        ru: "Модальный глагол: kommen kann — спрягаемая форма kann в самом конце."
    table:
      head: [Прямой вопрос, Косвенный вопрос]
      rows:
        - ["Wann ist die Besprechung?", "Ich weiß nicht, wann die Besprechung ist."]
        - ["Wo ist der Drucker?", "Können Sie mir sagen, wo der Drucker ist?"]
        - ["Was kostet das Konto?", "Ich frage, was das Konto kostet."]
        - ["Ist die Bank heute offen?", "Ich weiß nicht, ob die Bank heute offen ist."]
        - ["Kann ich online zahlen?", "Wissen Sie, ob ich online zahlen kann?"]
        - ["Hast du den Termin bestätigt?", "Sie fragt, ob du den Termin bestätigt hast."]
    exam: |
      В Schreiben и Sprechen на уровне A2 ждут простых придаточных: Ich schreibe Ihnen, dass …; Ich möchte wissen, ob …; Können Sie mir sagen, wann …?
      Это полезно в письме в банк или работодателю и в телефонном разговоре, когда нужно вежливо что-то уточнить. Ошибка с порядком слов в придаточном — очень частая в письменных работах.
      В Lesen и Hören конструкции с dass и ob встречаются в письмах и сообщениях на автоответчике: Wir teilen Ihnen mit, dass …
    traps:
      - "Глагол в конце, а не на втором месте: Ich weiß, dass er morgen kommt (не «dass er kommt morgen»)."
      - "Запятая перед dass, ob и вопросительным словом обязательна: Ich weiß nicht, ob er kommt."
      - "dass (союз «что») пишется с двумя s. das — артикль или указательное слово: Das ist der Chef. Ich glaube, dass das stimmt."
      - "ob — «ли», wenn — «если, когда». Не путайте: Ich weiß nicht, ob er kommt. — Wenn er kommt, rufe ich dich an."
      - "После ob и вопросительного слова нет второго вопросительного слова: «Wissen Sie, ob wann …» — неверно."
      - "Отделяемый глагол в придаточном пишется слитно: …, dass er die Datei herunterlädt (не «lädt herunter»)."
    exercises:
      - type: choice
        q: Ich glaube, ___ die Bank heute früher schließt.
        ru: Я думаю, что банк сегодня закрывается раньше.
        options: [dass, ob, das]
        answer: dass
        why: Глагол мысли + «что» → dass. das — артикль.
      - type: choice
        q: Ich weiß nicht, ___ der Chef schon da ist.
        ru: Я не знаю, на месте ли уже начальник.
        options: [ob, dass, wenn]
        answer: ob
        why: Вопрос без вопросительного слова → ob.
      - type: choice
        q: Können Sie mir sagen, ___ ich meine Unterlagen abgeben kann?
        ru: Можете сказать, где я могу сдать свои документы?
        options: [wo, ob, dass]
        answer: wo
        why: "Прямой вопрос был бы «Wo kann ich …?» — вопросительное слово сохраняется."
      - type: choice
        q: Welcher Satz ist richtig?
        ru: Какое предложение правильное?
        options:
          - "Ich hoffe, dass du morgen Zeit hast."
          - "Ich hoffe, dass du hast morgen Zeit."
          - "Ich hoffe, dass hast du morgen Zeit."
        answer: "Ich hoffe, dass du morgen Zeit hast."
        why: В придаточном спрягаемый глагол стоит в конце.
      - type: choice
        q: Welcher Satz ist richtig?
        ru: Какое предложение правильное?
        options:
          - "Sie sagt, dass sie später anruft."
          - "Sie sagt, dass sie später ruft an."
          - "Sie sagt, dass sie ruft später an."
        answer: "Sie sagt, dass sie später anruft."
        why: В придаточном отделяемая приставка присоединяется к глаголу.
      - type: gap
        q: Wissen Sie, ___ die Sprechstunde beginnt?
        ru: Вы не знаете, когда начинаются приёмные часы?
        answer: [wann]
        why: Прямой вопрос «Wann beginnt die Sprechstunde?» — союзом остаётся wann.
      - type: gap
        q: Ich möchte wissen, ___ ich ein Konto online eröffnen kann.
        ru: Я хотел бы знать, можно ли открыть счёт онлайн.
        answer: [ob]
        why: Вопрос «Kann ich …?» без вопросительного слова → ob.
      - type: gap
        q: Die Kundin glaubt, dass der Preis zu hoch ___. (sein)
        ru: Клиентка считает, что цена слишком высокая.
        answer: [ist]
        why: Глагол в конце придаточного, форма er/sie/es — ist.
      - type: gap
        q: Ich schreibe Ihnen, dass ich den Termin leider ___ muss. (absagen)
        ru: Пишу вам, что, к сожалению, должен отменить встречу.
        answer: [absagen]
        why: Модальный глагол muss стоит в конце, absagen — перед ним в инфинитиве.
      - type: gap
        q: Weißt du, wo Frau Krämer ___? (arbeiten)
        ru: Ты знаешь, где работает госпожа Кремер?
        answer: [arbeitet]
        why: Глагол в конце придаточного, форма 3-го лица.
      - type: order
        answer: Ich weiß nicht, ob die Post noch offen ist.
        tokens: [Ich, weiß, "nicht,", ob, die Post, noch, offen, ist]
        ru: Я не знаю, открыта ли ещё почта.
      - type: order
        answer: Er sagt, dass der Kopierer kaputt ist.
        tokens: [Er, "sagt,", dass, der Kopierer, kaputt, ist]
        ru: Он говорит, что копир сломан.
      - type: order
        answer: Können Sie mir sagen, wann der Termin beginnt?
        tokens: [Können, Sie, mir, "sagen,", wann, der Termin, beginnt]
        ru: Можете мне сказать, когда начинается встреча?
      - type: order
        answer: Sie fragt, ob ich die Datei gespeichert habe.
        tokens: [Sie, "fragt,", ob, ich, die Datei, gespeichert, habe]
        ru: Она спрашивает, сохранил(а) ли я файл.
      - type: table
        title: Прямой вопрос → косвенный (начало после «Ich weiß nicht, …»)
        head: [Прямой вопрос, Союз в косвенном вопросе]
        rows:
          - ["Wann kommt der Bus?", "?wann"]
          - ["Ist das Paket schon da?", "?ob"]
          - ["Wo wohnt Herr Aydın?", "?wo"]
          - ["Hat sie Zeit?", "?ob"]
          - ["Wie viel kostet das?", "?wie viel"]

  # ------------------------------------------------------------------
  - id: ff-g-wenn
    title: Nebensatz mit wenn
    title_ru: Придаточное с wenn
    terms:
      - t: wenn
        ru: "союз «если» (условие) и «когда» (повторяющееся действие: каждый раз, всегда)"
      - t: Bedingung
        ru: условие; что должно случиться, чтобы произошло другое
      - t: Nebensatz
        ru: придаточное предложение; спрягаемый глагол стоит в конце
      - t: Hauptsatz
        ru: главное предложение
      - t: Position 1 / Position 2
        ru: первое и второе место в предложении; в главном предложении глагол стоит на 2-м месте
      - t: Verb-Verb
        ru: "порядок, когда придаточное стоит перед главным: две спрягаемые формы подряд — … ist, ruft …"
      - t: Komma
        ru: запятая; ставится между придаточным и главным предложением
      - t: Infinitiv
        ru: начальная форма глагола
      - t: Perfekt
        ru: составное прошедшее время (ich habe ausgefüllt)
    meaning: |
      wenn вводит придаточное с условием («если») или с действием, которое происходит каждый раз («когда, всякий раз, как»): Wenn ich Zeit habe, gehe ich ins Fitnessstudio.
      Спрягаемый глагол стоит в конце придаточного, как после dass: …, wenn ich Zeit habe.
      Придаточное можно поставить после главного предложения: Ich rufe dich an, wenn ich Zeit habe.
      Или перед ним: Wenn ich Zeit habe, rufe ich dich an. Тогда всё придаточное занимает первое место, поэтому в главном предложении сразу идёт глагол (второе место). В итоге два глагола стоят рядом, через запятую: habe, rufe. Это порядок Verb-Verb.
      Подлежащее главного предложения идёт после глагола: …, rufe ich dich an.
      Один раз в прошлом («когда я пришёл…») говорят als, а не wenn — это тема следующих уровней. А в вопросе «когда?» всегда wann.
    steps:
      - de: Ich rufe Sie an, wenn ich die Unterlagen habe.
        ru: Главное предложение первым. Глагол habe — в конце придаточного.
      - de: Wenn ich die Unterlagen habe, rufe ich Sie an.
        ru: Придаточное первым → в главном сразу глагол rufe, потом подлежащее ich.
      - de: Wenn der Drucker kaputt ist, ruft Frau Berg den Techniker.
        ru: ist … ruft — два глагола рядом (Verb-Verb).
      - de: Wenn Sie Fragen haben, melden Sie sich bitte.
        ru: Условие «если у вас есть вопросы».
      - de: Wenn ich Spätschicht habe, schlafe ich lange.
        ru: «Когда» в значении «каждый раз, когда».
      - de: Wir können den Termin verschieben, wenn Sie am Montag keine Zeit haben.
        ru: Придаточное с wenn может стоять и в конце.
      - de: Wenn du das Formular ausgefüllt hast, gibst du es am Schalter ab.
        ru: "Perfekt в придаточном: ausgefüllt hast — hast в самом конце."
    table:
      head: [Hauptsatz zuerst, Nebensatz zuerst]
      rows:
        - ["Ich bleibe zu Hause, wenn ich krank bin.", "Wenn ich krank bin, bleibe ich zu Hause."]
        - ["Sie ruft an, wenn sie Zeit hat.", "Wenn sie Zeit hat, ruft sie an."]
        - ["Wir fangen an, wenn alle da sind.", "Wenn alle da sind, fangen wir an."]
        - ["Du bekommst die Zusage, wenn du die Probezeit schaffst.", "Wenn du die Probezeit schaffst, bekommst du die Zusage."]
    exam: |
      В Schreiben A2 просят предложить варианты и поставить условия: Wenn Sie am Dienstag keine Zeit haben, können wir uns auch am Mittwoch treffen.
      В Sprechen Teil 3 (общий план) это удобный оборот: Wenn du willst, können wir …; Wenn es dir passt, treffen wir uns um zehn.
      В Lesen и Hören встречаются условия в правилах и объявлениях: Wenn Sie Fragen haben, rufen Sie uns an.
    traps:
      - "Если придаточное стоит первым, в главном предложении сразу идёт глагол: Wenn ich Zeit habe, rufe ich an (не «Wenn ich Zeit habe, ich rufe an»)."
      - "В конце придаточного стоит спрягаемый глагол: …, wenn ich Zeit habe (не «…, wenn ich habe Zeit»)."
      - "Запятая между придаточным и главным предложением обязательна."
      - "wenn ≠ wann: Wann kommst du? (вопрос) — Wenn ich Zeit habe. (условие)."
      - "wenn ≠ ob: Ich weiß nicht, ob er kommt. — Wenn er kommt, bin ich froh."
      - "В русском «если» и «когда» — разные слова, в немецком wenn покрывает оба значения: Wenn ich arbeite, bin ich müde. — Когда (всякий раз) / Если я работаю, я устаю."
    exercises:
      - type: choice
        q: ___ ich Zeit habe, rufe ich dich an.
        ru: Если у меня будет время, я тебе позвоню.
        options: [Wenn, Ob, Dass]
        answer: Wenn
        why: Условие → wenn.
      - type: choice
        q: Wenn es regnet, ___ mit dem Bus.
        ru: Когда идёт дождь, я езжу на автобусе.
        options: [fahre ich, ich fahre, fahre]
        answer: fahre ich
        why: После придаточного в главном предложении глагол на 2-м месте, потом подлежащее.
      - type: choice
        q: Welcher Satz ist richtig?
        ru: Какое предложение правильное?
        options:
          - "Wenn du Fragen hast, ruf mich an."
          - "Wenn du hast Fragen, ruf mich an."
          - "Wenn du Fragen hast, du rufst mich an."
        answer: "Wenn du Fragen hast, ruf mich an."
        why: Глагол hast — в конце придаточного. В главном — приказ ruf … an.
      - type: choice
        q: Welcher Satz ist richtig?
        ru: Какое предложение правильное?
        options:
          - "Wenn es regnet, bleiben wir im Büro."
          - "Wenn es regnet, wir bleiben im Büro."
          - "Wenn es regnet bleiben, wir im Büro."
        answer: "Wenn es regnet, bleiben wir im Büro."
        why: После придаточного глагол bleiben идёт сразу — Verb-Verb.
      - type: choice
        q: "___ kommst du morgen? – Wenn ich Zeit habe."
        ru: Когда ты придёшь завтра? — Если у меня будет время.
        options: [Wann, Wenn, Ob]
        answer: Wann
        why: В вопросе «когда?» — wann.
      - type: gap
        q: Wenn Herr Moser krank ist, ___ Frau Kurz die Besprechung. (leiten)
        ru: Если господин Мозер болен, совещание ведёт госпожа Курц.
        answer: [leitet]
        why: Главное предложение начинается с глагола leitet, потом подлежащее Frau Kurz.
      - type: gap
        q: Ich bringe die Dokumente mit, wenn ich morgen ___. (kommen)
        ru: Я принесу документы, если приду завтра.
        answer: [komme]
        why: Глагол в конце придаточного; ich → komme.
      - type: gap
        q: Wenn wir früh fertig sind, ___ wir zusammen in der Kantine. (essen)
        ru: Если мы закончим рано, пообедаем вместе.
        answer: [essen]
        why: wir → essen, сразу после запятой.
      - type: gap
        q: Wenn du den Antrag unterschrieben ___, schicke ich ihn ab. (haben)
        ru: Когда ты подпишешь заявление, я его отправлю.
        answer: [hast]
        why: du → hast, в конце придаточного.
      - type: order
        answer: Wenn ich Feierabend habe, gehe ich einkaufen.
        tokens: [Wenn, ich, Feierabend, "habe,", gehe, ich, einkaufen]
        ru: Когда у меня конец рабочего дня, я иду за покупками.
      - type: order
        answer: Ich rufe dich an, wenn der Zug ankommt.
        tokens: [Ich, rufe, dich, "an,", wenn, der Zug, ankommt]
        ru: Я позвоню тебе, когда поезд прибудет.
      - type: order
        answer: Wenn Sie keine Zeit haben, können wir den Termin verschieben.
        tokens: [Wenn, Sie, keine Zeit, "haben,", können, wir, den Termin, verschieben]
        ru: Если у вас нет времени, мы можем перенести встречу.
      - type: order
        answer: Wenn die Kundin kommt, sagst du mir Bescheid.
        tokens: [Wenn, die Kundin, "kommt,", sagst, du, mir, Bescheid]
        ru: Когда придёт клиентка, ты мне сообщишь.
      - type: table
        title: Нужная форма в конце придаточного с wenn
        head: [Придаточное, Глагол]
        rows:
          - [Wenn ich Zeit (haben) …, "?habe"]
          - [Wenn du müde (sein) …, "?bist"]
          - [Wenn er heute (kommen) …, "?kommt"]
          - [Wenn wir den Vertrag (bekommen) …, "?bekommen"]

  # ------------------------------------------------------------------
  - id: ff-g-dativ-verben
    title: Verben mit Dativ; Dativ und Akkusativ im Satz
    title_ru: Глаголы с дательным падежом; дательный и винительный в одном предложении
    terms:
      - t: Nominativ (Nom.)
        ru: именительный падеж — подлежащее (кто? что?)
      - t: Akkusativ (Akk.)
        ru: винительный падеж — прямое дополнение (кого? что?)
      - t: Dativ (Dat.)
        ru: дательный падеж — адресат, «кому?»
      - t: Dativobjekt
        ru: дополнение в дательном падеже (кому?)
      - t: Akkusativobjekt
        ru: дополнение в винительном падеже (что? кого?)
      - t: Personalpronomen
        ru: личное местоимение (mir, dir, ihm, ihr, uns, euch, ihnen, Ihnen)
      - t: Rektion
        ru: управление — какой падеж требует глагол или предлог
      - t: Artikel
        ru: артикль (der, die, das, dem, den)
      - t: Plural (Pl.)
        ru: множественное число
      - t: Wortstellung
        ru: порядок слов в предложении
    meaning: |
      Некоторые глаголы требуют дополнение только в дательном падеже (Dat.): helfen, gefallen, gehören, danken, antworten. Их нужно запомнить вместе с падежом: jemandem helfen — «помогать кому-то».
      Ich helfe meinem Kollegen. Das Büro gefällt mir. Der Laptop gehört der Firma. Ich danke Ihnen. Er antwortet dem Kunden.
      Другая группа глаголов берёт и Dat. (кому?), и Akk. (что?): geben, schicken, zeigen, erklären (также bringen, empfehlen, schenken). Ich schicke dem Kunden (Dat.) die Rechnung (Akk.).
      Порядок слов: если оба дополнения — существительные, то сначала Dat., потом Akk.: Ich zeige dem Kollegen den Laptop.
      Если одно из дополнений — местоимение, оно идёт первым: Ich zeige ihm den Laptop. Ich zeige ihn dem Kollegen.
      Если оба — местоимения, сначала Akk., потом Dat.: Ich zeige ihn ihm.
      Дательный падеж артиклей: der → dem, die → der, das → dem, во множественном числе den + -n у существительного (den Kollegen).
    steps:
      - de: Kannst du mir bitte helfen?
        ru: helfen + Dat. Местоимение ich → mir.
      - de: Die neue Stelle gefällt meiner Schwester.
        ru: gefallen + Dat. Die Schwester → der Schwester (meine → meiner).
      - de: Der Drucker gehört dem Chef.
        ru: gehören + Dat. Der Chef → dem Chef.
      - de: Ich danke Ihnen für Ihre Hilfe. Frau Meier antwortet dem Kunden.
        ru: danken и antworten тоже требуют Dat.
      - de: Ich schicke dem Kunden die Rechnung.
        ru: Два существительных — сначала Dat. (dem Kunden), потом Akk. (die Rechnung).
      - de: Ich schicke ihm die Rechnung. Ich schicke sie dem Kunden.
        ru: Местоимение (ihm / sie) стоит перед существительным.
      - de: Ich schicke sie ihm.
        ru: Два местоимения — сначала Akk. (sie), потом Dat. (ihm).
    table:
      head: ["Wer?", Nominativ, Dativ]
      rows:
        - [ich, ich, mir]
        - [du, du, dir]
        - [er, er, ihm]
        - [sie (она), sie, ihr]
        - [es, es, ihm]
        - [wir, wir, uns]
        - [ihr, ihr, euch]
        - [sie (они), sie, ihnen]
        - [Sie (вежливое), Sie, Ihnen]
        - [der Kunde, der Kunde, dem Kunden]
        - [die Kollegin, die Kollegin, der Kollegin]
        - [das Team, das Team, dem Team]
        - [die Kollegen, die Kollegen, den Kollegen]
    exam: |
      В Schreiben A2 нужны такие фразы: Ich danke Ihnen für die Einladung. Können Sie mir bitte die Adresse schicken? Könnten Sie mir das erklären?
      В Sprechen Teil 3 вы часто просите о помощи или что-то обещаете: Ich zeige dir das Programm. Ich schicke dir die Datei.
      Ошибки с mir/mich и dir/dich хорошо слышны; следите за падежом личных местоимений.
    traps:
      - "helfen, gefallen, gehören, danken, antworten — только Dativ: Ich helfe dir (не «dich»). Das gefällt mir (не «mich»)."
      - "В русском тоже «помогать кому?», но не все немецкие Dativ-глаголы совпадают с русскими. Учите глагол вместе с падежом."
      - "Местоимение идёт раньше существительного: Ich schicke ihm die Datei (не «Ich schicke die Datei ihm»). Ich schicke sie dem Kunden (не «Ich schicke dem Kunden sie»)."
      - "Два местоимения: Akk. перед Dat. — Ich gebe es dir (не «Ich gebe dir es»)."
      - "Множественное число в Dativ: артикль den и существительное на -n: den Kollegen, den Kunden, den Firmen. Слова с множественным на -s не меняются: den Chefs, den Büros."
      - "Ich antworte dem Chef, но Ich beantworte die E-Mail: beantworten берёт Akkusativ, antworten — Dativ."
    exercises:
      - type: choice
        q: Kannst du ___ bitte helfen?
        ru: Ты можешь мне помочь?
        options: [mir, mich, ich]
        answer: mir
        why: helfen + Dativ → mir.
      - type: choice
        q: Der Laptop gehört ___ Firma.
        ru: Ноутбук принадлежит фирме.
        options: [der, die, dem]
        answer: der
        why: gehören + Dat.; die Firma → der Firma.
      - type: choice
        q: Ich danke ___ für Ihre E-Mail.
        ru: Благодарю вас за ваше письмо.
        options: [Ihnen, Sie, Ihr]
        answer: Ihnen
        why: danken + Dat.; Sie → Ihnen (с большой буквы).
      - type: choice
        q: Der Chef antwortet ___ Kunden sofort.
        ru: Начальник сразу отвечает клиенту.
        options: [dem, den, der]
        answer: dem
        why: antworten + Dat.; der Kunde → dem Kunden.
      - type: choice
        q: Welcher Satz ist richtig?
        ru: Какое предложение правильное?
        options:
          - "Ich schicke dem Kunden die Rechnung."
          - "Ich schicke den Kunden der Rechnung."
          - "Ich schicke die Rechnung den Kunde."
        answer: "Ich schicke dem Kunden die Rechnung."
        why: Dat. (кому?) — dem Kunden, Akk. (что?) — die Rechnung.
      - type: choice
        q: Welcher Satz ist richtig?
        ru: Какое предложение правильное?
        options:
          - "Ich gebe es dir."
          - "Ich gebe dir es."
          - "Ich gebe dich es."
        answer: "Ich gebe es dir."
        why: Два местоимения — сначала Akk. (es), потом Dat. (dir).
      - type: gap
        q: Die Arbeit gefällt ___ sehr. (ich)
        ru: Мне очень нравится работа.
        answer: [mir]
        why: gefallen + Dat.
      - type: gap
        q: Wir zeigen ___ Kollegin das Büro. (die)
        ru: Мы показываем коллеге офис.
        answer: [der]
        why: die Kollegin в Dativ → der Kollegin.
      - type: gap
        q: Erklärst du ___ das Formular? (wir)
        ru: Ты объяснишь нам бланк?
        answer: [uns]
        why: wir → uns в Dativ.
      - type: gap
        q: Ich schicke ___ die Unterlagen morgen. (er)
        ru: Я пришлю ему документы завтра.
        answer: [ihm]
        why: er → ihm.
      - type: gap
        q: Die Bank schickt den Kunden die Karte. – Sie schickt ___ die Karte. (sie, Plural)
        ru: Банк присылает клиентам карту. — Он присылает им карту.
        answer: [ihnen]
        why: sie (Pl.) → ihnen.
      - type: order
        answer: Ich zeige dem Kollegen das Programm.
        tokens: [Ich, zeige, dem Kollegen, das Programm]
        ru: Я показываю коллеге программу.
      - type: order
        answer: Ich zeige es ihm.
        tokens: [Ich, zeige, es, ihm]
        ru: Я показываю это ему.
      - type: order
        answer: Kannst du mir die Adresse schicken?
        tokens: [Kannst, du, mir, die Adresse, schicken]
        ru: Ты можешь прислать мне адрес?
      - type: order
        answer: Die Chefin erklärt uns die Aufgabe.
        tokens: [Die Chefin, erklärt, uns, die Aufgabe]
        ru: Начальница объясняет нам задачу.
      - type: table
