  - id: ff-g-konjunktiv-hoeflich
    title: "Höfliche Bitten: würde, könnte, hätte gern, wäre"
    title_ru: "Вежливые просьбы и предложения: würde, könnte, hätte gern, wäre"
    terms:
      - t: Konjunktiv II
        ru: форма, которой выражают вежливую просьбу, пожелание, предложение (würde, könnte, hätte, wäre)
      - t: Bitte
        ru: просьба
      - t: Vorschlag
        ru: предложение
      - t: Wunsch
        ru: желание, пожелание
      - t: würde + Infinitiv
        ru: «бы» + инфинитив; вежливая замена многих глаголов (Würden Sie bitte warten?)
      - t: Infinitiv
        ru: начальная форма глагола; стоит в конце предложения
      - t: Satzklammer
        ru: рамка предложения — спрягаемая форма на своём месте, инфинитив в конце
      - t: höflich / unhöflich
        ru: вежливо / невежливо
    meaning: |
      Конъюнктив II — это форма, которая делает просьбу или предложение вежливее. Сравните: Können Sie mir helfen? — нейтрально; Könnten Sie mir bitte helfen? — вежливее.
      Для A2 нужны четыре формы: würde (+ инфинитив), könnte, hätte, wäre.
      Просьба: Könnten Sie mir bitte die Adresse schicken? / Würden Sie bitte kurz warten? Инфинитив стоит в конце.
      Пожелание: Ich hätte gern einen Termin. / Ich würde gern ein Konto eröffnen. Ich möchte … тоже вежливо.
      Предложение: Wir könnten uns um zehn treffen. / Wie wäre es mit Dienstag? / Es wäre gut, wenn Sie vorher anrufen.
      Невежливо: Ich will einen Termin. Gib mir die Adresse! Schick mir das! В официальной ситуации — на работе, в банке, по телефону — такие фразы звучат резко.
    steps:
      - de: Könnten Sie mir bitte die IBAN schicken?
        ru: Вежливая просьба с könnte. Инфинитив schicken — в конце.
      - de: Würden Sie bitte kurz warten?
        ru: würde + инфинитив warten.
      - de: Ich hätte gern einen Termin für nächste Woche.
        ru: hätte gern — вежливое «я бы хотел(а)».
      - de: Ich würde gern ein Konto eröffnen.
        ru: würde gern + инфинитив. Тоже вежливое желание.
      - de: Wir könnten uns am Mittwoch treffen.
        ru: "Предложение: «мы могли бы встретиться»."
      - de: Wie wäre es mit Donnerstag um zehn?
        ru: wäre — вежливое предложение времени.
      - de: Es wäre schön, wenn Sie mich zurückrufen könnten.
        ru: Es wäre … + wenn-Satz. Вежливая просьба в письме.
    table:
      head: [Person, sein → wäre, haben → hätte, können → könnte, werden → würde]
      rows:
        - [ich, wäre, hätte, könnte, würde]
        - [du, wärst, hättest, könntest, würdest]
        - [er / sie / es, wäre, hätte, könnte, würde]
        - [wir, wären, hätten, könnten, würden]
        - [ihr, wärt, hättet, könntet, würdet]
        - [sie / Sie, wären, hätten, könnten, würden]
    exam: |
      В Sprechen Teil 3 вы вместе планируете что-то и договариваетесь о времени: Wie wäre es mit Samstag? Wir könnten ins Kino gehen. Hättest du Zeit?
      В Schreiben A2 вы пишете вежливые письма — просите о встрече, переносите встречу: Ich hätte gern einen Termin. Könnten Sie mir bitte antworten?
      Вежливая форма делает письмо и разговор естественнее, а резкое Ich will в официальной ситуации звучит грубо.
    traps:
      - "Ich will einen Termin — звучит резко; лучше Ich hätte gern einen Termin / Ich möchte einen Termin."
      - "Инфинитив стоит в конце: Könnten Sie mir helfen? Würden Sie bitte warten?"
      - "würde обычно не ставят с haben, sein, können, wissen: говорят hätte, wäre, könnte, wüsste (не «würde haben», «würde sein»)."
      - "hätte gern + существительное: Ich hätte gern einen Kaffee. Если нужен глагол, берут würde gern + инфинитив: Ich würde gern bezahlen."
      - "könnte ≠ konnte: könnte — вежливо/предположительно; konnte — прошедшее время."
      - "На «Sie» говорят Könnten Sie …?, на «du» — Könntest du …?"
    exercises:
      - type: choice
        q: ___ Sie mir bitte helfen?
        ru: Не могли бы вы мне помочь?
        options: [Könnten, Konnten, Kann]
        answer: Könnten
        why: Вежливая просьба → könnten.
      - type: choice
        q: Ich ___ gern einen Termin am Montag.
        ru: Мне хотелось бы получить встречу в понедельник.
        options: [hätte, habe, wäre]
        answer: hätte
        why: "Вежливое желание: Ich hätte gern …"
      - type: choice
        q: Wie ___ es mit Donnerstag?
        ru: Как насчёт четверга?
        options: [wäre, wärst, wären]
        answer: wäre
        why: "Предложение: Wie wäre es mit …?"
      - type: choice
        q: ___ Sie bitte kurz warten?
        ru: Вы не могли бы немного подождать?
        options: [Würden, Wurden, Werden]
        answer: Würden
        why: würden + инфинитив warten.
      - type: choice
        q: Welche Formulierung ist höflicher?
        ru: Какая фраза вежливее?
        options:
          - "Ich will einen Termin."
          - "Ich hätte gern einen Termin."
          - "Gib mir einen Termin."
        answer: "Ich hätte gern einen Termin."
        why: Konjunktiv II делает просьбу вежливой.
      - type: choice
        q: Welche Formulierung ist falsch?
        ru: Какая фраза неверна?
        options:
          - "Würden Sie mir bitte helfen?"
          - "Könnten Sie mir bitte helfen?"
          - "Könnten Sie mir bitte helfen würden?"
        answer: "Könnten Sie mir bitte helfen würden?"
        why: После würde ставится один инфинитив, без können.
      - type: gap
        q: ___ du morgen Zeit? (haben, höflich)
        ru: У тебя нашлось бы завтра время?
        answer: [Hättest]
        why: "du → hättest; в начале предложения с большой буквы."
      - type: gap
        q: Wir ___ uns um zehn Uhr treffen. (können)
        ru: Мы могли бы встретиться в десять часов.
        answer: [könnten]
        why: wir → könnten.
      - type: gap
        q: Ich ___ gern ein Konto eröffnen. (werden)
        ru: Я бы хотел(а) открыть счёт.
        answer: [würde]
        why: ich → würde, потом gern и инфинитив.
      - type: gap
        q: Es ___ schön, wenn Sie mir bis Freitag antworten. (sein)
        ru: Было бы хорошо, если бы вы ответили мне до пятницы.
        answer: [wäre]
        why: es → wäre.
      - type: order
        answer: Könnten Sie mir bitte die Adresse schicken?
        tokens: [Könnten, Sie, mir, bitte, die Adresse, schicken]
        ru: Не могли бы вы прислать мне адрес?
      - type: order
        answer: Ich hätte gern einen Termin am Dienstag.
        tokens: [Ich, hätte, gern, einen Termin, am Dienstag]
        ru: Мне хотелось бы встречу во вторник.
      - type: order
        answer: Wie wäre es mit Mittwoch um zehn Uhr?
        tokens: [Wie, wäre, es, mit, Mittwoch, um, zehn Uhr]
        ru: Как насчёт среды в десять часов?
      - type: table
        title: Konjunktiv II — höfliche Formen
        head: [Person, haben → hätte, sein → wäre]
        rows:
          - [ich, "?hätte", "?wäre"]
          - [du, "?hättest", "?wärst"]
          - [er / sie / es, "?hätte", "?wäre"]
          - [wir, "?hätten", "?wären"]
          - [ihr, "?hättet", "?wärt"]

dialogues:
  # ------------------------------------------------------------------
  - id: ff-d-bank
    title: Ein Konto eröffnen
    title_ru: Открываем счёт в банке
    situation_ru: Вы пришли в отделение банка во Франкфурте, чтобы открыть текущий счёт. Вас зовут Анастасия Лебедева. Для открытия счёта нужен паспорт или удостоверение личности и справка о регистрации по месту жительства (в Германии — Meldebescheinigung; в Австрии вместо неё обычно просят Meldezettel или Meldebestätigung).
    partner: Bankberater Herr Yıldız
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Guten Tag! Willkommen bei der Mainbank. Was kann ich für Sie tun?
        ru: Добрый день! Добро пожаловать в «Майнбанк». Чем могу помочь?
        options:
          - t: Guten Tag! Ich würde gern ein Konto eröffnen.
            ru: Добрый день! Я хотела бы открыть счёт.
            next: n2
          - t: Guten Tag! Ich möchte ein Girokonto.
            ru: Добрый день! Мне нужен текущий счёт.
            next: n2
          - t: Ich will Konto. Schnell, bitte.
            ru: Я хочу счёт. Быстро, пожалуйста.
            next: n2
            ok: false
            fb: Слишком резко и без артикля. Вежливее — «Ich würde gern ein Konto eröffnen.» или «Ich möchte ein Girokonto.»
      n2:
        say: Gern. Dafür brauche ich Ihren Ausweis oder Reisepass und eine Meldebescheinigung. Haben Sie die Dokumente dabei?
        ru: Конечно. Для этого мне нужны ваше удостоверение или паспорт и справка о регистрации. Документы с собой?
        options:
          - t: Ja, hier sind mein Reisepass und meine Meldebescheinigung.
            ru: Да, вот мой паспорт и справка о регистрации.
            next: n3
          - t: Die Meldebescheinigung habe ich leider vergessen. Kann ich sie per E-Mail schicken?
            ru: Справку о регистрации я, к сожалению, забыла. Можно прислать её по электронной почте?
            next: n2b
          - t: Ja, ich habe die Dokumente mit. Nehmen Sie!
            ru: Да, документы со мной. Берите!
            next: n3
            ok: false
            fb: Приказ «Nehmen Sie!» звучит грубо. Лучше «Bitte schön.» или «Hier, bitte.»
      n2b:
        say: Ja, das geht. Schicken Sie die Bescheinigung bitte bis Freitag an diese Adresse. Dann kann ich schon alles vorbereiten.
        ru: Да, можно. Пришлите справку, пожалуйста, до пятницы на этот адрес. Тогда я уже всё подготовлю.
        options:
          - t: Vielen Dank, das mache ich gleich heute.
            ru: Большое спасибо, я сделаю это уже сегодня.
            next: n3
          - t: Gut. Wie lautet die E-Mail-Adresse, bitte?
            ru: Хорошо. Какой адрес электронной почты, пожалуйста?
            next: n3
      n3:
        say: Danke. Ich empfehle Ihnen unser Girokonto „Plus“ mit Kreditkarte. Es kostet 4,90 Euro im Monat.
        ru: Спасибо. Рекомендую наш текущий счёт «Плюс» с кредитной картой. Он стоит 4,90 евро в месяц.
        options:
          - t: Das klingt gut. Gibt es auch ein Konto ohne Gebühren?
            ru: Звучит хорошо. А есть ли счёт без комиссии?
            next: n4
          - t: Gut, das nehme ich.
            ru: Хорошо, я беру его.
            next: n5
          - t: Zu teuer! Das ist unverschämt.
            ru: Слишком дорого! Это нахальство.
            next: n4
            ok: false
            fb: Слишком резко. Вежливее — «Das ist leider ein bisschen teuer. Gibt es auch ein günstigeres Konto?»
      n4:
        say: Ja, das Konto „Basis“ ist kostenlos, wenn Ihr Gehalt monatlich auf das Konto kommt. Dann gibt es keine Gebühr.
        ru: Да, счёт «Базовый» бесплатный, если зарплата ежемесячно приходит на этот счёт. Тогда комиссии нет.
        options:
          - t: Das ist gut. Dann nehme ich das Konto „Basis“.
            ru: Это хорошо. Тогда я возьму счёт «Базовый».
            next: n5
          - t: Könnten Sie mir bitte erklären, was bei „Plus“ dabei ist?
            ru: Не могли бы вы объяснить, что входит в «Плюс»?
            next: n4b
          - t: Dann will ich das Kostenlose.
            ru: Тогда я хочу бесплатный.
            next: n5
            ok: false
            fb: «Ich will» звучит грубо. Скажите «Dann hätte ich gern das kostenlose Konto.» или «Dann nehme ich …»
      n4b:
        say: Bei „Plus“ bekommen Sie eine Kreditkarte, eine Reiseversicherung und kostenlose Abhebungen im Ausland.
        ru: В «Плюс» входят кредитная карта, туристическая страховка и бесплатное снятие наличных за границей.
        options:
          - t: Danke für die Erklärung. Ich nehme das Konto „Basis“.
            ru: Спасибо за объяснение. Я возьму счёт «Базовый».
            next: n5
          - t: Das ist interessant, aber ich brauche keine Kreditkarte. Dann bleibe ich bei „Basis“.
            ru: Интересно, но кредитная карта мне не нужна. Тогда остаюсь на «Базовом».
            next: n5
      n5:
        say: Gut. Sie bekommen eine Bankkarte und die Geheimzahl mit der Post. Möchten Sie auch Onlinebanking mit unserer App nutzen?
        ru: Хорошо. Банковскую карту и ПИН-код вы получите по почте. Хотите пользоваться ещё и онлайн-банкингом через наше приложение?
        options:
          - t: Ja, ich hätte gern Onlinebanking mit der App.
            ru: Да, я бы хотела онлайн-банкинг через приложение.
            next: n6
          - t: Nein, ich möchte lieber am Schalter überweisen.
            ru: Нет, я предпочитаю делать переводы в окошке.
            next: n6
          - t: Ich nicht wissen, was ist das.
            ru: Я не знать, что это.
            next: n6
            ok: false
            fb: Глагол должен быть изменён и стоять на месте. Правильно — «Ich weiß nicht, was das ist.» Ещё лучше — «Könnten Sie mir das bitte erklären?»
      n6:
        say: Dann brauche ich noch Ihre Unterschrift. Bitte füllen Sie dieses Formular aus und unterschreiben Sie unten. Haben Sie einen Stift?
        ru: Тогда мне нужна ещё ваша подпись. Заполните, пожалуйста, этот бланк и распишитесь внизу. У вас есть ручка?
        options:
          - t: Ja, danke. Wo soll ich unterschreiben?
            ru: Да, спасибо. Где мне расписаться?
            next: n7
          - t: Ich habe leider keinen Kugelschreiber. Könnten Sie mir einen leihen?
            ru: К сожалению, у меня нет ручки. Не могли бы вы одолжить мне одну?
            next: n7
          - t: Gib mir den Stift!
            ru: Дай мне ручку!
            next: n7
            ok: false
            fb: С сотрудником банка говорят на «Sie» и вежливо. Правильно — «Könnten Sie mir bitte einen Stift geben?»
      n7:
        say: Danke schön. Das war es schon. Haben Sie noch eine Frage?
        ru: Спасибо. На этом всё. У вас есть ещё вопрос?
        options:
          - t: Ja. Wann kann ich mit der Karte Geld abheben?
            ru: Да. Когда я смогу снимать деньги с картой?
            next: end
          - t: Nein, vielen Dank für Ihre Hilfe.
            ru: Нет, большое спасибо за вашу помощь.
            next: end
          - t: Ja, wo ist Automat?
            ru: Да, где банкомат?
            next: end
            ok: false
            fb: Нужен артикль и вежливая форма — «Entschuldigung, wo ist der Geldautomat?» (в Австрии — der Bankomat).
      end:
        say: Die Karte kommt in etwa einer Woche mit der Post. Dann können Sie am Geldautomaten Geld abheben. Einen schönen Tag noch!
        ru: Карта придёт по почте примерно через неделю. Тогда вы сможете снимать деньги в банкомате. Хорошего дня!
        end: true

  # ------------------------------------------------------------------
  - id: ff-d-termin
    title: Termin verschieben
    title_ru: Переносим встречу по телефону
    situation_ru: У вас во вторник в 10 часов собеседование в фирме «Maintal Logistik». Вы не сможете прийти и звоните в отдел кадров, чтобы договориться о другом времени. Вас зовут Дмитро Ткаченко. По телефону говорят на «Sie».
    partner: Frau Hoffmann, Personalabteilung
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Maintal Logistik, Personalabteilung, Hoffmann. Guten Tag!
        ru: «Майнтал Логистик», отдел кадров, Хоффман. Добрый день!
        options:
          - t: Guten Tag, hier spricht Dmytro Tkachenko. Ich rufe wegen meines Vorstellungsgesprächs an.
            ru: Добрый день, говорит Дмитро Ткаченко. Я звоню по поводу собеседования.
            next: n2
          - t: Guten Tag, Tkachenko am Apparat. Ich habe am Dienstag um zehn Uhr einen Termin bei Ihnen.
            ru: Добрый день, у телефона Ткаченко. У меня во вторник в десять встреча у вас.
            next: n2
          - t: Hallo, ich bin Dmytro. Ich will den Termin ändern.
            ru: Привет, я Дмитро. Я хочу изменить встречу.
            next: n2
            ok: false
            fb: По телефону с фирмой — «Guten Tag» и фамилия. «Hallo, ich bin …» и «Ich will» звучат слишком неформально и резко.
      n2:
        say: Ah, guten Tag, Herr Tkachenko. Ja, Dienstag um zehn Uhr. Was kann ich für Sie tun?
        ru: А, добрый день, господин Ткаченко. Да, вторник, десять часов. Чем могу помочь?
        options:
          - t: Leider kann ich am Dienstag nicht kommen. Könnten wir den Termin verschieben?
            ru: К сожалению, я не смогу прийти во вторник. Не могли бы мы перенести встречу?
            next: n3
          - t: Es tut mir leid, aber ich muss den Termin leider absagen. Könnte ich einen neuen Termin bekommen?
            ru: Мне очень жаль, но мне придётся отменить встречу. Можно получить новое время?
            next: n3
          - t: Dienstag geht nicht. Ich habe keine Lust.
            ru: Во вторник не получится. Мне не хочется.
            next: n3
            ok: false
            fb: "Так причину не называют. Скажите вежливо, например: «Leider habe ich am Dienstag einen anderen wichtigen Termin.»"
      n3:
        say: Kein Problem. Wann würde es Ihnen denn passen? Der Chef hat am Mittwoch und am Donnerstag Zeit.
        ru: Не проблема. Когда вам было бы удобно? У начальника есть время в среду и в четверг.
        options:
          - t: Am Mittwoch würde es mir passen. Wäre um elf Uhr möglich?
            ru: В среду мне было бы удобно. Было бы возможно в одиннадцать?
            next: n4
          - t: Könnten Sie mir bitte sagen, ob am Donnerstag noch etwas frei ist?
            ru: Не могли бы вы сказать, есть ли ещё что-нибудь свободное в четверг?
            next: n4b
          - t: Mittwoch. Elf. Okay?
            ru: Среда. Одиннадцать. Окей?
            next: n4
            ok: false
            fb: "Слишком коротко и без вежливых форм. Лучше полным предложением: «Am Mittwoch um elf Uhr würde es mir passen.»"
      n4:
        say: Mittwoch um elf Uhr ist leider schon besetzt. Ich könnte Ihnen Mittwoch um 14 Uhr anbieten. Wäre das möglich?
        ru: В среду в одиннадцать, к сожалению, занято. Могу предложить среду в 14 часов. Это возможно?
        options:
          - t: Ja, 14 Uhr passt mir gut. Vielen Dank.
            ru: Да, 14 часов мне подходит. Большое спасибо.
            next: n5
          - t: Leider habe ich da schon einen anderen Termin. Hätten Sie vielleicht auch am Donnerstag Zeit?
            ru: К сожалению, у меня на это время уже есть другая встреча. А в четверг у вас не нашлось бы времени?
            next: n4b
          - t: 14 Uhr ist doof. Haben Sie nichts anderes?
            ru: В 14 — не очень. У вас нет ничего другого?
            next: n4b
            ok: false
            fb: «Doof» — грубое слово. Вежливо — «Leider passt mir 14 Uhr nicht so gut. Gibt es noch eine andere Zeit?»
      n4b:
        say: Am Donnerstag hätte ich um zehn Uhr noch einen Termin frei.
        ru: В четверг в десять у меня ещё есть свободное время.
        options:
          - t: Donnerstag um zehn Uhr passt mir gut. Vielen Dank.
            ru: Четверг в десять мне подходит. Большое спасибо.
            next: n5
          - t: Ja, einverstanden. Könnten Sie mir den Termin bitte bestätigen?
            ru: Да, согласен. Не могли бы вы подтвердить мне встречу?
            next: n5
      n5:
        say: Gut, dann trage ich Sie ein. Soll ich Ihnen die Bestätigung per E-Mail schicken?
        ru: Хорошо, тогда я вас записываю. Прислать вам подтверждение по электронной почте?
        options:
          - t: Ja, bitte. Meine Adresse steht ja in der Bewerbung.
            ru: Да, пожалуйста. Мой адрес ведь есть в заявлении.
            next: n6
          - t: Das wäre nett. Und könnten Sie mir auch die Durchwahl von Herrn Berger geben?
            ru: Это было бы любезно. И не могли бы вы назвать мне добавочный номер господина Бергера?
            next: n6
          - t: Ja, schick sie mir.
            ru: Да, пришли мне.
            next: n6
            ok: false
            fb: С сотрудником фирмы — на «Sie». Правильно — «Ja, bitte schicken Sie sie mir.» или «Ja, das wäre nett.»
      n6:
        say: Natürlich. Bitte denken Sie an Ihren Ausweis und Ihre Zeugnisse. Gibt es noch etwas?
        ru: Конечно. Пожалуйста, не забудьте удостоверение личности и аттестаты. Что-нибудь ещё?
        options:
          - t: Nein, danke für Ihre Hilfe. Auf Wiederhören!
            ru: Нет, спасибо за помощь. До свидания!
            next: end
          - t: Vielen Dank, dass Sie mir so schnell geholfen haben. Auf Wiederhören!
            ru: Большое спасибо, что так быстро мне помогли. До свидания!
            next: end
          - t: Ja, ja. Tschüss!
            ru: Да-да. Пока!
            next: end
            ok: false
            fb: «Tschüss» слишком разговорно для звонка в фирму. По телефону прощаются «Auf Wiederhören!» (на «Sie»).
      end:
        say: Gern geschehen. Auf Wiederhören, Herr Tkachenko! Wir sehen uns dann.
        ru: Пожалуйста. До свидания, господин Ткаченко! Тогда увидимся.
        end: true

texts:
  # ------------------------------------------------------------------
  - id: ff-t-stelle
    kind: Anzeige
    title: Stellenangebote in Frankfurt
    text: |
      A) Bürokraft (m/w/d), Teilzeit
      Die Spedition Rhein-Main sucht ab November eine Bürokraft für 25 Stunden pro Woche, Montag bis Freitag von 8 bis 13 Uhr. Sie telefonieren mit Kunden, schreiben E-Mails und planen Termine. Wir erwarten gute Deutschkenntnisse (mindestens B1) und Erfahrung mit dem Computer. Gehalt: 1.800 Euro im Monat. Bewerbung per E-Mail an Frau Lorenz.

      B) Lagerhelfer (m/w/d), Vollzeit, Schichtarbeit
      Für unser Lager am Flughafen suchen wir Verstärkung. Sie arbeiten im Wechsel früh (6 bis 14 Uhr) und spät (14 bis 22 Uhr). Deutschkenntnisse auf A2 reichen. Den Führerschein für den Stapler bezahlen wir. Lohn: 15,50 Euro pro Stunde. Rufen Sie einfach Herrn Aksoy an: 069 555 01 38.

      C) Praktikum in der Bank, drei Monate
      Die Mainbank bietet ein Praktikum in der Filiale Sachsenhausen. Sie helfen am Schalter, erklären Kunden das Onlinebanking und lernen den Arbeitsalltag in einer Bank kennen. Sie haben einen Schulabschluss und sprechen gut Deutsch (B1 oder besser). Bezahlung: 600 Euro im Monat. Bewerben Sie sich bis Ende November mit Lebenslauf und Zeugnis.
    glossary:
      Bürokraft: сотрудник офиса (общее название)
      "(m/w/d)": мужчина / женщина / разное (в объявлениях о работе)
      Spedition: транспортно-экспедиторская фирма
      Verstärkung: "подкрепление (здесь: новые сотрудники)"
      Stapler: погрузчик (вилочный)
      im Wechsel: по очереди, посменно
      Führerschein: водительские права
      Bezahlung: оплата
    questions:
      - type: choice
        q: Tamara hat ein kleines Kind und kann nur vormittags arbeiten. Sie spricht gut Deutsch. Welche Anzeige passt?
        ru: У Тамары маленький ребёнок, и она может работать только по утрам. Она хорошо говорит по-немецки. Какое объявление ей подходит?
        options: [Anzeige A, Anzeige B, Anzeige C]
        answer: Anzeige A
        why: Teilzeit, 8 bis 13 Uhr.
      - type: choice
        q: Murat spricht erst A2 Deutsch und sucht eine Vollzeitstelle. Welche Anzeige passt?
        ru: Мурат пока говорит по-немецки на уровне A2 и ищет работу на полный день. Какое объявление ему подходит?
        options: [Anzeige A, Anzeige B, Anzeige C]
        answer: Anzeige B
        why: В объявлении B достаточно A2, работа — полный день.
      - type: choice
        q: Svetlana möchte in einer Bank arbeiten und den Beruf kennenlernen. Welche Anzeige passt?
        ru: Светлана хочет работать в банке и познакомиться с профессией. Какое объявление ей подходит?
        options: [Anzeige A, Anzeige B, Anzeige C]
        answer: Anzeige C
        why: Только в C речь идёт о банке и практике.
      - type: tf
        q: Als Bürokraft arbeitet man am Nachmittag.
        ru: Сотрудник офиса работает во второй половине дня.
        answer: false
        why: Работа с 8 до 13 часов.
      - type: tf
        q: Den Führerschein für den Stapler muss man selbst bezahlen.
        ru: За права на погрузчик нужно платить самому.
        answer: false
        why: "Фирма сама оплачивает: «Den Führerschein für den Stapler bezahlen wir.»"
      - type: choice
        q: Was muss man für das Praktikum bei der Mainbank schicken?
        ru: Что нужно отправить для практики в «Майнбанк»?
        options: [einen Lebenslauf und ein Zeugnis, nur eine E-Mail, ein Foto und einen Führerschein]
        answer: einen Lebenslauf und ein Zeugnis
        why: "В тексте: «mit Lebenslauf und Zeugnis»."

  # ------------------------------------------------------------------
  - id: ff-t-mail
    kind: E-Mail
    title: Ihr neues Girokonto
    text: |
      Betreff: Ihr neues Girokonto – wichtige Information

      Sehr geehrte Frau Nowak,

      vielen Dank, dass Sie sich für ein Girokonto bei der Mainbank entschieden haben. Wir haben Ihren Antrag am 14. Oktober bekommen. Leider fehlt uns noch ein Dokument: Bitte schicken Sie uns eine Kopie Ihrer Meldebescheinigung. Sie können die Kopie als Anhang per E-Mail senden oder in jeder Filiale abgeben. Ohne die Bescheinigung können wir Ihr Konto nicht freischalten.

      Wenn alles vollständig ist, bekommen Sie Ihre Bankkarte innerhalb von sieben Tagen mit der Post. Die Geheimzahl schicken wir in einem zweiten Brief. Das Konto kostet 4,90 Euro im Monat. Wenn Ihr Gehalt auf das Konto kommt, ist es kostenlos. Das Onlinebanking mit unserer App kostet nichts.

      Haben Sie Fragen? Rufen Sie uns an, Montag bis Freitag von 9 bis 17 Uhr, unter 069 555 01 23.

      Mit freundlichen Grüßen
      Lena Hartmann
      Kundenservice, Mainbank Frankfurt
    glossary:
      Betreff: тема письма
      sich entscheiden für: решиться на что-то, выбрать
      Antrag: заявление
      fehlen: не хватать
      freischalten: активировать, разблокировать
      vollständig: полный, в полном комплекте
      innerhalb von: в течение
    questions:
      - type: choice
        q: Warum schreibt die Bank an Frau Nowak?
        ru: Почему банк пишет госпоже Новак?
        options: [Ein Dokument fehlt noch., Das Konto ist schon offen., Die Karte ist verloren.]
        answer: Ein Dokument fehlt noch.
        why: "«Leider fehlt uns noch ein Dokument.»"
      - type: choice
        q: Welches Dokument braucht die Bank?
        ru: Какой документ нужен банку?
        options: [eine Kopie der Meldebescheinigung, den Arbeitsvertrag, einen Kontoauszug]
        answer: eine Kopie der Meldebescheinigung
      - type: tf
        q: Frau Nowak kann das Dokument auch in einer Filiale abgeben.
        ru: Госпожа Новак может сдать документ и в отделении банка.
        answer: true
      - type: tf
        q: Die Geheimzahl steht auf der Bankkarte.
        ru: ПИН-код написан на банковской карте.
        answer: false
        why: Его присылают отдельным письмом.
      - type: choice
        q: Wann kostet das Konto nichts?
        ru: Когда счёт бесплатный?
        options: [wenn das Gehalt auf das Konto kommt, wenn man die App benutzt, wenn man in der Filiale wohnt]
        answer: wenn das Gehalt auf das Konto kommt
      - type: choice
        q: Wann bekommt Frau Nowak die Karte?
        ru: Когда госпожа Новак получит карту?
        options: [sofort in der Filiale, "in etwa einer Woche, wenn alles vollständig ist", in einem Monat]
        answer: "in etwa einer Woche, wenn alles vollständig ist"

