  - id: be-t-tagesablauf
    kind: Forum
    title: Mein Tag
    text: |
      Hallo! Ich heiße Daria, ich bin 23 und studiere Informatik in Berlin. Ich wohne in einer WG im Wedding. Unter der Woche stehe ich um halb sieben auf. Zuerst dusche ich, dann frühstücke ich mit meiner Mitbewohnerin Elif. Um acht fahre ich mit der U-Bahn zur Uni. Die Vorlesung fängt um Viertel nach acht an. Mittags esse ich in der Mensa. Am Nachmittag arbeite ich drei Stunden in einem Café. Gegen sechs komme ich nach Hause. Am Abend kochen Elif und ich zusammen, und danach lerne ich oder sehe fern. Um elf gehe ich ins Bett. Am Wochenende schlafe ich lange – oft bis zehn!
    glossary:
      Informatik: информатика
      unter der Woche: в будни
      Uni: университет (разг.)
      Vorlesung: лекция
      Mensa: студенческая столовая
      lernen: учиться, заниматься
    questions:
      - type: tf
        q: Daria wohnt allein.
        ru: Дарья живёт одна.
        answer: false
      - type: choice
        q: Wann steht Daria unter der Woche auf?
        ru: Когда Дарья встаёт в будни?
        options: ["um 6:30 Uhr", "um 7:30 Uhr", "um 8:15 Uhr"]
        answer: "um 6:30 Uhr"
        why: halb sieben = 6:30.
      - type: tf
        q: Daria frühstückt mit Elif.
        ru: Дарья завтракает с Элиф.
        answer: true
      - type: choice
        q: Wo isst Daria mittags?
        ru: Где Дарья обедает?
        options: [zu Hause, in der Mensa, im Café]
        answer: in der Mensa
      - type: tf
        q: Daria kommt gegen acht Uhr abends nach Hause.
        ru: Дарья приходит домой около восьми вечера.
        answer: false
        why: Gegen sechs komme ich nach Hause.
      - type: choice
        q: Was macht Daria am Wochenende?
        ru: Что Дарья делает в выходные?
        options: [Sie steht um halb sieben auf., Sie schläft lange., Sie arbeitet im Café.]
        answer: Sie schläft lange.

