      - Das Bad putze ich am Sonntag.
      - Am Mittwoch bringe ich den Müll runter.
      - Ich stehe um sechs Uhr auf.

writing:
  - id: be-s-nachricht
    exam: Goethe A1 · Schreiben Teil 2
    kind: Nachricht
    task: |
      Sie haben am Mittwoch um 18 Uhr einen Termin. Sie möchten die Wohnung von Herrn Lange
      ansehen. Aber Sie können am Mittwoch nicht kommen. Schreiben Sie Herrn Lange eine Nachricht.
      – Entschuldigen Sie sich.
      – Warum können Sie nicht kommen?
      – Schlagen Sie einen neuen Termin vor.
      Schreiben Sie 30–40 Wörter. Schreiben Sie zu allen drei Punkten.
    task_ru: |
      В среду в 18:00 у вас осмотр квартиры господина Ланге, но вы не можете прийти.
      Напишите ему короткое сообщение: извинитесь, объясните причину и предложите
      новое время. 30–40 слов, все три пункта.
    points:
      - Entschuldigung
      - Grund (Warum können Sie nicht kommen?)
      - neuer Termin (Tag und Uhrzeit)
    words: [30, 40]
    structure:
      - Обращение (Sehr geehrter Herr … / Sehr geehrte Frau …; соседу — Lieber … / Liebe …)
      - "Пункт 1: извинение — Es tut mir leid, aber …"
      - "Пункт 2: причина — Ich muss … / Ich habe …"
      - "Пункт 3: новое предложение — Haben Sie am … um … Zeit?"
      - По желанию — просьба об ответе (Bitte antworten Sie mir kurz.)
      - Прощание (Mit freundlichen Grüßen / Viele Grüße) и имя
    redemittel:
      - de: Sehr geehrter Herr Lange,
        ru: Уважаемый господин Ланге,
      - de: Es tut mir leid, aber ich kann am Mittwoch nicht kommen.
        ru: Мне жаль, но я не могу прийти в среду.
      - de: Leider habe ich am … keine Zeit.
        ru: К сожалению, у меня … нет времени.
      - de: Ich muss bis … Uhr arbeiten.
        ru: Мне нужно работать до … часов.
      - de: Ich habe am Mittwoch einen Arzttermin.
        ru: В среду у меня приём у врача.
      - de: Haben Sie am Donnerstag um … Uhr Zeit?
        ru: У вас есть время в четверг в … часов?
      - de: Geht es auch am Freitag?
        ru: Можно также в пятницу?
      - de: Ich kann ab 17 Uhr.
        ru: Я могу с 17 часов.
      - de: Bitte antworten Sie mir kurz.
        ru: Пожалуйста, коротко ответьте мне.
      - de: Mit freundlichen Grüßen
        ru: С уважением
    model: |
      Sehr geehrter Herr Lange,

      es tut mir leid, aber ich kann am Mittwoch nicht zur Besichtigung kommen.
      Ich muss bis 20 Uhr arbeiten. Haben Sie am Donnerstag oder am Freitag ab 17 Uhr Zeit?

      Mit freundlichen Grüßen
      Olena Bondar
    checklist:
      - Все три пункта раскрыты (извинение, причина, новый срок)?
      - 30–40 слов?
      - Обращение и прощание на месте, имя подписано?
      - Глагол на 2-м месте (Leider habe ich …, Am Donnerstag kann ich …)?
      - Время с um, день с am?
      - Вежливое Sie / Ihnen — с большой буквы?
      - После обращения с запятой следующая строка начинается с маленькой буквы (es tut mir leid …)?

  - id: be-s-formular
    exam: Goethe A1 · Schreiben Teil 1
    kind: Formular
    task: |
      Ihre Freundin Ana Ribeiro sucht ein WG-Zimmer in Berlin. Sie ist 24 Jahre alt und kommt
      aus Portugal. Sie studiert Medizin an der Universität. Sie möchte am 1. März einziehen.
      Sie kann maximal 450 Euro im Monat bezahlen. Sie raucht nicht und hat eine Katze.
      Sie helfen Ana und füllen das Formular der Wohnungsbörse für sie aus.
      Es fehlen fünf Informationen.
    task_ru: |
      Ваша подруга Ана Рибейру ищет комнату в WG. Заполните за неё анкету сайта
      по поиску жилья: в анкете не хватает пяти данных. Возьмите их из текста.
      Пишите коротко: слово, число или дата.
    points:
      - "Herkunftsland: …"
      - "Beruf: …"
      - "Einzug ab: …"
      - "Miete maximal: … Euro"
      - "Haustiere: ja / nein"
    words: [5, 15]
    structure:
      - Прочитайте текст и подчеркните нужные данные
      - В каждое поле — только ответ (слово, число, дата), без предложения
      - Дата — в немецком формате (1. März или 01.03.)
      - Проверьте, что все пять полей заполнены
    redemittel:
      - de: Herkunftsland
        ru: страна происхождения
      - de: Beruf
        ru: профессия, род занятий
      - de: Studentin
        ru: студентка
      - de: Einzug ab
        ru: дата въезда (с …)
      - de: Miete maximal
        ru: максимальная аренда
      - de: Haustiere
        ru: домашние животные
      - de: Nichtraucherin
        ru: некурящая
      - de: Vorname / Familienname
        ru: имя / фамилия
    model: |
      Name: Ribeiro, Ana
      Alter: 24
      1 Herkunftsland: Portugal
      2 Beruf: Studentin (Medizin)
      3 Einzug ab: 1. März
      4 Miete maximal: 450 Euro
      5 Haustiere: ja (eine Katze)
    checklist:
      - Заполнены все пять полей?
      - Данные взяты из текста, ничего не придумано?
      - Профессия в женском роде (Studentin)?
      - Дата и сумма написаны правильно?
      - Существительные с большой буквы (Portugal, Studentin, Katze)?

speaking:
  - id: be-sp-1
    exam: Goethe A1 · Sprechen Teil 2
    task: "Thema: Wohnen — Fragen stellen und antworten"
    task_ru: |
      Вы берёте карточку с темой «Wohnen» и одним словом. Задайте партнёру вопрос
      с этим словом, партнёр отвечает. Потом наоборот.
    prompts: ["Küche?", "Miete?", "Balkon?", "Zimmer?", "Nachbarn?", "Möbel?"]
    model: |
      Küche: Wie groß ist deine Küche? – Sie ist klein, aber modern.
      Miete: Wie hoch ist deine Miete? – Ich zahle 480 Euro warm.
      Balkon: Hast du einen Balkon? – Nein, leider nicht. Aber wir haben einen Garten.
      Zimmer: Wie viele Zimmer hat deine Wohnung? – Sie hat drei Zimmer.
      Nachbarn: Wie sind deine Nachbarn? – Sie sind nett, aber manchmal laut.
      Möbel: Hast du viele Möbel? – Nein, nur ein Bett, einen Schrank und einen Schreibtisch.

  - id: be-sp-2
    exam: Goethe A1 · Sprechen Teil 3
    task: Bitten formulieren und reagieren
    task_ru: |
      Сформулируйте вежливую просьбу по карточке, партнёр реагирует. На экзамене
      вместо слов на карточках картинки — здесь мы заменили их словами.
    prompts: ["Fenster öffnen", "Licht anmachen", "Tür zumachen", "Müll runterbringen", "Fernseher ausmachen", "Schlüssel geben"]
    model: |
      Fenster öffnen: Kannst du bitte das Fenster öffnen? – Ja, natürlich.
      Licht anmachen: Mach bitte das Licht an. – Gern, kein Problem.
      Tür zumachen: Können Sie bitte die Tür zumachen? – Ja, sofort.
      Müll runterbringen: Bringst du bitte den Müll runter? – Okay, das mache ich gleich.
      Fernseher ausmachen: Kannst du bitte den Fernseher ausmachen? – Moment, der Film ist gleich zu Ende.
      Schlüssel geben: Gib mir bitte den Schlüssel. – Hier, bitte.

  - id: be-sp-3
    exam: Übung im Unterricht (kein Prüfungsteil)
    task: Meine Wohnung beschreiben
    task_ru: Опишите свою квартиру или комнату (6–8 предложений).
    prompts: ["Wo?", "Wie groß?", "Wie viele Zimmer?", "Möbel?", "Miete?", "Was gefällt dir?", "Was gefällt dir nicht?"]
    model: |
      Ich wohne in einer WG in Berlin-Moabit. Die Wohnung liegt im vierten Stock, das Haus hat
      leider keinen Aufzug. Wir haben drei Zimmer, eine Küche und ein Bad. Mein Zimmer ist
      16 Quadratmeter groß. Ich habe ein Bett, einen Schreibtisch und ein Regal. Die Miete ist
      470 Euro mit Nebenkosten. Mein Zimmer ist hell und gemütlich, das gefällt mir. Aber die
      Küche ist sehr klein, und die Straße ist laut.

