      - s: B
        t: Ich, glaube ich. Aber bis Freitag arbeite ich jeden Tag bis acht Uhr abends.
      - s: A
        t: Dann putz die Küche doch am Samstag.
      - s: B
        t: Okay, am Samstagvormittag. Und du machst das Bad?
      - s: A
        t: Ja, das Bad putze ich am Sonntag. Und am Mittwoch bringe ich den Müll runter.
      - s: B
