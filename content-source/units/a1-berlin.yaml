id: a1-berlin
level: A1
city: Berlin
country: DE
title: Wohnung & Alltag
title_ru: Квартира и повседневная жизнь
intro: |
  В Берлине вы ищете квартиру или комнату в WG: читаете объявления, ходите на осмотр,
  спрашиваете про аренду и коммунальные платежи. Учимся описывать квартиру и мебель,
  рассказывать о своём дне, называть время и договариваться о встрече.
  Грамматика: множественное число, Akkusativ, притяжательные артикли, глаголы с чередованием
  гласной и отделяемые глаголы, время и предлоги времени.

grammar:
  - id: be-g-plural
    title: Pluralformen der Nomen
    title_ru: Множественное число существительных
    terms:
      - t: Singular
        ru: единственное число (der Tisch)
      - t: Plural
        ru: множественное число (die Tische)
      - t: Nomen
        ru: существительное; в немецком всегда пишется с большой буквы
      - t: Artikel
        ru: артикль (der, die, das); во множественном числе всегда die
      - t: Endung
        ru: окончание (-e, -en, -er, -s)
      - t: Umlaut
        ru: замена гласной a → ä, o → ö, u → ü, au → äu (der Stuhl → die Stühle)
      - t: "-(e)n"
        ru: окончание -n или -en (die Lampe → die Lampen, die Wohnung → die Wohnungen)
    meaning: |
      Во множественном числе у немецких существительных разные окончания. Одного правила
      для всех слов нет, поэтому каждое новое существительное учите сразу в трёх формах:
      артикль + единственное число + множественное число (der Tisch, die Tische).
      Артикль во множественном числе всегда die — для мужского, женского и среднего рода.
      Основные типы: -e, -(e)n, -er, -s и без окончания. Часто вместе с окончанием
      появляется Umlaut.
    steps:
      - de: der Tisch → die Tische
        ru: Окончание -e. Так часто у односложных слов мужского рода.
      - de: der Stuhl → die Stühle
        ru: Окончание -e + Umlaut (u → ü).
      - de: die Lampe → die Lampen; die Wohnung → die Wohnungen
        ru: Окончание -(e)n. Почти все слова женского рода. Слова на -e получают только -n.
      - de: die Mitbewohnerin → die Mitbewohnerinnen
        ru: Женский суффикс -in → -innen (n удваивается).
      - de: das Haus → die Häuser
        ru: Окончание -er + Umlaut. Часто у слов среднего рода.
      - de: das Sofa → die Sofas
        ru: Окончание -s у слов на -a, -o, -y и у многих иностранных слов.
      - de: das Zimmer → die Zimmer; der Garten → die Gärten
        ru: Слова на -er, -el, -en часто без окончания, иногда только с Umlaut.
    table:
      head: [Typ, Singular, Plural]
      rows:
        - ["-e", der Tisch, die Tische]
        - ["-e + Umlaut", der Schrank, die Schränke]
        - ["-n", die Küche, die Küchen]
        - ["-en", die Wohnung, die Wohnungen]
        - ["-er + Umlaut", das Haus, die Häuser]
        - ["-s", das Sofa, die Sofas]
        - [ohne Endung, das Fenster, die Fenster]
        - [nur Umlaut, der Garten, die Gärten]
    exam: |
      Множественное число нужно во всех частях экзамена A1: в объявлениях («3 Zimmer,
      2 Bäder»), в письме и в устной части («Wie viele Zimmer hat die Wohnung?»).
      Отдельной части по грамматике в Goethe A1 нет, но ошибки в форме
      мешают пониманию в письме и в устной части.
    traps:
      - "Артикль во мн. ч. всегда die: das Zimmer → die Zimmer, der Stuhl → die Stühle."
      - "Не путайте: die Zimmer (мн. ч.) и das Zimmer (ед. ч.) — слово одинаковое, отличается только артикль."
      - "Umlaut есть не всегда: der Tisch → die Tische, но der Stuhl → die Stühle. Проверяйте по словарю."
      - "Женский род на -in: die Nachbarin → die Nachbarinnen (два n)."
      - "Die Möbel — обычно только мн. ч.: Die Möbel sind neu (не: Die Möbel ist neu)."
    exercises:
      - type: choice
        q: der Tisch → zwei ___
        ru: стол → два стола
        options: [Tische, Tischen, Tischer]
        answer: Tische
        why: Мужской род, один слог → часто окончание -e.
      - type: choice
        q: das Haus → viele ___
        ru: дом → много домов
        options: [Hause, Häuser, Hauses]
        answer: Häuser
        why: -er + Umlaut (au → äu).
      - type: choice
        q: Die Firma hat drei ___ in Berlin.
        ru: У фирмы три квартиры в Берлине.
        options: [Wohnunge, Wohnungs, Wohnungen]
        answer: Wohnungen
        why: Слова на -ung всегда получают -en.
      - type: choice
        q: Im Wohnzimmer stehen zwei ___.
        ru: В гостиной стоят два дивана.
        options: [Sofen, Sofas, Sofae]
        answer: Sofas
        why: Слова на -a получают -s.
      - type: choice
        q: Im Plural ist der Artikel immer ___.
        ru: Во множественном числе артикль всегда …
        options: [der, die, das]
        answer: die
      - type: gap
        q: Die Wohnung hat drei ___. (Zimmer)
        answer: [Zimmer]
        why: Слова на -er часто без окончания.
      - type: gap
        q: Wir brauchen noch zwei ___. (Stuhl)
        answer: [Stühle]
        why: -e + Umlaut.
      - type: gap
        q: In der Küche hängen zwei ___. (Lampe)
        answer: [Lampen]
        why: Слово на -e → только -n.
      - type: gap
        q: In unserer WG wohnen drei ___. (Mitbewohnerin)
        answer: [Mitbewohnerinnen]
        why: -in → -innen.
      - type: gap
        q: Hast du die ___ für die Wohnung? (Schlüssel)
        answer: [Schlüssel]
        why: На -el — без окончания.
      - type: table
        title: Singular → Plural
        head: [Singular, Plural]
        rows:
          - [der Schrank, "?die Schränke"]
          - [das Bett, "?die Betten"]
          - [die Küche, "?die Küchen"]
          - [der Garten, "?die Gärten"]
          - [das Bad, "?die Bäder"]
          - [das Fenster, "?die Fenster"]
      - type: order
        answer: Die Zimmer sind hell und groß.
        ru: Комнаты светлые и большие.

  - id: be-g-akkusativ
    title: "Akkusativ: den, einen, keinen"
    title_ru: "Винительный падеж (Akkusativ): den, einen, keinen"
    terms:
      - t: Akk. (Akkusativ)
        ru: винительный падеж; отвечает на вопрос wen? / was? (кого? что?)
      - t: Nom. (Nominativ)
        ru: именительный падеж; форма подлежащего (wer? / was?)
      - t: Subjekt
        ru: подлежащее — тот, кто действует (Ich suche …)
      - t: Objekt
        ru: дополнение — на кого/что направлено действие (… einen Schrank)
      - t: maskulin
        ru: мужской род (der)
      - t: feminin
        ru: женский род (die)
      - t: neutral
        ru: средний род (das)
      - t: Plural
        ru: множественное число
      - t: es gibt + Akk.
        ru: «есть, имеется» (In der Küche gibt es einen Herd.)
    meaning: |
      Многие глаголы требуют после себя дополнение в Akkusativ: haben, brauchen, suchen,
      kaufen, möchten, nehmen, finden, es gibt. Меняется только мужской род:
      der → den, ein → einen, kein → keinen. Женский род, средний род и множественное
      число в Akkusativ выглядят так же, как в Nominativ.
    steps:
      - de: Der Schrank ist neu.
        ru: Der Schrank — подлежащее (Nom.), форма не меняется.
      - de: Ich brauche einen Schrank.
        ru: Что мне нужно? — шкаф. Это Akk., мужской род → einen.
      - de: Wir kaufen den Tisch.
        ru: "Определённый артикль мужского рода в Akk.: der → den."
      - de: Die Wohnung hat keinen Balkon.
        ru: "Отрицание: kein → keinen."
      - de: Ich suche eine Wohnung und ein Sofa.
        ru: "Женский и средний род не меняются: eine, ein."
      - de: Es gibt keine Möbel.
        ru: "Мн. ч. тоже не меняется: keine, die."
    table:
      head: [Kasus, maskulin, feminin, neutral, Plural]
      rows:
        - [Nom., der / ein / kein Tisch, die / eine / keine Lampe, das / ein / kein Bett, die / – / keine Stühle]
        - [Akk., den / einen / keinen Tisch, die / eine / keine Lampe, das / ein / kein Bett, die / – / keine Stühle]
    exam: |
      Akkusativ нужен почти в каждой фразе: в письме («Ich suche eine Wohnung»,
      «Haben Sie einen Termin frei?»), в устной части, когда вы спрашиваете
      и просите («Hast du einen Balkon?»). Типичная ошибка, которую слышит экзаменатор, —
      «ein Balkon» вместо «einen Balkon».
    traps:
      - "Меняется только мужской род: Ich habe einen Balkon, но Ich habe eine Küche / ein Bad."
      - "После sein — не Akk.: Das ist ein Balkon (не: einen Balkon)."
      - "Es gibt + Akk.: Es gibt einen Aufzug (не: ein Aufzug)."
      - "Подлежащее всегда в Nom., даже если стоит не первым: Morgen kommt der Hausmeister."
    exercises:
      - type: choice
        q: Ich brauche ___ Schrank.
        ru: Мне нужен шкаф.
        options: [ein, einen, eine]
        answer: einen
        why: der Schrank, Akk. → einen.
      - type: choice
        q: Wir suchen ___ Wohnung in Berlin.
        ru: Мы ищем квартиру в Берлине.
        options: [eine, einen, ein]
        answer: eine
        why: Женский род в Akk. не меняется.
      - type: choice
        q: Die Wohnung hat leider ___ Aufzug.
        ru: В квартире, к сожалению, нет лифта.
        options: [kein, keinen, keine]
        answer: keinen
        why: der Aufzug, Akk. → keinen.
      - type: choice
        q: ___ Tisch ist sehr alt.
        ru: Стол очень старый.
        options: [Der, Den, Einen]
        answer: Der
        why: Стол — подлежащее, значит Nom.
      - type: choice
        q: Das ist ___ Kühlschrank.
        ru: Это холодильник.
        options: [ein, einen, keinen]
        answer: ein
        why: После sein — Nom.
      - type: gap
        q: Ich kaufe ___ Sofa. (ein)
        answer: [ein]
        why: das Sofa — средний род, форма не меняется.
      - type: gap
        q: Siehst du ___ Kühlschrank? (der)
        answer: [den]
        why: der → den.
      - type: gap
        q: In der Küche gibt es ___ Herd. (ein)
        answer: [einen]
        why: Es gibt + Akk.
      - type: gap
        q: Wir haben ___ Spülmaschine. (kein)
        answer: [keine]
        why: "Женский род: keine."
      - type: gap
        q: Nimmst du ___ Zimmer? (das)
        answer: [das]
        why: Средний род не меняется.
      - type: table
        title: Nominativ → Akkusativ
        head: [Nominativ, Akkusativ]
        rows:
          - [der Stuhl, "?den Stuhl"]
          - [ein Stuhl, "?einen Stuhl"]
          - [kein Stuhl, "?keinen Stuhl"]
          - [die Lampe, "?die Lampe"]
          - [ein Bett, "?ein Bett"]
          - [die Möbel, "?die Möbel"]
      - type: order
        answer: Ich suche einen Schreibtisch für mein Zimmer.
        tokens: [Ich, suche, einen Schreibtisch, für mein Zimmer]
        also: [Für mein Zimmer suche ich einen Schreibtisch.]
        ru: Я ищу письменный стол для своей комнаты.

  - id: be-g-possessiv
    title: Possessivartikel im Nominativ und Akkusativ
    title_ru: Притяжательные артикли (мой, твой, его…) в Nominativ и Akkusativ
    terms:
      - t: Possessivartikel
        ru: "притяжательный артикль: mein (мой), dein (твой), sein (его), ihr (её; их), unser (наш), euer (ваш), Ihr (Ваш)"
      - t: Nom. (Nominativ)
        ru: именительный падеж (форма подлежащего)
      - t: Akk. (Akkusativ)
        ru: винительный падеж (wen? / was?)
      - t: maskulin / feminin / neutral
        ru: мужской / женский / средний род
      - t: Plural
        ru: множественное число
      - t: Endung
        ru: "окончание: -e, -en"
    meaning: |
      Притяжательный артикль стоит вместо der/ein и показывает, чьё это. Окончания —
      как у ein/kein: mein Tisch, meine Lampe, mein Bett, meine Stühle; в Akkusativ меняется
      только мужской род: meinen Tisch. Форма зависит от двух вещей: от владельца
      (ich → mein, sie → ihr) и от слова после артикля (род, число, падеж).
      Русского «свой» в немецком нет: Er räumt sein Zimmer auf (его комнату = свою).
      Sie räumt ihr Zimmer auf (её комнату = свою).
    steps:
      - de: Das ist mein Zimmer.
        ru: Владелец ich → mein. das Zimmer, Nom. → без окончания.
      - de: Das ist meine Küche.
        ru: die Küche → окончание -e.
      - de: Ich suche meinen Schlüssel.
        ru: der Schlüssel, Akk. → -en.
      - de: Jonas räumt sein Zimmer auf. Lena räumt ihr Zimmer auf.
        ru: Владелец er → sein, владелец sie → ihr.
      - de: Ist das eure Wohnung?
        ru: euer + e → eure (e в середине выпадает).
      - de: Frau Brandt, ist das Ihr Balkon?
        ru: Вежливое «Ваш» — Ihr с большой буквы.
    table:
      head: [Person, "m. / n. (Nom.)", "f. / Plural", "m. (Akk.)"]
      rows:
        - [ich, mein, meine, meinen]
        - [du, dein, deine, deinen]
        - [er / es, sein, seine, seinen]
        - [sie, ihr, ihre, ihren]
        - [wir, unser, unsere, unseren]
        - [ihr, euer, eure, euren]
        - [sie / Sie, ihr / Ihr, ihre / Ihre, ihren / Ihren]
    exam: |
      В устной части A1 вы рассказываете о себе и спрашиваете партнёра:
      «Wie ist deine Wohnung?», «Wo ist Ihr Zimmer?». В письме — «Meine Wohnung ist …».
      Важно не путать sein / ihr и вежливое Ihr.
    traps:
      - "sein (его) и ihr (её) зависят от владельца, а не от вещи: Anna und ihr Bruder; Paul und seine Schwester."
      - "euer → eure, euren (без второго e): Ist das eure Küche?"
      - "Ihr (Ваш) — с большой буквы, ihr (её / их) — с маленькой."
      - "Akk. мужского рода: Ich rufe meinen Vermieter an (не: mein Vermieter)."
    exercises:
      - type: choice
        q: Das ist ___ Zimmer. (ich)
        ru: Это моя комната.
        options: [mein, meine, meinen]
        answer: mein
        why: das Zimmer, Nom. → mein.
      - type: choice
        q: Jonas, wo ist ___ Schlüssel?
        ru: Йонас, где твой ключ?
        options: [dein, deine, deinen]
        answer: dein
        why: der Schlüssel — подлежащее, Nom.
      - type: choice
        q: Anna sucht ___ Schlüssel.
        ru: Анна ищет свой ключ.
        options: [sein, ihren, seinen]
        answer: ihren
        why: Владелец Anna (sie) → ihr-; der Schlüssel, Akk. → ihren.
      - type: choice
        q: Herr Kaya, ist das ___ Wohnung?
        ru: Господин Кая, это Ваша квартира?
        options: [Ihre, ihre, deine]
        answer: Ihre
        why: Вежливая форма — с большой буквы.
      - type: choice
        q: Wir finden ___ Küche sehr gemütlich.
        ru: Мы считаем нашу кухню очень уютной.
        options: [unser, unsere, unseren]
        answer: unsere
        why: die Küche → unsere.
      - type: gap
        q: Kinder, räumt bitte ___ Zimmer auf! (euer)
        answer: [euer]
        why: das Zimmer, Akk. — средний род не меняется.
      - type: gap
        q: Ihr habt einen Balkon? ___ Balkon ist sehr schön! (euer)
        answer: [Euer]
        why: der Balkon — подлежащее, Nom. → euer.
      - type: gap
        q: Paul ruft ___ Vermieterin an. (sein)
        answer: [seine]
        why: die Vermieterin → seine.
      - type: gap
        q: Wir verkaufen ___ Sofa. (unser)
        answer: [unser]
        why: das Sofa, Akk. = Nom.
      - type: gap
        q: Ich mag ___ Mitbewohner. (mein)
        answer: [meinen]
        why: der Mitbewohner, Akk. → meinen.
      - type: table
        title: Possessivartikel
        head: [Person, "m. / n. (Nom.)", "f. / Plural", "m. (Akk.)"]
        rows:
          - [ich, mein, meine, meinen]
          - [du, "?dein", "?deine", "?deinen"]
          - [er, "?sein", "?seine", "?seinen"]
          - [sie, "?ihr", "?ihre", "?ihren"]
          - [wir, "?unser", "?unsere", "?unseren"]
          - [ihr, "?euer", "?eure", "?euren"]
      - type: order
        answer: Meine Mitbewohnerin putzt heute ihr Zimmer.
        also: [Heute putzt meine Mitbewohnerin ihr Zimmer.]
        ru: Моя соседка сегодня убирает свою комнату.

  - id: be-g-vokalwechsel
    title: Verben mit Vokalwechsel und trennbare Verben
    title_ru: Глаголы с чередованием гласной и отделяемые глаголы
    terms:
      - t: Präsens
        ru: настоящее время
      - t: Infinitiv
        ru: начальная форма глагола (essen, aufstehen)
      - t: Vokalwechsel
        ru: смена гласной в корне у du и er/sie/es (e → i, e → ie, a → ä, au → äu)
      - t: Umlaut
        ru: ä, ö, ü, äu
      - t: trennbares Verb
        ru: "отделяемый глагол: приставка в предложении уходит в конец (aufstehen → Ich stehe … auf.)"
      - t: Präfix
        ru: приставка (auf-, an-, ein-, fern-, mit-)
      - t: Position 2
        ru: второе место в предложении — там стоит спрягаемый глагол
      - t: Satzklammer
        ru: "«рамка»: глагол на 2-м месте, приставка в самом конце"
    meaning: |
      1) Некоторые сильные глаголы меняют гласную корня только у du и er/sie/es:
      essen → du isst, er isst; lesen → du liest; fahren → du fährst; laufen → du läufst.
      У ich, wir, ihr, sie/Sie гласная обычная: ich esse, wir essen.
      2) У отделяемых глаголов ударная приставка отделяется: спрягаемая часть стоит
      на 2-м месте, приставка — в конце предложения. Это и есть Satzklammer.
      Глагол может иметь оба свойства: fernsehen → Er sieht fern. anfangen → Der Kurs fängt an.
    steps:
      - de: Ich esse Brot. – Du isst Müsli. – Er isst nichts.
        ru: e → i только у du и er/sie/es.
      - de: Ich lese. – Du liest. – Sie liest.
        ru: e → ie.
      - de: Ich schlafe. – Du schläfst. – Er schläft.
        ru: a → ä.
      - de: Ich stehe um sieben Uhr auf.
        ru: "aufstehen: stehe — на 2-м месте, auf — в конце."
      - de: Am Samstag kaufen wir ein.
        ru: Если на 1-м месте время, глагол всё равно 2-й, приставка — в конце.
      - de: Siehst du heute fern?
        ru: В вопросе без вопросительного слова глагол 1-й, приставка — в конце.
    table:
      head: [Infinitiv, ich, du, er / sie / es, Wechsel]
      rows:
        - [essen, esse, isst, isst, e → i]
        - [nehmen, nehme, nimmst, nimmt, e → i]
        - [sprechen, spreche, sprichst, spricht, e → i]
        - [treffen, treffe, triffst, trifft, e → i]
        - [lesen, lese, liest, liest, e → ie]
        - [sehen, sehe, siehst, sieht, e → ie]
        - [fahren, fahre, fährst, fährt, a → ä]
        - [schlafen, schlafe, schläfst, schläft, a → ä]
        - [waschen, wasche, wäschst, wäscht, a → ä]
        - [laufen, laufe, läufst, läuft, au → äu]
    exam: |
      В письме и устной части A1 вы описываете свой день и договариваетесь о встрече:
      «Ich stehe um sieben auf», «Wann fängt der Kurs an?». Ошибки в порядке слов
      («Ich aufstehe») и в формах du/er («er esst») хорошо слышны экзаменатору.
    traps:
      - "Смена гласной — только du и er/sie/es: wir essen (не: wir issen)."
      - "nehmen: du nimmst, er nimmt — меняется и согласная (mm)."
      - "essen: du isst (не: du esst, не: du issst)."
      - "Приставка в конце: Ich stehe um 7 Uhr auf (не: Ich aufstehe um 7 Uhr)."
      - "В словаре и в инфинитиве приставка пишется слитно: aufstehen, einkaufen. Точка (auf·stehen) — только пометка в словаре."
    exercises:
      - type: choice
        q: Was ___ du zum Frühstück?
        ru: Что ты ешь на завтрак?
        options: [esst, isst, essst]
        answer: isst
        why: essen → du isst.
      - type: choice
        q: Mia ___ jeden Abend ein Buch.
        ru: Мия каждый вечер читает книгу.
        options: [lest, liest, lesst]
        answer: liest
        why: e → ie.
      - type: choice
        q: ___ du heute mit dem Fahrrad?
        ru: Ты сегодня едешь на велосипеде?
        options: [Fahrst, Fährst, Fährt]
        answer: Fährst
      - type: choice
        q: Er ___ am Sonntag bis zehn Uhr.
        ru: В воскресенье он спит до десяти.
        options: [schlaft, schläft, schläfst]
        answer: schläft
      - type: choice
        q: Welcher Satz ist richtig?
        ru: Какое предложение правильное?
        options: [Ich kaufe heute ein., Ich einkaufe heute., Ich kaufe ein heute.]
        answer: Ich kaufe heute ein.
        why: Приставка ein — в самом конце.
      - type: gap
        q: Du ___ das große Zimmer, oder? (nehmen)
        answer: [nimmst]
      - type: gap
        q: Jonas ___ jeden Morgen im Park. (laufen)
        answer: [läuft]
      - type: gap
        q: Ich stehe um halb sieben ___. (aufstehen)
        answer: [auf]
        why: Приставка — в конце предложения.
      - type: gap
        q: Wann ___ der Film an? (anfangen)
        answer: [fängt]
        why: "anfangen: a → ä + приставка an в конце."
      - type: table
        title: Vokalwechsel im Präsens
        head: [Infinitiv, du, er / sie / es]
        rows:
          - [essen, "?isst", "?isst"]
          - [sprechen, "?sprichst", "?spricht"]
          - [sehen, "?siehst", "?sieht"]
          - [fahren, "?fährst", "?fährt"]
          - [waschen, "?wäschst", "?wäscht"]
          - [laufen, "?läufst", "?läuft"]
      - type: order
        answer: Ich räume am Samstag mein Zimmer auf.
        tokens: [Ich, räume, am Samstag, mein Zimmer, auf]
        also: [Am Samstag räume ich mein Zimmer auf.]
        ru: В субботу я убираю свою комнату.
      - type: order
        answer: Am Abend sieht Elif fern.
        tokens: [Am Abend, sieht, Elif, fern]
        also: [Elif sieht am Abend fern.]
        ru: Вечером Элиф смотрит телевизор.

  - id: be-g-zeit
    title: Uhrzeit und Zeitpräpositionen
    title_ru: Время по часам и предлоги времени
    terms:
      - t: offiziell
        ru: "«официальное» время (вокзал, радио, расписание): 19:30 = neunzehn Uhr dreißig"
      - t: inoffiziell
        ru: "разговорное время, 12 часов: 19:30 = halb acht"
      - t: Viertel nach / Viertel vor
        ru: "четверть после / без четверти: 7:15 = Viertel nach sieben, 7:45 = Viertel vor acht"
      - t: halb
        ru: "половина до следующего часа: halb acht = 7:30"
      - t: Präposition
        ru: предлог
      - t: am
        ru: an + dem — дни, части суток, даты (am Montag, am Abend)
      - t: um
        ru: точное время (um acht Uhr)
      - t: im
        ru: in + dem — месяцы и времена года (im Mai, im Winter)
      - t: von … bis
        ru: с … до (von neun bis fünf)
      - t: ab
        ru: начиная с (ab Montag, ab 1. Mai)
    meaning: |
      Время говорят двумя способами. Официально — по 24 часам: сначала часы, потом
      слово Uhr, потом минуты (20:15 = zwanzig Uhr fünfzehn). Разговорно — по 12 часам
      со словами nach, vor, Viertel, halb (20:15 = Viertel nach acht).
      halb + следующий час: halb acht = 7:30, а не 8:30.
      Предлоги: um — точное время; am — день недели, часть суток, дата; im — месяц,
      время года; von … bis — промежуток; ab — с какого момента.
    steps:
      - de: Es ist acht Uhr.
        ru: 8:00 — ровно, со словом Uhr.
      - de: Es ist fünf nach acht. / Es ist zehn vor neun.
        ru: 8:05 / 8:50 — минуты после часа (nach) или до часа (vor).
      - de: Es ist Viertel nach acht. / Es ist Viertel vor neun.
        ru: 8:15 / 8:45.
      - de: Es ist halb neun.
        ru: 8:30 — «половина девятого».
      - de: Der Zug fährt um zwanzig Uhr fünfzehn.
        ru: "Официально: 20:15."
      - de: Am Montag um neun Uhr, im Mai, von Montag bis Freitag, ab Juni.
        ru: Предлоги времени.
    table:
      head: [Uhrzeit, offiziell, inoffiziell]
      rows:
        - ["7:00", sieben Uhr, sieben (Uhr)]
        - ["7:05", sieben Uhr fünf, fünf nach sieben]
        - ["7:15", sieben Uhr fünfzehn, Viertel nach sieben]
        - ["7:30", sieben Uhr dreißig, halb acht]
        - ["7:45", sieben Uhr fünfundvierzig, Viertel vor acht]
        - ["7:50", sieben Uhr fünfzig, zehn vor acht]
        - ["19:30", neunzehn Uhr dreißig, halb acht]
    exam: |
      Время встречается почти в каждом задании A1 на слух и при чтении: объявления,
      сообщения на автоответчике, таблички с часами работы. В письме вы называете
      время встречи. Слушайте внимательно: «halb acht» — это 7:30.
    traps:
      - "halb acht = 7:30 (половина восьмого), а не 8:30."
      - "Не путайте am и um: am Montag, но um acht Uhr."
      - "Im + месяц: im Mai. Но с датой — am: am 3. Mai."
      - "В Австрии (и на юге и востоке Германии) говорят также „viertel acht“ = 7:15 и „dreiviertel acht“ = 7:45."
      - "Официальное время: Uhr стоит между часами и минутами: acht Uhr zwanzig (не: acht zwanzig Uhr)."
    exercises:
      - type: choice
        q: "Es ist 8:30. Es ist ___."
        ru: Сейчас 8:30.
        options: [halb acht, halb neun, acht halb]
        answer: halb neun
        why: halb + следующий час.
      - type: choice
        q: "Es ist 7:15. Es ist ___."
        ru: Сейчас 7:15.
        options: [Viertel vor sieben, Viertel nach sieben, halb sieben]
        answer: Viertel nach sieben
      - type: choice
        q: "Es ist 9:45. Es ist ___."
        ru: Сейчас 9:45.
        options: [Viertel vor zehn, Viertel nach neun, Viertel vor neun]
        answer: Viertel vor zehn
      - type: choice
        q: "20:15 offiziell: Es ist ___."
        ru: 20:15 — официально.
        options: [zwanzig Uhr fünfzehn, fünfzehn Uhr zwanzig, zwanzig fünfzehn Uhr]
        answer: zwanzig Uhr fünfzehn
      - type: choice
        q: Ich komme ___ Samstag.
        ru: Я приду в субботу.
        options: [am, um, im]
        answer: am
      - type: choice
        q: Der Kurs fängt ___ neun Uhr an.
        ru: Курс начинается в девять часов.
        options: [am, um, im]
        answer: um
      - type: choice
        q: ___ Sommer ist es in Berlin warm.
        ru: Летом в Берлине тепло.
        options: [Am, Um, Im]
        answer: Im
      - type: gap
        q: Die Wohnung ist ___ Mai frei.
        ru: Квартира свободна с мая.
        answer: [ab]
      - type: gap
        q: Ich arbeite von acht ___ vier.
        ru: Я работаю с восьми до четырёх.
        answer: [bis]
      - type: gap
        q: Wir treffen uns ___ Abend.
        ru: Мы встретимся вечером.
        answer: [am]
      - type: gap
        q: "18:50 – Es ist zehn ___ sieben."
        ru: Сейчас без десяти семь.
        answer: [vor]
      - type: table
        title: Wie spät ist es? (inoffiziell)
        head: [Uhrzeit, inoffiziell]
        rows:
          - ["6:30", "?halb sieben"]
          - ["10:15", "?Viertel nach zehn"]
          - ["12:45", "?Viertel vor eins"]
          - ["14:05", "?fünf nach zwei"]
          - ["17:50", "?zehn vor sechs"]
      - type: order
        answer: Am Samstag stehe ich um neun Uhr auf.
        tokens: [Am Samstag, stehe, ich, um neun Uhr, auf]
        also: [Ich stehe am Samstag um neun Uhr auf.]
        ru: В субботу я встаю в девять часов.

dialogues:
  - id: be-d-besichtigung
    title: Die Wohnungsbesichtigung
    title_ru: Осмотр квартиры
    situation_ru: |
      Вы ищете квартиру в Берлине и пришли на осмотр двухкомнатной квартиры.
      Вас встречает хозяйка, госпожа Брандт. Узнайте размер, аренду, коммунальные платежи
      и с какого числа квартира свободна.
    partner: Vermieterin (Frau Brandt)
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Guten Tag! Sie kommen wegen der Wohnung? Ich bin Frau Brandt.
        ru: Добрый день! Вы по поводу квартиры? Я госпожа Брандт.
        options:
          - t: Guten Tag, Frau Brandt! Ja, ich komme zur Besichtigung.
            ru: Добрый день, госпожа Брандт! Да, я на осмотр.
            next: n2
          - t: Ja. Wohnung zeigen, bitte.
            ru: Да. Квартиру показать, пожалуйста.
            next: n2
            ok: false
            fb: Слишком коротко и без приветствия. Сначала поздоровайтесь — „Guten Tag, Frau Brandt!“ — и скажите полное предложение.
      n2:
        say: Kommen Sie bitte herein. Das ist der Flur, und hier links ist das Wohnzimmer.
        ru: Проходите, пожалуйста. Это прихожая, а здесь слева гостиная.
        options:
          - t: Oh, das Wohnzimmer ist schön hell! Wie groß ist die Wohnung?
            ru: О, гостиная очень светлая! Какая площадь у квартиры?
            next: n3
          - t: Wie viele Zimmer hat die Wohnung?
            ru: Сколько комнат в квартире?
            next: n3
          - t: Das Zimmer ist dunkel. Das will ich nicht.
            ru: Комната тёмная. Я такое не хочу.
            next: n3
            ok: false
            fb: "Так говорить невежливо. Можно спросить нейтрально: „Ist das Schlafzimmer heller?“ или просто узнать размер."
      n3:
        say: Die Wohnung hat zwei Zimmer, eine Küche und ein Bad. Sie ist 54 Quadratmeter groß.
        ru: В квартире две комнаты, кухня и ванная. Площадь — 54 квадратных метра.
        options:
          - t: Und hat die Wohnung auch einen Balkon?
            ru: А балкон в квартире есть?
            next: n4
          - t: Hat die Wohnung auch ein Balkon?
            ru: А балкон в квартире есть?
            next: n4
            ok: false
            fb: "der Balkon — мужской род, после haben нужен Akkusativ: einen Balkon."
      n4:
        say: Ja, hier ist der Balkon. Er liegt zum Hof. Er ist klein, aber sehr ruhig.
        ru: Да, вот балкон. Он выходит во двор. Он маленький, но очень тихий.
        options:
          - t: Sehr schön! Wie hoch ist die Miete?
            ru: Очень хорошо! Какая аренда?
            next: n5
          - t: Was kostet die Wohnung im Monat?
            ru: Сколько стоит квартира в месяц?
            next: n5
          - t: Wie viel Geld?
            ru: Сколько денег?
            next: n5
            ok: false
            fb: Звучит грубо. Спросите полным вопросом — „Wie hoch ist die Miete?“
      n5:
        say: Die Kaltmiete ist 690 Euro. Dazu kommen 160 Euro Nebenkosten.
        ru: Аренда без коммунальных — 690 евро. Плюс 160 евро коммунальные платежи.
        options:
          - t: Ist die Heizung in den Nebenkosten inklusive?
            ru: Отопление входит в коммунальные платежи?
            next: n6
          - t: Also 850 Euro warm, richtig?
            ru: То есть 850 евро с коммунальными, правильно?
            next: n6
      n6:
        say: Ja, genau. Die Heizung ist inklusive, aber den Strom zahlen Sie extra.
        ru: Да, точно. Отопление включено, а электричество вы платите отдельно.
        options:
          - t: Gut. Ab wann ist die Wohnung frei?
            ru: Хорошо. С какого числа квартира свободна?
            next: n7
          - t: Und wann kann ich einziehen?
            ru: А когда я могу въехать?
            next: n7
          - t: Wann frei?
            ru: Когда свободно?
            next: n7
            ok: false
            fb: Нет глагола. Правильно — „Ab wann ist die Wohnung frei?“
      n7:
        say: Ab dem ersten November. Möchten Sie die Wohnung nehmen?
        ru: С первого ноября. Хотите снять квартиру?
        options:
          - t: Ja, sehr gern! Die Wohnung gefällt mir sehr.
            ru: Да, с удовольствием! Квартира мне очень нравится.
            next: n8
          - t: Ich muss noch mit meiner Familie sprechen. Kann ich Sie morgen anrufen?
            ru: Мне нужно ещё поговорить с семьёй. Можно я позвоню вам завтра?
            next: n9
          - t: Ja, ich nehme. Tschüss!
            ru: Да, беру. Пока!
            next: n8
            ok: false
            fb: Не хватает дополнения (ich nehme sie / die Wohnung), а „Tschüss“ для незнакомого взрослого слишком неформально.
      n8:
        say: Wunderbar! Dann schicke ich Ihnen den Mietvertrag per E-Mail.
        ru: Замечательно! Тогда я пришлю вам договор аренды по электронной почте.
        options:
          - t: Vielen Dank, Frau Brandt! Auf Wiedersehen!
            ru: Большое спасибо, госпожа Брандт! До свидания!
            next: end
          - t: Danke, tschüss!
            ru: Спасибо, пока!
            next: end
            ok: false
            fb: С хозяйкой квартиры лучше прощаться вежливо — „Auf Wiedersehen!“
      n9:
        say: Natürlich. Rufen Sie mich bitte bis morgen Mittag an.
        ru: Конечно. Позвоните мне, пожалуйста, до завтрашнего обеда.
        options:
          - t: Ja, das mache ich. Vielen Dank und auf Wiedersehen!
            ru: Да, обязательно. Большое спасибо и до свидания!
            next: end
          - t: Gut, ich rufe Sie morgen um zehn Uhr an. Auf Wiedersehen!
            ru: Хорошо, я позвоню вам завтра в десять часов. До свидания!
            next: end
      end:
        say: Auf Wiedersehen! Einen schönen Tag noch!
        ru: До свидания! Хорошего дня!
        end: true

  - id: be-d-termin
    title: Wann hast du Zeit?
    title_ru: Когда у тебя есть время?
    situation_ru: |
      Вы живёте в WG в Берлине. Ваш сосед Йонас хочет вместе купить полку для кухни
      и навести порядок в подвале. Договоритесь о дне и времени и распределите уборку.
    partner: Mitbewohner (Jonas)
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Hey! Du, wir brauchen noch ein Regal für die Küche. Wann hast du Zeit? Dann fahren wir zusammen ins Möbelhaus.
        ru: Привет! Слушай, нам ещё нужна полка для кухни. Когда у тебя есть время? Тогда съездим вместе в мебельный магазин.
        options:
          - t: Am Samstag habe ich Zeit.
            ru: В субботу у меня есть время.
            next: n2
          - t: Im Samstag habe ich Zeit.
            ru: В субботу у меня есть время.
            next: n2
            ok: false
            fb: "С днями недели — am: am Samstag."
      n2:
        say: Samstag ist gut. Um wie viel Uhr?
        ru: Суббота подходит. Во сколько?
        options:
          - t: Vielleicht um zehn Uhr?
            ru: Может, в десять?
            next: n3
          - t: Am zehn Uhr?
            ru: В десять часов?
            next: n3
            ok: false
            fb: "С точным временем — um: um zehn Uhr."
      n3:
        say: Hm, um zehn schlafe ich noch. Geht es auch um halb zwölf?
        ru: Хм, в десять я ещё сплю. А в половине двенадцатого можно?
        options:
          - t: Ja, halb zwölf passt.
            ru: Да, половина двенадцатого подходит.
            next: n4
          - t: Um halb zwölf kann ich leider nicht. Geht es um eins?
            ru: В половине двенадцатого я, к сожалению, не могу. Можно в час?
            next: n3b
      n3b:
        say: Um eins? Ja, das geht auch.
        ru: В час? Да, так тоже можно.
        options:
          - t: Super, dann um eins.
            ru: Отлично, тогда в час.
            next: n4
          - t: Prima! Dann kann ich am Vormittag noch einkaufen.
            ru: Отлично! Тогда я ещё успею утром сходить за покупками.
            next: n4
      n4:
        say: Gut. Und danach räumen wir zusammen den Keller auf, okay?
        ru: Хорошо. А потом вместе разберём подвал, ладно?
        options:
          - t: Okay, aber nur bis vier. Am Abend treffe ich Freunde.
            ru: Ладно, но только до четырёх. Вечером я встречаюсь с друзьями.
            next: n5
          - t: Keine Lust.
            ru: Неохота.
            next: n5
            ok: false
            fb: Слишком резко. Можно вежливо ограничить время — „Okay, aber nur bis vier.“
      n5:
        say: Kein Problem. Am Sonntag putze ich das Bad. Machst du die Küche?
        ru: Без проблем. В воскресенье я мою ванную. Ты сделаешь кухню?
        options:
          - t: Ja, ich putze am Sonntag die Küche.
            ru: Да, я в воскресенье помою кухню.
            next: n6
          - t: Ja, am Sonntag putze ich die Küche.
            ru: Да, в воскресенье я помою кухню.
            next: n6
          - t: Ja, am Sonntag ich putze die Küche.
            ru: Да, в воскресенье я помою кухню.
            next: n6
            ok: false
            fb: "Глагол должен стоять на 2-м месте: Am Sonntag putze ich …"
      n6:
        say: Prima. Und wer bringt diese Woche den Müll runter?
        ru: Отлично. А кто на этой неделе выносит мусор?
        options:
          - t: Den Müll bringe ich heute Abend runter.
            ru: Мусор я вынесу сегодня вечером.
            next: n7
          - t: Das macht Amira. Diese Woche ist sie dran.
            ru: Это делает Амира. На этой неделе её очередь.
            next: n7
      n7:
        say: Gut. Dann treffen wir uns am Samstag im Flur, ja?
        ru: Хорошо. Тогда встречаемся в субботу в прихожей, да?
        options:
          - t: Ja, bis Samstag!
            ru: Да, до субботы!
            next: end
          - t: Ja. Ich schreibe dir vorher noch eine Nachricht.
            ru: Да. Я ещё напишу тебе сообщение заранее.
            next: end
      end:
        say: Alles klar. Bis dann!
        ru: Всё ясно. До встречи!
        end: true

texts:
  - id: be-t-anzeigen
    kind: Anzeige
    title: Wohnen in Berlin
    text: |
      A) Helles WG-Zimmer in Friedrichshain
      14 m², möbliert (Bett, Schrank, Schreibtisch). Wir sind zwei Studentinnen und suchen eine nette Mitbewohnerin. Küche und Bad teilen wir. Miete: 420 Euro inklusive Nebenkosten. Frei ab 1. Oktober.

      B) 2-Zimmer-Wohnung in Pankow
      58 m², 3. Stock, mit Aufzug und Balkon. Neue Küche, Bad mit Badewanne. Ruhige Straße, Kita und Supermarkt in der Nähe. Kaltmiete 780 Euro, Nebenkosten 190 Euro. Frei ab 1. Dezember.

      C) 1-Zimmer-Apartment in Neukölln
      28 m², Erdgeschoss, kein Balkon. Kleine Küche, Dusche. Nur fünf Minuten zur U-Bahn. Warmmiete 560 Euro. Frei ab sofort. Ideal für eine Person. Tel. 030 555 81 24 (abends)
    glossary:
      teilen: делить, пользоваться вместе
      Studentin: студентка
      Kita: детский сад
      in der Nähe: рядом, поблизости
      ab sofort: с сегодняшнего дня, сразу
      ideal: идеальный, отлично подходит
      Warmmiete: аренда вместе с коммунальными платежами
      Kaltmiete: аренда без коммунальных платежей
      Badewanne: ванна
    questions:
      - type: choice
        q: Sofia studiert und hat nicht viel Geld. Sie möchte nicht allein wohnen. Welche Anzeige passt?
        ru: София учится, денег у неё немного. Она не хочет жить одна. Какое объявление подходит?
        options: [Anzeige A, Anzeige B, Anzeige C]
