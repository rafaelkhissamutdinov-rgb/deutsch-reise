      - type: choice
        q: Familie Demir hat ein kleines Kind und möchte einen Balkon. Welche Anzeige passt?
        ru: У семьи Демир маленький ребёнок, им нужен балкон. Какое объявление подходит?
        options: [Anzeige A, Anzeige B, Anzeige C]
        answer: Anzeige B
      - type: choice
        q: Herr Novak wohnt allein und braucht sofort eine Wohnung. Welche Anzeige passt?
        ru: Господин Новак живёт один, и квартира нужна ему сразу. Какое объявление подходит?
        options: [Anzeige A, Anzeige B, Anzeige C]
        answer: Anzeige C
      - type: tf
        q: Das Haus in Pankow hat einen Aufzug.
