  # ------------------------------------------------------------------
  - id: kn-h-dialog
    kind: Dialog
    title: Was machen wir am Wochenende?
    voice: de-DE
    lines:
      - s: A
        t: "Hey Maxim, hast du am Wochenende schon was vor?"
      - s: B
        t: "Noch nicht. Am Samstag muss ich bis zwei arbeiten, aber danach habe ich Zeit. Warum?"
      - s: A
        t: "Das Wetter soll super werden. Wollen wir eine Radtour machen? Zum Beispiel am Rhein entlang bis nach Bonn?"
      - s: B
        t: "Bis nach Bonn? Das sind fast dreißig Kilometer! Das ist mir zu anstrengend. Ich bin nicht so sportlich wie du, Selin."
      - s: A
        t: "Okay, dann etwas Ruhigeres. Wir könnten an den See fahren und baden."
      - s: B
        t: "Das klingt gut! Aber am Samstag ist es dort bestimmt sehr voll. Lieber am Sonntag?"
      - s: A
        t: "Am Sonntag soll es aber Gewitter geben. Das habe ich heute Morgen im Radio gehört."
      - s: B
        t: "Hm, stimmt. Dann also Samstag. Ich bin um halb drei fertig. Treffen wir uns um drei?"
      - s: A
        t: "Lieber um halb vier. Ich muss vorher noch einkaufen. Ich bringe Obst und etwas zu trinken mit."
      - s: B
        t: "Super. Und ich nehme eine Decke und mein Federballspiel mit. Wo treffen wir uns?"
      - s: A
        t: "Am besten an der Haltestelle vor deinem Büro. Von dort fährt der Bus direkt zum See."
      - s: B
        t: "Perfekt. Dann bis Samstag! Und vergiss die Sonnencreme nicht!"
    questions:
      - type: choice
        q: Warum möchte Maxim nicht mit dem Rad nach Bonn fahren?
        ru: Почему Максим не хочет ехать на велосипеде в Бонн?
        options: [Die Tour ist ihm zu anstrengend., Er hat kein Fahrrad., Er muss am Samstag arbeiten.]
        answer: Die Tour ist ihm zu anstrengend.
      - type: tf
        q: Maxim arbeitet am Samstag den ganzen Tag.
        ru: Максим в субботу работает весь день.
        answer: false
      - type: choice
        q: Warum fahren die beiden nicht am Sonntag an den See?
        ru: Почему они не едут на озеро в воскресенье?
        options: [Es soll Gewitter geben., Am Sonntag ist es dort zu voll., Selin hat am Sonntag keine Zeit.]
        answer: Es soll Gewitter geben.
      - type: choice
        q: Um wie viel Uhr treffen sie sich?
        ru: Во сколько они встречаются?
        options: [um halb drei, um drei, um halb vier]
        answer: um halb vier
      - type: choice
        q: Was bringt Maxim mit?
        ru: Что принесёт Максим?
        options: [eine Decke und ein Federballspiel, Obst und Getränke, nur Sonnencreme]
        answer: eine Decke und ein Federballspiel
    dictation:
      - Hast du am Wochenende schon etwas vor?
      - Das ist mir zu anstrengend.
      - Am Sonntag soll es Gewitter geben.
      - Ich bringe Obst und etwas zu trinken mit.
      - Vergiss die Sonnencreme nicht!

writing:
  - id: kn-s-einladung
    exam: Goethe A2 · Schreiben Teil 2
    kind: E-Mail
    task: |
      Ihr Kollege, Herr Brandt, arbeitet seit 25 Jahren in Ihrer Firma. Er feiert das am Freitag mit einem Gartenfest und hat alle Kolleginnen und Kollegen eingeladen. Sie können nicht kommen.
      Schreiben Sie Herrn Brandt eine E-Mail:
      – Bedanken Sie sich für die Einladung.
      – Sagen Sie, warum Sie nicht kommen können.
      – Machen Sie einen Vorschlag für ein anderes Treffen.
      Schreiben Sie circa 40 Wörter. Vergessen Sie Anrede und Gruß nicht.
    task_ru: |
      Ваш коллега господин Брандт работает в фирме 25 лет. В пятницу он отмечает это праздником в саду и пригласил всех коллег. Вы не можете прийти.
      Напишите ему письмо: поблагодарите за приглашение; объясните, почему не можете прийти; предложите встретиться в другой раз.
      Около 40 слов. Не забудьте обращение и прощание. С коллегой, которого вы называете «Herr Brandt», — на Sie.
    points:
      - Bedanken Sie sich für die Einladung.
      - Sagen Sie, warum Sie nicht kommen können.
      - Machen Sie einen Vorschlag für ein anderes Treffen.
    words: [35, 50]
    structure:
      - "Обращение: Lieber Herr Brandt, (полуофициально) — после запятой письмо продолжается со строчной буквы"
      - "Пункт 1: благодарность за приглашение (+ можно поздравить)"
      - "Пункт 2: отказ и причина (Leider kann ich nicht kommen, weil …)"
      - "Пункт 3: предложение (Darf ich Sie … einladen? / Hätten Sie … Zeit?)"
      - "Прощание: Herzliche Grüße / Viele Grüße и ваше имя"
    redemittel:
      - de: Lieber Herr Brandt, / Liebe Frau Krämer,
        ru: Уважаемый господин Брандт, / Уважаемая госпожа Кремер, (полуофициально)
      - de: Liebe Mira, / Lieber Jonas,
        ru: Дорогая Мира, / Дорогой Йонас, (другу)
      - de: Vielen Dank für Ihre Einladung!
        ru: Большое спасибо за ваше приглашение!
      - de: Ich habe mich sehr über Ihre Einladung gefreut.
        ru: Я очень обрадовался(-лась) вашему приглашению.
      - de: Herzlichen Glückwunsch zum …!
        ru: Поздравляю с …!
      - de: Ich komme sehr gern.
        ru: Я с удовольствием приду.
      - de: Leider kann ich nicht kommen, weil …
        ru: К сожалению, я не смогу прийти, потому что …
      - de: Leider habe ich am Freitag schon einen Termin.
        ru: К сожалению, в пятницу у меня уже назначена встреча.
      - de: Es tut mir sehr leid, aber …
        ru: Мне очень жаль, но …
      - de: Darf ich Sie stattdessen zu einem Kaffee einladen?
        ru: Можно вместо этого пригласить вас на кофе?
      - de: Hätten Sie vielleicht nächste Woche Zeit?
        ru: Может быть, у вас будет время на следующей неделе?
      - de: Wie wäre es mit Dienstag?
        ru: Как насчёт вторника?
      - de: Soll ich etwas mitbringen?
        ru: Мне что-нибудь принести? (если вы принимаете приглашение)
      - de: Ich wünsche Ihnen ein schönes Fest!
        ru: Желаю вам хорошего праздника!
      - de: Herzliche Grüße / Viele Grüße
        ru: С сердечным приветом / С приветом
    model: |
      Lieber Herr Brandt,

      vielen Dank für Ihre Einladung und herzlichen Glückwunsch zum Jubiläum! Leider kann ich am Freitag nicht kommen, weil meine Schwester an diesem Tag heiratet. Darf ich Sie stattdessen nächste Woche zu einem Kaffee einladen? Wie wäre es mit Dienstag?

      Herzliche Grüße
      Daria Melnyk
    checklist:
      - Все три пункта раскрыты (спасибо, причина, предложение)?
      - Есть обращение, прощание и имя? После «Lieber Herr Brandt,» письмо продолжается со строчной буквы.
      - Везде одна форма обращения — Sie, Ihnen, Ihre с большой буквы?
      - После weil глагол стоит в конце предложения?
      - Порядок слов в главном предложении — глагол на позиции 2 (Leider kann ich …)?
      - Около 40 слов — не намного меньше и не намного больше?
      - "Причина звучит реалистично и коротко (одно предложение)?"

speaking:
  - id: kn-sp-1
    exam: Goethe A2 · Sprechen Teil 1
    task: "Fragen zur Person: Wortkarten"
    task_ru: Вы и партнёр по очереди тянете карточки со словом. Задайте по слову вопрос партнёру; партнёр отвечает и задаёт вопрос вам по своей карточке. Отвечайте 1–2 предложениями.
    prompts: ["Geburtstag?", "Lieblingsfest?", "Hobby?", "Sport?", "Wochenende?", "Wetter?", "Kleidung?", "Musik?"]
    model: |
      Geburtstag: Wann hast du Geburtstag? – Am 14. März. Ich feiere meistens mit meiner Familie.
      Lieblingsfest: Was ist dein Lieblingsfest? – Silvester, weil ich gern Feuerwerk sehe.
      Hobby: Was machst du in deiner Freizeit? – Ich spiele Gitarre und singe in einem Chor.
      Sport: Machst du gern Sport? – Ja, ich gehe zweimal pro Woche joggen.
      Wochenende: Was hast du letztes Wochenende gemacht? – Ich habe mit Freunden eine Radtour gemacht.
      Wetter: Welches Wetter magst du am liebsten? – Ich mag es warm und sonnig, aber nicht zu heiß.
      Kleidung: Was ziehst du zu einer Hochzeit an? – Einen dunklen Anzug, aber ohne Krawatte.
      Musik: Welche Musik hörst du gern? – Am liebsten Jazz.

  - id: kn-sp-2
    exam: Goethe A2 · Sprechen Teil 2
    task: "Über das eigene Leben erzählen: Wie feiern Sie Feste?"
    task_ru: Расскажите о себе по карточке (около 1–2 минут). На карточке вопрос и 5 подсказок — затроньте каждую. Экзаменатор потом задаст один-два вопроса.
    prompts: ["Welches Fest?", "Wann und wo?", "Mit wem?", "Essen und Trinken?", "Geschenke?"]
    model: |
      Mein Lieblingsfest ist Neujahr. In meiner Heimat ist das das wichtigste Fest im Jahr, noch wichtiger als Weihnachten. Wir feiern am 31. Dezember bei meinen Eltern. Meistens kommen zehn oder zwölf Personen: meine Geschwister, meine Großeltern und ein paar Freunde. Wir kochen den ganzen Tag, denn es gibt viele Salate, Fleisch und natürlich eine große Torte. Um Mitternacht stoßen wir mit Sekt an und gehen nach draußen, weil es dann ein Feuerwerk gibt. Die Kinder bekommen Geschenke, die Erwachsenen meistens nur kleine Überraschungen. Hier in Österreich feiere ich Silvester mit meinen Kollegen, aber am liebsten bin ich an diesem Tag bei meiner Familie.

  - id: kn-sp-3
    exam: Goethe A2 · Sprechen Teil 3
    task: "Gemeinsam etwas planen: ein Abschiedsfest für die Kursleiterin"
    task_ru: Ваша преподавательница скоро уходит из языковой школы. Вы и партнёр хотите устроить для неё прощальный праздник в субботу. У каждого свой календарь на этот день. Найдите время, когда вы оба свободны, и распределите задачи (место, еда, подарок, приглашения).
    prompts: ["Ihr Kalender am Samstag: 8–12 Uhr Arbeit", "13 Uhr Mittagessen mit Oma", "17 Uhr Fußballtraining", "Wann?", "Wo feiern?", "Wer kauft das Geschenk?", "Essen und Getränke?", "Wer lädt die anderen ein?"]
    model: |
      A: Wann hast du am Samstag Zeit? Ich arbeite bis zwölf, und um eins esse ich mit meiner Oma.
      B: Am Vormittag habe ich einen Arzttermin, aber ab zwei bin ich frei.
      A: Um fünf habe ich Fußballtraining. Wie wäre es um drei?
      B: Um drei ist gut. Wo feiern wir? Im Kursraum oder lieber im Park?
      A: Lieber im Park, das Wetter soll schön werden. Wenn es regnet, gehen wir ins Café neben der Schule.
      B: Gute Idee. Wer kümmert sich um das Geschenk?
      A: Das mache ich. Ich schlage vor, wir kaufen einen Blumenstrauß und einen Gutschein für eine Buchhandlung.
      B: Einverstanden. Dann bringe ich Kuchen und Getränke mit. Und wer lädt die anderen ein?
      A: Ich schreibe heute Abend in unsere Gruppe.
      B: Super, dann ist alles klar!

test:
  - type: choice
    q: Ich freue mich schon ___ das Wochenende.
    options: [auf, über, für]
    answer: auf
    why: Выходные ещё впереди → sich freuen auf + Akk.
  - type: choice
    q: Die Luftballons hängen schon ___ Wand.
    options: [an der, an die, am]
    answer: an der
    why: "hängen = висеть (wo?) → Dativ: an der Wand."
  - type: gap
    q: Leg die Geschenke bitte auf ___ Tisch. (der)
    answer: [den]
    why: "legen → wohin? → Akkusativ: den Tisch."
  - type: choice
    q: Im Sommer ist es in Köln ___ als im Winter.
    options: [wärmer, wärmster, mehr warm]
    answer: wärmer
    why: Komparativ + als.
  - type: gap
    q: Ich tanze gern, aber am ___ singe ich Karaoke. (gern)
    answer: [liebsten]
    why: gern → lieber → am liebsten.
  - type: choice
    q: Zur Hochzeit trägt Ben einen ___ Anzug.
    options: [dunklen, dunkle, dunkler]
    answer: dunklen
    why: "Akk. m → -en; dunkel теряет e: dunklen."
  - type: table
    title: Adjektivendungen
    head: [Nomen, Endung]
    rows:
      - [ein schön__ Fest (Nom.), "?es"]
      - [mit einer nett__ Freundin, "?en"]
      - [der neu__ Hut (Nom.), "?e"]
      - [einen warm__ Schal, "?en"]
  - type: gap
    q: Wir treffen ___ um acht vor dem Dom.
    answer: [uns]
    why: wir → uns.
  - type: order
    answer: Ich kann nicht kommen, weil ich arbeiten muss.
    tokens: ["Ich kann nicht kommen,", weil, ich, arbeiten, muss]
    ru: Я не смогу прийти, потому что мне нужно работать.
  - type: choice
    q: Es regnet, ___ fällt das Open-Air-Kino aus.
    options: [deshalb, weil, denn]
    answer: deshalb
    why: Глагол сразу после пропуска → deshalb.
  - type: choice
    q: In Köln sagt man „Karneval“. Wie heißt das Fest in Österreich?
    ru: В Кёльне говорят «Karneval». Как этот праздник называется в Австрии?
    options: [Fasching, Oktoberfest, Silvester]
    answer: Fasching
  - type: choice
    q: Eine Wienerin sagt „heuer“. Was bedeutet das?
    ru: Венка говорит «heuer». Что это значит?
    options: [in diesem Jahr, heute, im Herbst]
    answer: in diesem Jahr
