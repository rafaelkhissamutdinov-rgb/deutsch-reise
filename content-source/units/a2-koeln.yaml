        ru: Я дарю сестре красивую цепочку.

  # ------------------------------------------------------------------
  - id: kn-g-reflexiv
    title: Reflexive Verben
    title_ru: Возвратные глаголы
    terms:
      - t: reflexives Verb
        ru: возвратный глагол — глагол с sich (sich freuen, sich treffen)
      - t: Reflexivpronomen
        ru: возвратное местоимение (mich, dich, sich, uns, euch …) — «себя», часто как русское -ся
      - t: Akkusativ (Akk.)
        ru: винительный падеж; обычная форма возвратного местоимения (ich freue mich)
      - t: Dativ (Dat.)
        ru: дательный падеж; форма местоимения, если в предложении есть ещё одно дополнение (ich wasche mir die Hände)
      - t: Rektion
        ru: управление — какой предлог и падеж требует глагол (sich freuen auf + Akk.)
      - t: Infinitiv
        ru: начальная форма глагола (sich treffen)
      - t: Perfekt
        ru: прошедшее время (hat … gefreut); у возвратных глаголов — с haben
      - t: Imperativ
        ru: повелительное наклонение (Beeil dich!)
    meaning: |
      У возвратного глагола есть местоимение, которое относится к тому же лицу, что и подлежащее: Ich freue mich. — Я радуюсь.
      Местоимение меняется по лицу: ich → mich, du → dich, er/sie/es → sich, wir → uns, ihr → euch, sie/Sie → sich.
      Обычно оно в Akkusativ. Если в предложении есть ещё одно дополнение в Akkusativ (часть тела, одежда, вещь), местоимение переходит в Dativ: Ich wasche mir die Hände. Ich wünsche mir ein Fahrrad. Различаются только ich (mich/mir) и du (dich/dir).
      Место: в главном предложении — сразу после спрягаемого глагола: Ich treffe mich heute mit Ali. Morgen treffen wir uns.
      Русское -ся и немецкое sich совпадают не всегда: учиться — lernen (без sich), отдыхать — sich ausruhen (с sich).
      Многие такие глаголы требуют предлог: sich freuen auf + Akk. (на будущее), sich freuen über + Akk. (о том, что уже есть), sich interessieren für + Akk., sich treffen mit + Dat.
      Perfekt — всегда с haben: Ich habe mich sehr gefreut.
    steps:
      - de: Ich freue mich auf deine Party!
        ru: ich → mich; auf — вечеринка ещё будет.
      - de: Danke für die Blumen, ich freue mich sehr darüber.
        ru: über — подарок уже здесь.
      - de: Interessierst du dich für Fußball?
        ru: du → dich; sich interessieren für + Akk.
      - de: Wir treffen uns um acht am Dom.
        ru: wir → uns, сразу после глагола.
      - de: Am Sonntag ruht sich Herr Schmitz aus.
        ru: При обратном порядке sich обычно стоит до существительного-подлежащего.
      - de: Ich ziehe mir das Kostüm an.
        ru: Есть ещё дополнение (das Kostüm) → mir (Dativ).
      - de: Beeil dich! Der Umzug beginnt gleich.
        ru: "Imperativ: местоимение остаётся (dich)."
      - de: Gestern habe ich mich mit Ali verabredet.
        ru: Perfekt с haben.
    table:
      head: [Person, Akkusativ, Dativ, Beispiel]
      rows:
        - [ich, mich, mir, Ich freue mich. / Ich wasche mir die Hände.]
        - [du, dich, dir, "Freust du dich? / Wünschst du dir etwas?"]
        - [er / sie / es, sich, sich, Er ärgert sich.]
        - [wir, uns, uns, Wir treffen uns.]
        - [ihr, euch, euch, Beeilt euch!]
        - [sie / Sie, sich, sich, "Interessieren Sie sich für Musik?"]
    exam: |
      В Schreiben A2 (ответ на приглашение) часто нужно: Ich freue mich auf …, Vielen Dank, ich habe mich sehr gefreut. В Sprechen Teil 3: Wann treffen wir uns? Wer kümmert sich um die Getränke?
      В Sprechen Teil 1–2 — рассказ о хобби: Ich interessiere mich für …
    traps:
      - "auf ≠ über: Ich freue mich auf den Urlaub (он будет). Ich freue mich über das Geschenk (оно уже есть)."
      - "Не забывайте местоимение: «Ich freue» без mich — ошибка."
      - "Не «Ich freue sich» — местоимение меняется по лицу: ich → mich."
      - "Dativ, если есть второе дополнение: Ich wasche mir die Haare (не «mich die Haare»)."
      - "Русское -ся ≠ sich: Ich lerne Deutsch (учусь — без sich); Ich ruhe mich aus (отдыхаю — с sich)."
    exercises:
      - type: choice
        q: Ich freue ___ auf die Party.
        options: [mich, mir, sich]
        answer: mich
        why: ich → mich (Akkusativ).
      - type: choice
        q: Freust du ___ über das Geschenk?
        options: [dich, dir, sich]
        answer: dich
        why: du → dich.
      - type: choice
        q: Wir treffen ___ um acht am Dom.
        options: [uns, euch, sich]
        answer: uns
        why: wir → uns.
      - type: choice
        q: Ich wasche ___ vor dem Essen die Hände.
        options: [mir, mich, sich]
        answer: mir
        why: Есть ещё дополнение (die Hände) → Dativ mir.
      - type: choice
        q: Interessiert ihr ___ für Karneval?
        options: [euch, sich, uns]
        answer: euch
        why: ihr → euch.
      - type: choice
        q: Anna freut sich schon ___ ihren Geburtstag nächste Woche.
        options: [auf, über, für]
        answer: auf
        why: День рождения ещё будет → auf.
      - type: choice
        q: Herr Weber ärgert sich ___ das schlechte Wetter.
        options: [über, auf, mit]
        answer: über
        why: sich ärgern über + Akk.
      - type: gap
        q: Meine Eltern haben ___ sehr über deinen Besuch gefreut.
        answer: [sich]
        why: sie (Pl.) → sich.
      - type: gap
        q: Zieh ___ warm an, es schneit!
        answer: [dich]
        why: "Imperativ для du: Zieh dich an!"
      - type: gap
        q: Ich wünsche ___ zum Geburtstag ein Fahrrad.
        answer: [mir]
        why: Есть дополнение (ein Fahrrad) → Dativ mir.
      - type: gap
        q: Wir haben ___ mit Ali zum Joggen verabredet.
        answer: [uns]
        why: wir → uns.
      - type: table
        title: Reflexivpronomen
        head: [Person, Akkusativ, Dativ]
        rows:
          - [ich, "?mich", "?mir"]
          - [du, "?dich", "?dir"]
          - [er / sie / es, "?sich", "?sich"]
          - [wir, "?uns", "?uns"]
          - [ihr, "?euch", "?euch"]
          - [sie / Sie, "?sich", "?sich"]
      - type: order
        answer: Wir treffen uns am Samstag vor dem Kino.
        tokens: [Wir, treffen, uns, am Samstag, vor dem Kino]
        also: [Am Samstag treffen wir uns vor dem Kino.]
        ru: Мы встречаемся в субботу перед кинотеатром.
      - type: order
        answer: Interessierst du dich für Musik?
        tokens: [Interessierst, du, dich, für Musik]
        ru: Ты интересуешься музыкой?

  # ------------------------------------------------------------------
  - id: kn-g-weil
    title: weil, denn und deshalb
    title_ru: Причина и следствие — weil, denn, deshalb
    terms:
      - t: Hauptsatz
        ru: главное предложение; спрягаемый глагол на позиции 2
      - t: Nebensatz
        ru: придаточное предложение; спрягаемый глагол в самом конце
      - t: Konjunktion
        ru: союз (weil, denn, und, aber …)
      - t: Adverb
        ru: наречие; deshalb занимает позицию 1, после него сразу глагол
      - t: Position 0
        ru: место перед предложением, которое не считается (und, aber, oder, denn); после него обычный порядок слов
      - t: konjugiertes Verb
        ru: спрягаемый глагол — глагол в форме лица (bin, muss, hat)
      - t: Modalverb
        ru: модальный глагол (können, müssen, wollen …)
      - t: trennbares Verb
        ru: глагол с отделяемой приставкой (an·kommen, mit·bringen)
      - t: Grund / Folge
        ru: причина / следствие
    meaning: |
      Причину можно назвать тремя способами.
      weil — «потому что»: открывает Nebensatz, спрягаемый глагол уходит в конец: Ich komme nicht, weil ich krank bin.
      denn — «потому что, ведь»: открывает обычное главное предложение, порядок слов не меняется: Ich komme nicht, denn ich bin krank. denn не может стоять в начале всей фразы.
      deshalb — «поэтому»: называет не причину, а следствие. Это наречие на позиции 1, глагол сразу после него: Ich bin krank, deshalb komme ich nicht.
      В Nebensatz с weil: модальный глагол — в самом конце (…, weil ich arbeiten muss), отделяемая приставка не отделяется (…, weil der Zug um acht ankommt), в Perfekt hat/ist — в конце (…, weil ich den Bus verpasst habe).
      Если Nebensatz стоит первым, главное предложение начинается с глагола: Weil es regnet, bleiben wir zu Hause.
      Перед weil, denn и deshalb (между двумя предложениями) ставится запятая.
    steps:
      - de: Ich bleibe heute zu Hause, weil ich krank bin.
        ru: weil → bin в конце.
      - de: Ich bleibe heute zu Hause, denn ich bin krank.
        ru: denn → обычный порядок, bin на позиции 2.
      - de: Ich bin krank, deshalb bleibe ich heute zu Hause.
        ru: deshalb → глагол bleibe сразу после него, потом подлежащее.
      - de: Ich kann nicht kommen, weil ich am Samstag arbeiten muss.
        ru: Модальный глагол muss — в самом конце.
      - de: Ich hole dich ab, weil dein Zug spät ankommt.
        ru: Отделяемый глагол в Nebensatz пишется слитно в конце — ankommt.
      - de: Weil es regnet, feiern wir drinnen.
        ru: Nebensatz первым → главное предложение начинается с глагола (feiern).
    table:
      head: [Wort, Satzart, Position des Verbs, Beispiel]
      rows:
        - [weil, Nebensatz, am Ende, "Ich komme nicht, weil ich krank bin."]
        - [denn, Hauptsatz, "Position 2 (denn = Position 0)", "Ich komme nicht, denn ich bin krank."]
        - [deshalb, Hauptsatz, "Position 2 (deshalb = Position 1)", "Ich bin krank, deshalb komme ich nicht."]
    exam: |
      В Goethe A2 Schreiben Teil 2 (ответ на приглашение) часто нужно объяснить, почему вы придёте или не придёте: Leider kann ich nicht kommen, weil … Это типичный пункт задания (Grund nennen).
      В Sprechen Teil 2 и 3 — обоснование: Ich feiere gern zu Hause, weil … / Samstag ist besser, denn …
    traps:
      - "После weil глагол в конце: weil ich keine Zeit habe (не «weil ich habe keine Zeit»). В разговорной речи немцы иногда так говорят, но на экзамене это ошибка."
      - "После denn порядок обычный: denn ich habe keine Zeit."
      - "deshalb ≠ weil: deshalb называет следствие. Es regnet, deshalb bleiben wir zu Hause (не «deshalb wir bleiben»)."
      - "Модальный глагол в weil-предложении — последним: weil ich arbeiten muss (не «weil ich muss arbeiten»)."
      - "Запятая перед weil, denn, deshalb обязательна."
    exercises:
      - type: choice
        q: Welcher Satz ist richtig?
        options: ["Ich bleibe zu Hause, weil ich bin krank.", "Ich bleibe zu Hause, weil ich krank bin.", "Ich bleibe zu Hause, weil krank ich bin."]
        answer: Ich bleibe zu Hause, weil ich krank bin.
        why: weil → спрягаемый глагол в конце.
      - type: choice
        q: Ich gehe nicht mit, ___ ich habe keine Zeit.
        options: [denn, weil, deshalb]
        answer: denn
        why: После пропуска обычный порядок (ich habe) → denn.
      - type: choice
        q: Es regnet, ___ bleiben wir zu Hause.
        options: [deshalb, weil, denn]
        answer: deshalb
        why: Глагол сразу после пропуска (bleiben wir) → deshalb.
      - type: choice
        q: Lisa ist glücklich, ___ sie eine Einladung bekommen hat.
        options: [weil, denn, deshalb]
        answer: weil
        why: Глагол hat в конце → weil.
      - type: choice
        q: Weil das Wetter schön ist, ___.
        options: [machen wir ein Picknick, wir machen ein Picknick, ein Picknick wir machen]
        answer: machen wir ein Picknick
        why: После Nebensatz главное предложение начинается с глагола.
      - type: choice
        q: Ich komme später, weil ich noch ein Geschenk ___.
        options: [kaufen muss, muss kaufen, kaufe muss]
        answer: kaufen muss
        why: Модальный глагол — в самом конце.
      - type: gap
        q: Ich kann nicht kommen, weil ich am Samstag arbeiten ___. (müssen)
        answer: [muss]
        why: ich → muss, в конце предложения.
      - type: gap
        q: Wir kommen später, weil unser Zug Verspätung ___. (haben)
        answer: [hat]
        why: weil → глагол в конце.
      - type: gap
        q: Er ist müde, ___ er hat die ganze Nacht getanzt. (weil / denn)
        answer: [denn]
        why: Порядок слов обычный (er hat) → denn.
      - type: gap
        q: Morgen ist ein Feiertag, ___ sind die Geschäfte geschlossen. (weil / deshalb)
        answer: [deshalb]
        why: Глагол sind сразу после пропуска → deshalb.
      - type: order
        answer: Ich freue mich, weil du kommst.
        tokens: ["Ich freue mich,", weil, du, kommst]
        ru: Я рад(а), что ты придёшь.
      - type: order
        answer: Ich nehme einen Schirm mit, weil es regnet.
        tokens: ["Ich nehme einen Schirm mit,", weil, es, regnet]
        ru: Я беру с собой зонт, потому что идёт дождь.
      - type: order
        answer: Der Bus ist weg, deshalb nehmen wir ein Taxi.
        tokens: ["Der Bus ist weg,", deshalb, nehmen, wir, ein Taxi]
        ru: Автобус ушёл, поэтому мы берём такси.
      - type: order
        answer: Ich bin nervös, weil meine Eltern heute ankommen.
        tokens: ["Ich bin nervös,", weil, meine Eltern, heute, ankommen]
        ru: Я нервничаю, потому что сегодня приезжают мои родители.

dialogues:
  # ------------------------------------------------------------------
  - id: kn-d-einladung
    title: Eine Einladung zum Geburtstag
    title_ru: Приглашение на день рождения
    situation_ru: Ваша подруга Мира из языковой школы звонит вам. В субботу у неё день рождения, и она приглашает вас. Примите приглашение, договоритесь, что принести, и спросите, что ей подарить.
    partner: Freundin Mira
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Hallo! Du, hast du am Samstagabend schon etwas vor?
        ru: Привет! Слушай, у тебя есть планы на субботний вечер?
        options:
          - t: Nein, noch nicht. Warum fragst du?
            ru: Нет, пока нет. А почему ты спрашиваешь?
            next: n2
          - t: Am Samstag? Nein, da habe ich Zeit. Was ist denn los?
            ru: В субботу? Нет, тогда у меня есть время. А что такое?
            next: n2
          - t: Nein, ich habe nichts vor nicht.
            ru: Нет, у меня нет никаких не планов.
            next: n2
            ok: false
            fb: Двойного отрицания в немецком нет. Правильно «Nein, ich habe noch nichts vor.»
      n2:
        say: Ich habe am Samstag Geburtstag und mache eine kleine Party bei mir zu Hause, in Ehrenfeld. Ab sieben Uhr. Hast du Lust?
        ru: В субботу у меня день рождения, и я устраиваю небольшую вечеринку дома, в Эренфельде. С семи часов. Хочешь прийти?
        options:
          - t: Ja, sehr gern! Danke für die Einladung. Ich freue mich schon darauf.
            ru: Да, с большим удовольствием! Спасибо за приглашение. Я уже жду этого с нетерпением.
            next: n3
          - t: Oh, wie schön! Ich komme gern.
            ru: О, как здорово! Я с удовольствием приду.
            next: n3
          - t: Ja, gern! Ich freue mich über deine Party.
            ru: Да, с удовольствием! Я радуюсь твоей вечеринке.
            next: n3
            ok: false
            fb: Вечеринка ещё впереди, поэтому auf, а не über — «Ich freue mich auf deine Party.»
      n3:
        say: Super! Ich mache ein Buffet, und jeder bringt etwas mit. Das machen wir bei uns immer so.
        ru: Отлично! Я делаю шведский стол, и каждый что-нибудь приносит. У нас такая традиция.
        options:
          - t: Gute Idee! Was soll ich mitbringen?
            ru: Хорошая идея! Что мне принести?
            next: n4
          - t: Kein Problem. Soll ich vielleicht einen Salat mitbringen?
            ru: Без проблем. Может, мне принести салат?
            next: n4
          - t: Okay. Was soll ich bringen mit?
            ru: Хорошо. Что мне принести?
            next: n4
            ok: false
            fb: После модального глагола инфинитив стоит в конце целиком, приставка не отделяется — «Was soll ich mitbringen?»
      n4:
        say: Salate haben wir schon genug. Vielleicht einen Nachtisch? Dein Apfelkuchen war letztes Mal so lecker!
        ru: Салатов у нас уже хватает. Может, десерт? Твой яблочный пирог в прошлый раз был такой вкусный!
        options:
          - t: Klar, dann backe ich wieder einen Apfelkuchen.
            ru: Конечно, тогда я снова испеку яблочный пирог.
            next: n5
          - t: Gern! Wie viele Gäste kommen denn? Dann backe ich zwei Kuchen.
            ru: С удовольствием! А сколько будет гостей? Тогда я испеку два пирога.
            next: n5
          - t: Gut, ich mache ein leckeres Kuchen.
            ru: Хорошо, я сделаю вкусный пирог.
            next: n5
            ok: false
            fb: der Kuchen — мужской род, в Akkusativ после ein → einen leckeren Kuchen.
      n5:
        say: Wir sind ungefähr fünfzehn Leute. Und später gehen wir vielleicht noch tanzen.
        ru: Нас будет человек пятнадцать. А потом мы, может быть, ещё пойдём танцевать.
        options:
          - t: Super, ich tanze sehr gern!
            ru: Супер, я очень люблю танцевать!
            next: n6
          - t: Ich tanze nicht so gern, aber ich komme bestimmt mit.
            ru: Я не очень люблю танцевать, но обязательно пойду с вами.
            next: n6
          - t: Toll, Tanzen mache ich am gernsten!
            ru: Здорово, танцевать я люблю больше всего!
            next: n6
            ok: false
            fb: "Формы «am gernsten» нет: gern → lieber → am liebsten. Правильно «Am liebsten tanze ich!»"
      n6:
        say: Das wird bestimmt lustig. Aber nachts fährt die Bahn nicht so oft. Wie kommst du dann nach Hause?
        ru: Будет весело. Но ночью электрички ходят не так часто. Как ты потом доберёшься домой?
        options:
          - t: Ich nehme einfach ein Taxi.
            ru: Я просто возьму такси.
            next: n7
          - t: Kann ich vielleicht bei dir übernachten?
            ru: Можно мне, может быть, у тебя переночевать?
            next: n7
          - t: Ich fahre mit dem Fahrrad, weil es ist nicht weit.
            ru: Я поеду на велосипеде, потому что это недалеко.
            next: n7
            ok: false
            fb: После weil глагол в конце — «…, weil es nicht weit ist.»
      n7:
        say: Okay, das klären wir dann. Hast du noch eine Frage?
        ru: Ладно, это решим потом. У тебя ещё есть вопрос?
        options:
          - t: Ja – was wünschst du dir eigentlich zum Geburtstag?
            ru: Да — а что ты, собственно, хочешь на день рождения?
            next: end
          - t: Nein, alles klar. Dann bis Samstag!
            ru: Нет, всё понятно. Тогда до субботы!
            next: end
          - t: Ja – was wünschst du dich zum Geburtstag?
            ru: Да — что ты хочешь на день рождения?
            next: end
            ok: false
            fb: Есть ещё дополнение (was), поэтому местоимение в Dativ — «Was wünschst du dir?»
      end:
        say: Schön, dass du kommst! Ich schicke dir gleich noch meine Adresse. Und bring bitte kein großes Geschenk mit – Hauptsache, du bist da! Bis Samstag!
        ru: Здорово, что ты придёшь! Я сразу пришлю тебе адрес. И не приноси, пожалуйста, большой подарок — главное, что ты будешь! До субботы!
        end: true

  # ------------------------------------------------------------------
  - id: kn-d-karneval
    title: Rosenmontag in Köln
    title_ru: Розовый понедельник в Кёльне
    situation_ru: Розовый понедельник, главный день кёльнского карнавала. Вы только что приехали в Кёльн и звоните другу Йонасу — он местный. Узнайте, где встретиться, как туда дойти и что с костюмом. (В Австрии этот праздник называется Fasching, в Майнце — Fastnacht.)
    partner: Freund Jonas
    voice: de-DE
    start: n1
    nodes:
      n1:
        say: Kölle Alaaf! Na, bist du schon in Köln?
        ru: Кёльн, алаф! Ну что, ты уже в Кёльне?
        options:
          - t: Alaaf! Ja, ich bin gerade am Hauptbahnhof angekommen.
            ru: Алаф! Да, я только что приехал(а) на главный вокзал.
            next: n2
          - t: Ja! Ich stehe direkt vor dem Dom. Hier ist es so voll!
            ru: Да! Я стою прямо перед собором. Тут столько народу!
            next: n2
          - t: Ja, ich bin in den Hauptbahnhof.
            ru: Да, я на главном вокзале.
            next: n2
            ok: false
            fb: Где? → Dativ — «Ich bin im Hauptbahnhof / am Hauptbahnhof.» Akkusativ (in den) — только для направления «куда?».
      n2:
        say: Super! Und hast du ein Kostüm? Heute geht hier niemand ohne Kostüm auf die Straße!
        ru: Супер! А у тебя есть костюм? Сегодня здесь никто не выходит на улицу без костюма!
        options:
          - t: Klar! Ich habe mich als Pirat verkleidet.
            ru: Конечно! Я переоделся(-лась) пиратом.
            next: n3
          - t: Nein, leider nicht. Wo kann ich schnell eins kaufen?
            ru: Нет, к сожалению. Где можно быстро купить?
            next: n3
          - t: Ja, ich habe als Pirat verkleidet.
            ru: Да, я переоделся пиратом.
            next: n3
            ok: false
            fb: sich verkleiden — возвратный глагол — «Ich habe mich als Pirat verkleidet.»
      n3:
        say: Egal – ich habe noch eine grüne Perücke für dich. Wir treffen uns am besten am Heumarkt. Weißt du, wie du dahin kommst?
        ru: Неважно — у меня есть для тебя ещё зелёный парик. Встретимся лучше всего на Хоймаркте. Знаешь, как туда добраться?
        options:
          - t: Nein, keine Ahnung. Wie komme ich zum Heumarkt?
            ru: Нет, понятия не имею. Как мне пройти на Хоймаркт?
            next: n4
          - t: Ungefähr. Ist das weit vom Dom?
            ru: Примерно. Это далеко от собора?
            next: n4
          - t: Nein. Wo komme ich zum Heumarkt?
            ru: Нет. Где мне пройти на Хоймаркт?
            next: n4
            ok: false
            fb: Дорогу спрашивают с wie — «Wie komme ich zum Heumarkt?»
      n4:
        say: Das sind nur zehn Minuten zu Fuß. Geh am Dom vorbei Richtung Rhein und dann immer geradeaus durch die Altstadt.
        ru: Это всего десять минут пешком. Пройди мимо собора в сторону Рейна, а потом всё время прямо через Старый город.
        options:
          - t: Okay, danke! Und wo genau treffen wir uns?
            ru: Хорошо, спасибо! А где именно мы встречаемся?
            next: n5
          - t: Alles klar, das finde ich. Wo stehst du genau?
            ru: Всё понятно, найду. Где ты стоишь?
            next: n5
          - t: Okay. Ich gehe an den Dom vorbei.
            ru: Хорошо. Я пройду мимо собора.
            next: n5
            ok: false
            fb: an … vorbei — с Dativ — «Ich gehe am Dom vorbei.»
      n5:
        say: Ich stehe direkt neben der großen Bühne. Ich trage einen roten Hut und eine gestreifte Jacke.
        ru: Я стою прямо рядом с большой сценой. На мне красная шляпа и полосатая куртка.
        options:
          - t: Gut, einen roten Hut und eine gestreifte Jacke. Ich finde dich!
            ru: Хорошо, красная шляпа и полосатая куртка. Я тебя найду!
            next: n6
          - t: Okay. Und wann kommt der Umzug bei euch vorbei?
            ru: Хорошо. А когда шествие пройдёт мимо вас?
            next: n6
          - t: Okay, ich suche einen Mann mit ein rote Hut.
            ru: Хорошо, я ищу мужчину в красной шляпе.
            next: n6
            ok: false
            fb: После mit — Dativ — «mit einem roten Hut».
      n6:
        say: Der Zug kommt gegen zwölf am Heumarkt vorbei. Bring eine Tasche mit – für die Kamelle!
        ru: Шествие пройдёт по Хоймаркту около двенадцати. Возьми с собой сумку — для «камелле»!
        options:
          - t: Kamelle? Was ist das denn?
            ru: Камелле? А что это?
            next: n7
          - t: Klar, ich habe meinen Rucksack dabei.
            ru: Конечно, у меня с собой рюкзак.
            next: n7
          - t: Ich freue mich schon über den Umzug!
            ru: Я уже радуюсь шествию!
            next: n7
            ok: false
            fb: Шествие ещё впереди — нужен auf — «Ich freue mich schon auf den Umzug!»
      n7:
        say: Kamelle sind Bonbons. Die Leute auf den Wagen werfen Süßigkeiten und Blumen in die Menge. Du musst nur laut „Kamelle!“ rufen.
        ru: Камелле — это конфеты. Люди на платформах бросают в толпу сладости и цветы. Тебе нужно только громко кричать «Камелле!».
        options:
          - t: Lustig! In Wien heißt das Fest übrigens Fasching. Wie lange dauert der Umzug?
            ru: Забавно! В Вене этот праздник, кстати, называется Фашинг. Сколько длится шествие?
            next: end
          - t: Super, das mache ich! Bis gleich!
            ru: Отлично, так и сделаю! До встречи!
            next: end
          - t: Okay, ich rufe so lauter wie möglich!
            ru: Хорошо, я буду кричать как можно громче!
            next: end
            ok: false
            fb: "В конструкции so … wie möglich прилагательное стоит в исходной форме: «so laut wie möglich»."
      end:
        say: Der Umzug dauert ein paar Stunden. Danach feiern wir in einer Kneipe weiter. Also, bis gleich am Heumarkt – Alaaf!
        ru: Шествие длится несколько часов. Потом мы продолжим праздновать в пивной. Ну, до встречи на Хоймаркте — алаф!
        end: true

texts:
  # ------------------------------------------------------------------
  - id: kn-t-forum
    kind: Forum
    title: Wie feiert ihr Geburtstag?
    text: |
      Forum „Neu in Köln“ › Freizeit › Wie feiert ihr Geburtstag?

      Tomasz, 31:
      Ich feiere meinen Geburtstag nicht gern groß. Meistens gehe ich mit zwei oder drei Freunden in ein gutes Restaurant, danach trinken wir noch etwas in einer Kneipe am Rhein. Große Partys finde ich anstrengend, weil man dort mit niemandem richtig sprechen kann.

      Oksana, 26:
      Bei mir ist es ganz anders: Ich lade immer mindestens zwanzig Leute ein! Meine Wohnung ist ziemlich klein, deshalb wird es immer sehr eng, aber die Stimmung ist super. Jeder bringt etwas für das Buffet mit, und wir tanzen bis zum Morgen. Meine Nachbarn lade ich natürlich auch ein – dann gibt es keinen Ärger.

      Felix, 45:
      Ich habe im Februar Geburtstag, oft genau an Karneval. Deshalb gibt es bei mir keine normale Party: Meine Familie und ich verkleiden uns und feiern auf der Straße. Letztes Jahr war ich ein Cowboy und meine Frau eine Katze. Geschenke wünsche ich mir nicht, aber Kamelle vom Umzug nehme ich gern!
    glossary:
      mindestens: как минимум
      eng: тесно
      der Ärger: неприятности; раздражение
      die Kneipe: пивной бар, паб
      die Kamelle: конфеты, которые бросают с карнавальных платформ (кёльнский диалект)
    questions:
      - type: choice
        q: Wer feiert am liebsten in einer kleinen Gruppe?
        ru: Кто больше всего любит праздновать в маленькой компании?
        options: [Tomasz, Oksana, Felix]
        answer: Tomasz
      - type: choice
        q: Wer lädt auch die Nachbarn ein?
        ru: Кто приглашает и соседей?
        options: [Tomasz, Oksana, Felix]
        answer: Oksana
      - type: choice
        q: Wer feiert den Geburtstag im Kostüm?
        ru: Кто празднует день рождения в костюме?
        options: [Tomasz, Oksana, Felix]
        answer: Felix
      - type: tf
        q: Tomasz findet große Partys anstrengend.
        ru: Томаш считает большие вечеринки утомительными.
        answer: true
      - type: tf
        q: Oksana hat eine große Wohnung.
        ru: У Оксаны большая квартира.
        answer: false
      - type: tf
        q: Felix wünscht sich jedes Jahr ein Geschenk.
        ru: Феликс каждый год хочет подарок.
        answer: false

  # ------------------------------------------------------------------
  - id: kn-t-programm
    kind: Anzeige
    title: Wochenende in Köln – Veranstaltungstipps
    text: |
      Was ist los in Köln? Unsere Tipps für das Wochenende

      FREITAG
      19.30 Uhr · Rheinpark: Open-Air-Kino. Heute läuft eine französische Komödie mit deutschen Untertiteln. Eintritt 9 Euro. Bitte bringen Sie eine Decke mit. Bei Regen fällt die Vorstellung aus.

      SAMSTAG
      10 bis 18 Uhr · Altstadt: großer Flohmarkt am Rheinufer. Über 200 Stände mit Kleidung, Büchern und alten Möbeln.
      15 Uhr · Ehrenfeld: Straßenfest „Bunte Veedel“ mit Musik aus aller Welt, internationalem Essen und einem Programm für Kinder. Eintritt frei!
      20 Uhr · Philharmonie: Konzert des Kölner Jugendorchesters. Karten ab 15 Euro, für Schüler und Studenten die Hälfte.

      SONNTAG
      11 Uhr · Dom: Führung „Der Dom von oben“. Über 500 Stufen bis zur Aussicht auf fast 100 Meter Höhe! Treffpunkt am Haupteingang. Nicht für Kinder unter acht Jahren. Bitte tragen Sie bequeme Schuhe.
      14 Uhr · Rheinufer: Schifffahrt auf dem Rhein mit Kaffee und Kuchen an Bord. Dauer: circa drei Stunden. Anmeldung bis Freitag im Reisebüro am Bahnhof.
    glossary:
      Was ist los?: Что происходит? (какие мероприятия)
      die Untertitel: субтитры
      die Decke: плед, покрывало
      aus·fallen: отменяться, не состояться
      der Flohmarkt: блошиный рынок
      der Stand: прилавок, палатка
      das Veedel: район, квартал (кёльнский диалект; = das Viertel)
      die Hälfte: половина
      die Stufe: ступенька
      der Treffpunkt: место встречи
      die Schifffahrt: прогулка на теплоходе
      an Bord: на борту
      die Anmeldung: запись, регистрация
    questions:
      - type: tf
        q: Das Kino im Rheinpark findet auch bei Regen statt.
        ru: Кинопоказ в Рейнпарке проходит и в дождь.
        answer: false
      - type: choice
        q: Wo kann man alte Möbel kaufen?
        ru: Где можно купить старую мебель?
        options: [auf dem Flohmarkt, auf dem Straßenfest, in der Philharmonie]
        answer: auf dem Flohmarkt
      - type: choice
        q: Eine Studentin möchte ins Konzert. Wie viel kostet die Karte mindestens?
        ru: Студентка хочет пойти на концерт. Сколько стоит билет минимум?
        options: ["7,50 Euro", "15 Euro", "30 Euro"]
        answer: "7,50 Euro"
      - type: tf
        q: Für das Straßenfest in Ehrenfeld muss man nichts bezahlen.
        ru: За уличный праздник в Эренфельде платить не нужно.
        answer: true
      - type: choice
        q: Familie Novak hat eine Tochter (6 Jahre). Welche Veranstaltung ist nicht für die ganze Familie?
        ru: У семьи Новак дочь шести лет. Какое мероприятие не подходит для всей семьи?
        options: [die Führung im Dom, das Straßenfest, die Schifffahrt]
        answer: die Führung im Dom
      - type: tf
        q: Für die Schifffahrt muss man sich vorher anmelden.
        ru: На прогулку на теплоходе нужно записаться заранее.
        answer: true

