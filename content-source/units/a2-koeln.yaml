id: a2-koeln
level: A2
city: Köln
country: DE
title: Feste & Freizeit
title_ru: Праздники и досуг
intro: |
  Вы в Кёльне: карнавал, день рождения у друзей, свадьба, выходные на Рейне. В юните учимся приглашать и отвечать на приглашения, рассказывать о хобби, погоде и праздниках, договариваться о встрече.
  Грамматика: Wechselpräpositionen (wo? / wohin?), сравнение прилагательных, окончания прилагательных, возвратные глаголы и придаточные с weil.
  Попутно — австрийские варианты: Fasching вместо Karneval, heuer, Sackerl, Servus.

grammar:
  # ------------------------------------------------------------------
  - id: kn-g-wechselpraep
    title: "Wechselpräpositionen: wo? (Dativ) – wohin? (Akkusativ)"
    title_ru: Предлоги места с дательным и винительным падежом
    terms:
      - t: Präposition
        ru: предлог (in, auf, an …)
      - t: Wechselpräposition
        ru: "предлог, после которого бывает и Dativ, и Akkusativ: an, auf, hinter, in, neben, über, unter, vor, zwischen"
      - t: Dativ (Dat.)
        ru: дательный падеж; здесь отвечает на вопрос wo? (где?)
      - t: Akkusativ (Akk.)
        ru: винительный падеж; здесь отвечает на вопрос wohin? (куда?)
      - t: wo? / wohin?
        ru: где? (место) / куда? (направление, движение к цели)
      - t: Position / Richtung
        ru: место, где что-то находится / направление, куда что-то перемещают
      - t: Verschmelzung (Kurzform)
        ru: "слияние предлога с артиклем: in dem → im, an dem → am, in das → ins, an das → ans"
      - t: maskulin (m) / feminin (f) / neutrum (n) / Plural (Pl.)
        ru: мужской / женский / средний род / множественное число
    meaning: |
      После девяти предлогов (an, auf, hinter, in, neben, über, unter, vor, zwischen) падеж зависит от вопроса.
      wo? — предмет или человек уже находится в каком-то месте → Dativ: Die Torte steht auf dem Tisch.
      wohin? — кто-то перемещает предмет или сам движется к цели → Akkusativ: Ich stelle die Torte auf den Tisch.
      Пары глаголов: stehen (стоять) → stellen (ставить); liegen (лежать) → legen (класть); sitzen (сидеть) → sich setzen (садиться). hängen — и «висеть» (wo? + Dat.), и «вешать» (wohin? + Akk.).
      Артикли в Dativ: der → dem, die → der, das → dem, die (Pl.) → den, а к существительному во множественном числе добавляется -n (если слово уже не оканчивается на -n): in den Gläsern.
      Артикли в Akkusativ меняются только в мужском роде: der → den. die, das, die (Pl.) остаются.
    steps:
      - de: Wo ist die Torte? – Sie steht auf dem Tisch.
        ru: "wo? + stehen → Dativ: der Tisch → auf dem Tisch."
      - de: Wohin stellst du die Torte? – Ich stelle sie auf den Tisch.
        ru: "wohin? + stellen → Akkusativ: der Tisch → auf den Tisch."
      - de: Das Kostüm hängt im Schrank.
        ru: "wo? → Dativ: in dem Schrank → im Schrank."
      - de: Ich hänge das Kostüm in den Schrank.
        ru: wohin? → Akkusativ, слияния нет — in den Schrank.
      - de: Die Gäste sitzen schon im Garten. – Setz dich doch auch in den Garten!
        ru: sitzen (где?) → Dat.; sich setzen (куда?) → Akk.
      - de: Wir gehen heute Abend ins Theater. – Gestern waren wir auch im Theater.
        ru: Движение к цели → ins (in das); место → im (in dem).
      - de: Die Flaschen stehen zwischen den Gläsern.
        ru: "Dativ Plural: den + существительное на -n: die Gläser → den Gläsern."
    table:
      head: [Präposition, "wo? (Dativ)", "wohin? (Akkusativ)"]
      rows:
        - [in, im Schrank (der), in den Schrank]
        - [auf, auf dem Tisch (der), auf den Tisch]
        - [an, an der Wand (die), an die Wand]
        - [neben, neben dem Sofa (das), neben das Sofa]
        - [unter, unter dem Bett (das), unter das Bett]
        - [über, über der Tür (die), über die Tür]
        - [vor, vor dem Haus (das), vor das Haus]
        - [hinter, hinter dem Vorhang (der), hinter den Vorhang]
        - [zwischen, zwischen den Stühlen (Pl.), zwischen die Stühle]
    exam: |
      На Goethe A2 и ÖSD A2 отдельного задания на предлоги нет, но они нужны всё время: в Schreiben (Wir treffen uns vor dem Kino), в Sprechen Teil 3, когда вы планируете праздник (Wir stellen die Tische in den Garten), в Hören и Lesen, когда ищут место встречи.
      Ошибка в падеже обычно не мешает пониманию, но снижает оценку за точность.
    traps:
      - "Не путайте глаголы: liegen (лежать, без дополнения) ≠ legen (класть что-то). Das Handy liegt auf dem Tisch. — Ich lege das Handy auf den Tisch."
      - "Движение внутри места — это wo?: Wir tanzen im Saal (танцуем в зале, а не входим в него)."
      - "Праздник как место: auf der Party / auf der Hochzeit sein (Dat.) — auf die Party / auf die Hochzeit gehen (Akk.)."
      - "Города и страны без артикля: wohin? → nach (Ich fahre nach Köln), wo? → in (Ich bin in Köln). Но с артиклем: in die Schweiz / in der Schweiz."
      - "Не все предлоги меняют падеж: mit, zu, bei, von, aus, nach — всегда Dativ; für, durch, ohne, gegen, um — всегда Akkusativ."
    exercises:
      - type: choice
        q: Die Kerzen stehen schon ___ Tisch.
        options: [auf dem, auf den, auf der]
        answer: auf dem
        why: "wo? + stehen → Dativ; der Tisch → dem."
      - type: choice
        q: Stell die Torte bitte ___ Kühlschrank!
        options: [in den, im, in die]
        answer: in den
        why: "wohin? + stellen → Akkusativ; der Kühlschrank → den."
      - type: choice
        q: Wo ist mein Kostüm? – Es hängt ___ Schrank.
        options: [im, ins, in den]
        answer: im
        why: "wo? → Dativ: in dem → im."
      - type: choice
        q: Wir hängen die Luftballons ___ Wand.
        options: [an die, an der, am]
        answer: an die
        why: "hängen + wohin? (вешаем) → Akkusativ; die Wand → die."
      - type: choice
        q: Die Gäste sitzen schon ___ Garten.
        options: [im, in den, ins]
        answer: im
        why: "sitzen → wo? → Dativ: in dem Garten → im Garten."
      - type: choice
        q: Ich ___ die Geschenke auf den Tisch.
        options: [lege, liege, sitze]
        answer: lege
        why: "Кладу что-то (wohin?) → legen. liegen — «лежать»."
      - type: choice
        q: Gehst du am Samstag auch ___ Party von Jonas?
        options: [auf die, auf der, auf den]
        answer: auf die
        why: "gehen → wohin? → Akkusativ: auf die Party."
      - type: gap
        q: Die Katze schläft unter ___ Sofa. (das)
        answer: [dem]
        why: "wo? → Dativ; das Sofa → dem Sofa."
      - type: gap
        q: Setz dich doch neben ___ Oma! (die)
        answer: [die]
        why: "sich setzen → wohin? → Akkusativ; die Oma → die."
      - type: gap
        q: Wir fahren am Samstag ___ Stadion. (in + das)
        answer: [ins]
        why: "wohin? → Akkusativ: in das → ins."
      - type: gap
        q: Die Flaschen stehen zwischen ___ Gläsern. (die, Pl.)
        answer: [den]
        why: "wo? → Dativ Plural: den Gläsern."
      - type: gap
        q: Auf ___ Hochzeit haben wir bis drei Uhr getanzt. (die)
        answer: [der]
        why: "Где танцевали? → Dativ; die Hochzeit → der Hochzeit."
      - type: table
        title: wo? oder wohin?
        head: [Präposition + Nomen, "wo? (Dativ)", "wohin? (Akkusativ)"]
        rows:
          - [in + der Schrank, "?im Schrank", "?in den Schrank"]
          - [auf + der Tisch, "?auf dem Tisch", "?auf den Tisch"]
          - [an + die Wand, "?an der Wand", "?an die Wand"]
          - [neben + das Sofa, "?neben dem Sofa", "?neben das Sofa"]
          - [unter + die Stühle, "?unter den Stühlen", "?unter die Stühle"]
      - type: order
        answer: Wir stellen den Tisch in den Garten.
        tokens: [Wir, stellen, den Tisch, in den Garten]
        ru: Мы ставим стол в сад.
      - type: order
        answer: Die Gläser stehen schon auf dem Tisch.
        tokens: [Die Gläser, stehen, schon, auf dem Tisch]
        ru: Бокалы уже стоят на столе.

  # ------------------------------------------------------------------
  - id: kn-g-komparativ
    title: Komparativ und Superlativ
    title_ru: Сравнительная и превосходная степень
    terms:
      - t: Adjektiv
        ru: прилагательное (groß, schön)
      - t: Adverb
        ru: наречие (gern, oft)
      - t: Positiv
        ru: исходная форма (schnell)
      - t: Komparativ
        ru: сравнительная степень (schneller — быстрее)
      - t: Superlativ
        ru: превосходная степень (am schnellsten — быстрее всех)
      - t: Umlaut
        ru: "гласная с двумя точками: ä, ö, ü (alt → älter)"
      - t: unregelmäßig
        ru: неправильный — формы надо выучить (gut → besser → am besten)
      - t: als
        ru: «чем» — после Komparativ (größer als)
      - t: so … wie
        ru: «такой же …, как» — с исходной формой (so groß wie)
    meaning: |
      Komparativ: к прилагательному добавляем -er: schnell → schneller. Предмет сравнения — с als: Köln ist größer als Bonn.
      Superlativ: am …-(e)sten: Im Juli ist es am wärmsten. Перед существительным — с артиклем и окончанием: der wärmste Monat.
      Многие короткие слова с a, o, u получают Umlaut: alt → älter → am ältesten, groß → größer → am größten, jung → jünger.
      После -t, -d, -s, -ß, -z в Superlativ вставляем -e-: am ältesten, am heißesten, am kürzesten.
      Неправильные: gut → besser → am besten; gern → lieber → am liebsten; viel → mehr → am meisten; hoch → höher → am höchsten.
      Равенство — so … wie с исходной формой: Bonn ist nicht so groß wie Köln.
    steps:
      - de: Der Rhein ist lang. Er ist länger als die Mosel.
        ru: Komparativ + als; lang → länger (Umlaut).
      - de: Ist die Donau so lang wie der Rhein? – Nein, sie ist noch länger.
        ru: so … wie — исходная форма; noch länger — «ещё длиннее».
      - de: Im November ist es kalt, aber im Januar ist es meistens am kältesten.
        ru: Superlativ после глагола — am …sten.
      - de: Das war der schönste Tag des Jahres.
        ru: Перед существительным — der/die/das + -ste (schön → der schönste).
      - de: Ich tanze gern, aber ich singe lieber. Am liebsten spiele ich Gitarre.
        ru: gern → lieber → am liebsten.
      - de: Paul hat viele Freunde, aber Lea hat noch mehr.
        ru: viel → mehr; mehr не склоняется.
      - de: Das Wetter ist heute besser als gestern.
        ru: gut → besser (не «guter»).
    table:
      head: [Positiv, Komparativ, Superlativ]
      rows:
        - [schnell, schneller, am schnellsten]
        - [schön, schöner, am schönsten]
        - [alt, älter, am ältesten]
        - [groß, größer, am größten]
        - [warm, wärmer, am wärmsten]
        - [teuer, teurer, am teuersten]
        - [hoch, höher, am höchsten]
        - [gut, besser, am besten]
        - [gern, lieber, am liebsten]
        - [viel, mehr, am meisten]
    exam: |
      В Sprechen Teil 2 (A2) вы рассказываете о себе — сравнения звучат естественно: Ich feiere lieber zu Hause als im Restaurant. Am liebsten mag ich Weihnachten.
      В Sprechen Teil 3 при планировании: Samstag ist besser als Sonntag. В Lesen и Hören часто сравнивают цены, время и погоду: billiger, früher, wärmer.
    traps:
      - "После Komparativ — als, не wie: größer als ich. wie — только с исходной формой: so groß wie ich."
      - "Не «mehr schön», а schöner. mehr — только Komparativ от viel."
      - "gern → lieber, а не «gerner»; gut → besser, а не «guter»."
      - "teuer → teurer, dunkel → dunkler: -e- из основы выпадает."
      - "Superlativ без существительного — am …sten: Er läuft am schnellsten. Не «Er läuft der schnellste»."
    exercises:
      - type: choice
        q: Köln ist ___ als Bonn.
        options: [größer, großer, mehr groß]
        answer: größer
        why: groß → größer (Umlaut).
      - type: choice
        q: Im Juli ist es in Köln meistens ___.
        options: [am wärmsten, am wärmste, wärmsten]
        answer: am wärmsten
        why: Superlativ после глагола — am …sten.
      - type: choice
        q: Ich trinke gern Tee, aber ___ trinke ich Kaffee.
        options: [lieber, gerner, mehr gern]
        answer: lieber
        why: gern → lieber → am liebsten.
      - type: choice
        q: Mein Bruder ist so alt ___ ich – wir sind Zwillinge.
        options: [wie, als, dann]
        answer: wie
        why: Равенство — so … wie.
      - type: choice
        q: Heute ist es viel kälter ___ gestern.
        options: [als, wie, so]
        answer: als
        why: После Komparativ — als.
      - type: gap
        q: Fußball finde ich gut, aber Basketball finde ich ___. (gut)
        answer: [besser]
        why: gut → besser.
      - type: gap
        q: Lena isst viel Kuchen, aber Tim isst noch ___. (viel)
        answer: [mehr]
        why: viel → mehr.
      - type: gap
        q: Am ___ tanze ich Salsa. (gern)
        answer: [liebsten]
        why: gern → am liebsten.
      - type: gap
        q: Die Karten für das Konzert sind ___ als die Kinokarten. (teuer)
        answer: [teurer]
        why: teuer → teurer (e из основы выпадает).
      - type: gap
        q: Im Winter sind die Tage ___ als im Sommer. (kurz)
        answer: [kürzer]
        why: kurz → kürzer (Umlaut).
      - type: table
        title: Positiv – Komparativ – Superlativ
        head: [Positiv, Komparativ, Superlativ]
        rows:
          - [schön, "?schöner", "?am schönsten"]
          - [alt, "?älter", "?am ältesten"]
          - [gut, "?besser", "?am besten"]
          - [gern, "?lieber", "?am liebsten"]
          - [viel, "?mehr", "?am meisten"]
          - [hoch, "?höher", "?am höchsten"]
      - type: order
        answer: Der Rhein ist länger als die Mosel.
        tokens: [Der Rhein, ist, länger, als, die Mosel]
        ru: Рейн длиннее Мозеля.
      - type: order
        answer: Am liebsten feiere ich mit meinen Freunden.
        tokens: [Am liebsten, feiere, ich, mit meinen Freunden]
        also: [Ich feiere am liebsten mit meinen Freunden.]
        ru: Больше всего я люблю праздновать с друзьями.

  # ------------------------------------------------------------------
  - id: kn-g-adjektiv
    title: Adjektivdeklination nach der und ein
    title_ru: Окончания прилагательных после определённого и неопределённого артикля
    terms:
      - t: Adjektivdeklination
        ru: изменение окончаний прилагательного перед существительным
      - t: Endung
        ru: окончание (-e, -en, -er, -es)
      - t: bestimmter Artikel
        ru: определённый артикль (der, die, das; тж. dieser, welcher)
      - t: unbestimmter Artikel
        ru: неопределённый артикль (ein, eine); так же склоняются kein и mein, dein …
      - t: Possessivartikel
        ru: притяжательный артикль (mein, dein, sein, ihr, unser …)
      - t: Nominativ (Nom.)
        ru: именительный падеж — подлежащее (wer? was?)
      - t: Akkusativ (Akk.)
        ru: винительный падеж — прямое дополнение (wen? was?), после für, ohne …
      - t: Dativ (Dat.)
        ru: дательный падеж — wem?, после mit, bei, von, zu …
      - t: m / f / n / Pl.
        ru: мужской / женский / средний род / множественное число
    meaning: |
      Если прилагательное стоит после глагола, окончания нет: Das Kleid ist rot.
      Если оно стоит перед существительным, у него есть окончание: das rote Kleid, ein rotes Kleid.
      После der / die / das: окончание -e в пяти случаях — Nominativ m, f, n и Akkusativ f, n. Во всех остальных (Akk. m, весь Dativ, весь Plural) — -en.
      После ein / eine (и kein, mein …) — почти так же. Разница там, где у ein нет окончания: в Nominativ m прилагательное берёт -er (ein roter Rock), в Nominativ и Akkusativ n — -es (ein rotes Kleid). Прилагательное «показывает» род, который не видно по ein.
      У ein нет множественного числа; с kein / mein во множественном — всегда -en: meine roten Schuhe.
    steps:
      - de: Der Rock ist rot.
        ru: Прилагательное после глагола — без окончания.
      - de: Der rote Rock gefällt mir. – Ein roter Rock gefällt mir.
        ru: "Nom. m: после der → -e; после ein → -er."
      - de: Ich trage das bunte Kostüm. – Ich trage ein buntes Kostüm.
        ru: "Akk. n: после das → -e; после ein → -es."
      - de: Ben kauft den neuen Anzug. – Ben kauft einen neuen Anzug.
        ru: "Akk. m: и после den, и после einen → -en."
      - de: Lena trägt eine lange weiße Bluse.
        ru: "Akk. f: eine + -e; у двух прилагательных одинаковое окончание."
      - de: Wir feiern mit unseren alten Freunden in einem kleinen Café.
        ru: Dativ — всегда -en.
    table:
      head: [Kasus, "m (der Rock)", "f (die Bluse)", "n (das Kleid)", "Pl. (die Schuhe)"]
      rows:
        - [Nom. + der, der rote Rock, die rote Bluse, das rote Kleid, die roten Schuhe]
        - [Nom. + ein, ein roter Rock, eine rote Bluse, ein rotes Kleid, meine roten Schuhe]
        - [Akk. + der, den roten Rock, die rote Bluse, das rote Kleid, die roten Schuhe]
        - [Akk. + ein, einen roten Rock, eine rote Bluse, ein rotes Kleid, meine roten Schuhe]
        - [Dat. + der, dem roten Rock, der roten Bluse, dem roten Kleid, den roten Schuhen]
        - [Dat. + ein, einem roten Rock, einer roten Bluse, einem roten Kleid, meinen roten Schuhen]
    exam: |
      В Sprechen и Schreiben A2 нужны описания: was Sie anziehen, wie das Fest war (Es war eine schöne Feier. Ich habe ein langes Kleid getragen.).
      Отдельно окончания не проверяют, но частые ошибки снижают оценку за грамматическую правильность. Начните с самых частых форм: ein schönes …, eine schöne …, einen schönen …, mit einem schönen …
    traps:
      - "После глагола окончания нет: Das Fest war schön (не «schönes»)."
      - "Nom. m после ein — -er: Das ist ein toller Hut. После der — -e: der tolle Hut."
      - "В Dativ всегда -en, и в мужском, и в женском, и в среднем роде: mit der neuen Kette, mit einem neuen Anzug."
      - "Plural без артикля имеет другие окончания (rote Schuhe) — это тема B1; пока используйте die / meine / keine: die roten Schuhe."
      - "Несколько прилагательных подряд получают одно и то же окончание: ein langes weißes Kleid."
    exercises:
      - type: choice
        q: Ich trage heute das ___ Kleid.
        options: [rote, roten, rotes]
        answer: rote
        why: "Akk. n после das → -e."
      - type: choice
        q: Ben kauft einen ___ Anzug für die Hochzeit.
        options: [neuen, neue, neuer]
        answer: neuen
        why: "Akk. m → -en."
      - type: choice
        q: Das war ein ___ Fest!
        options: [schönes, schöne, schönen]
        answer: schönes
        why: "Nom. n после ein → -es."
      - type: choice
        q: Wir feiern mit unseren ___ Freunden.
        options: [alten, alte, alter]
        answer: alten
        why: Dativ Plural → -en.
      - type: choice
        q: Die Braut trägt eine ___ Kette.
        options: [goldene, goldenen, goldener]
        answer: goldene
        why: "Akk. f после eine → -e."
      - type: choice
        q: Wie findest du den ___ Hut?
        options: [großen, große, großer]
        answer: großen
        why: "Akk. m после den → -en."
      - type: gap
        q: Mit dem ___ Kostüm erkennt dich niemand. (lustig)
        answer: [lustigen]
        why: Dativ → -en.
      - type: gap
        q: Das ist ein ___ Hut! (toll)
        answer: [toller]
        why: "Nom. m после ein → -er."
      - type: gap
        q: Ich wünsche mir eine ___ Gitarre. (neu)
        answer: [neue]
        why: "Akk. f после eine → -e."
      - type: gap
        q: Wir sitzen in einem ___ Café am Rhein. (klein)
        answer: [kleinen]
        why: Dativ → -en.
      - type: gap
        q: Der ___ Umzug beginnt um elf Uhr. (groß)
        answer: [große]
        why: "Nom. m после der → -e."
      - type: table
        title: bunt — nach der / die / das
        head: [Kasus, m, f, n, Pl.]
        rows:
          - ["Nom. (der / die / das / die)", "?bunte", "?bunte", "?bunte", "?bunten"]
          - ["Akk. (den / die / das / die)", "?bunten", "?bunte", "?bunte", "?bunten"]
          - ["Dat. (dem / der / dem / den)", "?bunten", "?bunten", "?bunten", "?bunten"]
      - type: table
        title: bunt — nach ein / eine / mein
        head: [Kasus, m, f, n, Pl.]
        rows:
          - ["Nom. (ein / eine / ein / meine)", "?bunter", "?bunte", "?buntes", "?bunten"]
          - ["Akk. (einen / eine / ein / meine)", "?bunten", "?bunte", "?buntes", "?bunten"]
