<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch-Reise</title>
<style>
  :root { --bg: #f8efe2; --text: #2e2017; --muted: #6d5643; --card: #fff; --primary: #8a3f17; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1611; --text: #f5e9dc; --muted: #c8b29c; --card: #2c2018; --primary: #f0a35e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; width: 100%; background: var(--card); border-radius: 20px; padding: 24px; }
  h1 { margin: 0 0 6px; } p { color: var(--muted); }
  a { display: block; margin-top: 12px; padding: 14px 18px; border-radius: 14px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 700; text-align: center; }
  @media (prefers-color-scheme: dark) { a { color: #24150a; } }
</style>
</head>
<body>
<main>
  <h1>Deutsch-Reise</h1>
  <p>Deutsch lernen von A1 bis B2 — eine Reise von Hamburg bis Wien.</p>
  <a href="app-beta/">Beta öffnen</a>
</main>
</body>
</html>
